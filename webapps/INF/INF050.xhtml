<script type="text/javascript" charset="UTF-8">/*<![CDATA[*//*******************************************************************************
* FormID(명) : INF110.xhtml
* Form 설명  : 녹취청취이력
* 작성자     : 
* 작성일     : 
* =================================================================
* 변경내역 : 
* * YYYYMMDD 담당자명 변경내용(Why?,What?)
* =================================================================
* *******************************************************************************/
var v_url="service::cs.inf050.player.log.sel.do";
/* **********************************************************
 *    페이지 로드 함수
 *************************************************************/
function page_load(event) {
	try{
		XwingObject();
		
		$cal_date.setValue(g_toDate()); 
		g_createOrg("pan_org", 3, "Y", "Y", "N", "", "전체",false,false,true);
		f_getCode();
		//엑셀다운권한정의
		excelDownAuth($btn_excel);
		
	}catch(e){
		xwing.Dialog.alert(e);
	}
}


/* **********************************************************
 *    코드북 로드 함수(조회 조건/청취시간)
 *************************************************************/
function f_getCode() {
	var param = {
			cmd : "getCodes",
			codeType : "RPT200,SYS102",
			useyn : "Y"
		};
		var opt = {
			reqId : "getCodes",
			url : "service::cs.com.codeutil.do",
			param : param
		};
	Xwing.request(opt, callback);	
}


/* **********************************************************
 *    조회 버튼 클릭
 *************************************************************/
function btn_search_click() {
	var strSQL = '';
	
	if($rdo_gubun.getValue() == '1'){
		strSQL = "cs.inf050.rec_user.player.log.sel";
	}else if($rdo_gubun.getValue() == '2'){
		strSQL = "cs.inf050.play_user.player.log.sel";
	}
	
	var param = {
		_sqlName	: strSQL,
		play_date : $cal_date.getValue(),
		stime : $edt_stime.getValue(),
		etime : $edt_etime.getValue(),
		ucid : $edt_ucid.getValue(),
		log_gb: $cmb_type.getValue()
	};
	
	g_orgToParam("", param);
	
	var opt = {
			reqId : 'player_log',
			url : v_url,
			param : param,
			indicator : null,
			showError : true
		};
	Xwing.request(opt, callback);
}


/* **********************************************************
 *    그리드 클릭 : 녹취 팝업 플레이어 호출
 *************************************************************/
function grd_list_click(event) {
	var cell_idx = event.cell._getColIndex();
	var start_time = $DS_PLAYER_LOG.getValue(event.rowIdx, "REC_START_TIME");
	var rec_key = $DS_PLAYER_LOG.getValue(event.rowIdx, "UCID");
	var log_gb = 'L'; //사용자권한에 따라 차후 달라질듯
	var ced_no = $DS_PLAYER_LOG.getValue(event.rowIdx, "CED_NO");
	var file_path = $DS_PLAYER_LOG.getValue(event.rowIdx, "FILE_PATH");

	if(cell_idx == 12){
		var param={
				rec_key: rec_key,
				start_time : start_time,
				log_gb:log_gb,
				file_path : file_path,
				ced_no : ced_no
		};
		play(param, 'pan_player', 'Y');
	}
}


/* **********************************************************
 *    콜백 함수
 *************************************************************/
function callback(reqId, res, err, xhr) {
	
	if (res.Error != '0') {
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "getCodes" : 
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS102.setData(res.SYS102.column, res.SYS102.record);
			
			var stime = $DS_RPT200.getValue($DS_RPT200.indexOfRow('CODEID',$DS_SYS102.getValue(0,'ETC3')), 'ETC1') + '00';
			var etime = Number($DS_RPT200.getValue($DS_RPT200.indexOfRow('CODEID',$DS_SYS102.getValue(0,'ETC4')), 'ETC2'))+41 + '00';
			$edt_stime.setValue(stime);
			$edt_etime.setValue(etime);
			btn_search_click();
			break;
		case "player_log" :
			$DS_PLAYER_LOG.setData(res.DS_PLAYER_LOG.column, res.DS_PLAYER_LOG.record);
			$edit_rowcnt.setValue($DS_PLAYER_LOG.size());
			break;
	}
	
}


/* **********************************************************
 *    엑셀 다운로드 함수
 *************************************************************/
function btn_excel_click(event) {
	if(Xwing.getDataset('DS_PLAYER_LOG').size() > 0) {
		$grd_list_excel.setBinddataset('DS_PLAYER_LOG');
		$grd_list_excel.exportData('녹취청취이력',  '../jsp/export2.jsp',true);
		//$grd_list_excel.exportData('녹취청취이력',  global('G_SERVERURL') + '/jsp/export2.jsp',true);
		$grd_list_excel.setBinddataset('');
	} else {
		new xwing.Dialog.alert("출력할 데이터가 없습니다.");
	}
}


/* **********************************************************
 *    엑셀 다운로드 시 시간 format을 맞춰주기위한 grid expr
 *************************************************************/
function expr_time(cellObj,rowIdx) {
	var opt = {};
	opt['value'] = $DS_PLAYER_LOG.getValue(rowIdx,'PLAY_TIME');
	return opt;
}

function expr_date(cellObj,rowIdx) {
	var opt = {};
	opt['value'] = $DS_PLAYER_LOG.getValue(rowIdx,'REC_START_TIME');
	return opt;
}


function edt_sch_keyup(event) {
	if(event.event.keyCode == '13') {
		btn_search_click();
	}
}
