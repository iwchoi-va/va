<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/function page_load(event) {
	XwingObject();
	f_selCodeBook();
}

function f_selCodeBook() {
	var param = {
		cmd : "getCodes",
		codeType : "SYS070",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_selCodeBook",
		url : "service::cs.com.codeutil.do",
		param : param,
		indicator : false
	};
	Xwing.request(opt, callback);
}

function cmb_server_ip_change(event) {
	Xwing.getDataset("DS_SERVER_IP").setCursor(parseInt(Xwing.getCombo("cmb_server_ip").getItemindex()));
}

function btn_sel_click(event) {
	if(g_isEmpty(Xwing.getEdit("edt_server_ip").getValue())) {
		xwing.Dialog.alert("XCron 서버 정보에서 서버IP를 선택하십시오.");
		return false;
	}

	var param = {
		cmd	: "getinfo"
		,type	: "Service"
		,SERVER_IP	: Xwing.getEdit("edt_server_ip").getValue()
		,SERVER_PORT	: Xwing.getEdit("edt_port").getValue()
		,SERVER_TIMEOUT	: Xwing.getEdit("edt_timeout").getValue()
	};

	var opt = {
		reqId		: "btn_sel_click"
		,url		: "service::cs.xcron.control.exe.do"
		,param		: param
		,indicator	: null
		,showError	: true
	};
	
	Xwing.request(opt, callback);
}

function f_expr(cellObj,rowIdx) {
	var bindcolumn = cellObj.getBindcolumn();
	var opt = {};
	
	opt["bgcolor"] = ( Xwing.getDataset("DS_SERVICE_LIST").getValue(rowIdx, "RUNNING") == "true" ? "lightsalmon" : "" ) ;
	if( bindcolumn == "RUNNING")
		opt["value"] = ( Xwing.getDataset("DS_SERVICE_LIST").getValue(rowIdx, bindcolumn) == "true" ? "Y" : "N" );
	
	if (opt)
		return opt;
}

function dgrd_service_list_dblclick(event) {
	Xwing.getEdit("edt_service_id").setValue(Xwing.getDataset("DS_SERVICE_LIST").getValue("ID"));

	if(g_isEmpty(Xwing.getEdit("edt_service_id").getValue()))
		return false;
	
	var param = {
		cmd	: "getinfo"
		,type	: "Parameter"
		,service : Xwing.getEdit("edt_service_id").getValue()
		,SERVER_IP	: Xwing.getEdit("edt_server_ip").getValue()
		,SERVER_PORT	: Xwing.getEdit("edt_port").getValue()
		,SERVER_TIMEOUT	: Xwing.getEdit("edt_timeout").getValue()
	};
	
	var opt = {
		reqId		: "dgrd_service_list_dblclick"
		,url		: "service::cs.xcron.control.exe.do"
		,param		: param
		,indicator	: null
		,showError	: true
	};
	
	Xwing.request(opt, callback);
}

function btn_exe_click(event) {
	if(g_isEmpty( Xwing.getEdit("edt_server_ip").getValue())) {
		xwing.Dialog.alert("XCron 서버 정보에서 서버IP를 선택하십시오.");
		return false;
	}
	
	if(g_isEmpty(Xwing.getEdit("edt_service_id").getValue())) {
		xwing.Dialog.alert("서비스목록에서 서비스를 선택(더블클릭)하십시오.");
		return false;
	}
	
	Xwing.getDataset("DS_REQUEST_PARAM").clear();
	
	var strName = "";
	var nLength = 0; 
	var strValue = "";
	var arrRow = [];

	for( var i = 0; i < Xwing.getDataset("DS_PARAM").size(); i++ ) {	
		strName = Xwing.getDataset("DS_PARAM").getValue(i, "NAME");
		nLength = parseInt(Xwing.getDataset("DS_PARAM").getValue(i, "LENGTH"));
		strValue = Xwing.getDataset("DS_PARAM").getValue(i, "VALUE");
		
		if( nLength < strValue.length )
		{
			xwing.Dialog.alert("입력한 [" + strName + "] 매개변수의 길이가 정의된 Length 를 초과했습니다.<br/>'"+nLength+"'이하로 입력하십시오.");
			return false;
		}
		
		Xwing.getDataset("DS_REQUEST_PARAM").setColumnInfo(Xwing.getDataset("DS_REQUEST_PARAM").getColumnInfo().concat(strName));
		arrRow[i] = strValue;
	}
	
	var param = null;
	
	if(Xwing.getDataset("DS_PARAM").size() != 0) {
		Xwing.getDataset("DS_REQUEST_PARAM").addRow(arrRow);
		
		param = {
				cmd	: "exec"
				,service : Xwing.getEdit("edt_service_id").getValue()
				,SERVER_IP	: Xwing.getEdit("edt_server_ip").getValue()
				,SERVER_PORT	: Xwing.getEdit("edt_port").getValue()
				,SERVER_TIMEOUT	: Xwing.getEdit("edt_timeout").getValue()
				,XCRON_REQUEST : Xwing.getDataset("DS_REQUEST_PARAM")
			};
	} else {
		
		param = {
				cmd	: "exec"
				,service : Xwing.getEdit("edt_service_id").getValue()
				,SERVER_IP	: Xwing.getEdit("edt_server_ip").getValue()
				,SERVER_PORT	: Xwing.getEdit("edt_port").getValue()
				,SERVER_TIMEOUT	: Xwing.getEdit("edt_timeout").getValue()
			};
		
	}
	
	var opt = {
		reqId		: "btn_exe_click"
		,url		: "service::cs.xcron.control.exe.do"
		,param		: param
		,indicator	: null
		,showError	: true
	};

	Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	
	switch(reqId) {
	
	case "f_selCodeBook":

		Xwing.getDataset("DS_SERVER_IP").setData(res.SYS070.column, res.SYS070.record);
		Xwing.getCombo("cmb_server_ip").setItemindex("0");
		
		break;
		
	case "btn_sel_click":
		Xwing.getDataset("DS_SERVICE_LIST").clear();
		Xwing.getDataset("DS_SERVICE_LIST").setData(res.XCRON_RESULT.column, res.XCRON_RESULT.record);
		
		Xwing.getDataset("DS_SERVICE_LIST").sort("ID", false);
		
		for(var i=0; i<$DS_SERVICE_LIST.size(); i++) {
			var v_lastruntime = $DS_SERVICE_LIST.getValue(i, "LASTRUNTIME");
			var pattern = /\D{1}/g;
			v_lastruntime = v_lastruntime.toString().replace(pattern, "");
			
			$DS_SERVICE_LIST.setValue(i, "LASTRUNTIME", v_lastruntime);
		}
		
		Xwing.getDataset("DS_SERVICE").copyFrom("DS_SERVICE_LIST");
		Xwing.getDataset("DS_SERVICE").insertRow(0);
		Xwing.getDataset("DS_SERVICE").setValue(0, "ID", "전체");
		Xwing.getCombo("cmb_service_id").setItemindex("0");
		
		break;
		
	case "dgrd_service_list_dblclick":
		Xwing.getDataset("DS_PARAM").clear();
		Xwing.getDataset("DS_PARAM").setData(res.XCRON_RESULT.column, res.XCRON_RESULT.record);
		
		break;
		
	case "btn_exe_click":
		xwing.Dialog.alert('처리되었습니다.');
		$edt_service_id.setValue("");
		$DS_PARAM.clear();
		$DS_REQUEST_PARAM.clear();
		btn_sel_click();
		break;
		
	case "f_test_sel":
		Xwing.getDataset("DS_TEST").clear();
		Xwing.getDataset("DS_TEST").setData(res.DS_TEST.column, res.DS_TEST.record);
		alert($DS_TEST);
		break;
	}
}


function button0_click(event) {
	var param = {
			_sqlName : 'vsens.xcron.kyobo.test_3'
		};

		var opt = {

		Xwing.request(opt, callback);
}/*]]>*/</script>
