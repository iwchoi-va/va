function show_pnl(v){
	if(v == "B_UPDATE"){
		$pnl_bef_meta.setVisible(true);
		$pnl_meta.setVisible(false);
	}else{
		$pnl_meta.setVisible(true);
		$pnl_bef_meta.setVisible(false);
	}
}


function btn_m_search_click(event) {
	
	var ced_no = $edt_m_ced_no.getValue();
	var ucid = $edt_m_ucid.getValue();
	
	show_pnl("M_UPDATE");
	
	if(ced_no == "" && ucid == ""){
		xwing.Dialog.alert("둘 중 하나의 값은 필요합니다.");
		return;
	}
	
	var v_param = {
			_sqlName : "inf.inf130.getSttMetaFlag.sel",
			ced_no : ced_no,
			ucid : ucid
		};

		var opt = {
			reqId : "getSttMeta",
			url : v_url,
			param : v_param,
			indicator : null,
			showError : true
		};

		Xwing.request(opt, callback);
	
	
}

//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
//* 수정 함수
//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
function f_update(){
	$DS_UPDATE.clear();
	if(v_flag == "M_UPDATE"){
		var onebon = Xwing.getDataset("DS_META");
		var v_idxs 	= Xwing.getGrid("grd_stt_meta").getCheckedIdx();
		var v_sql = "inf.inf130.meta.flag.upd";
		
		$DS_UPDATE.setColumnInfo(onebon.getColumnInfo());
		for(var i = 0, len = v_idxs.length; i<len; i++){
			$DS_UPDATE.addRow();
			$DS_UPDATE.copyRowFrom($DS_UPDATE.size()-1, onebon, v_idxs[i]);
			$DS_UPDATE.setValue(i,"TA_FLAG",$cmb_ta_f.getValue());
			$DS_UPDATE.setValue(i,"GRD_FLAG",$cmb_grd_f.getValue());
			$DS_UPDATE.setValue(i,"ASS_FLAG",$cmb_ass_f.getValue());
			$DS_UPDATE.setValue(i,"ENC_FLAG",$cmb_enc_f.getValue());
			$DS_UPDATE.setValue(i,"VRS_S_FLAG",$cmb_vrs_s_f.getValue());
			$DS_UPDATE.setValue(i,"BAN_S_FLAG",$cmb_ban_s_f.getValue());
		}
	}else{
		var onebon = Xwing.getDataset("DS_BEF_META");
		var v_idxs 	= Xwing.getGrid("grd_stt_bef_meta").getCheckedIdx();
		var v_sql = "inf.inf130.bef.meta.flag.upd";
		$DS_UPDATE.setColumnInfo(onebon.getColumnInfo());
		for(var i = 0, len = v_idxs.length; i<len; i++){
			$DS_UPDATE.addRow();
			$DS_UPDATE.copyRowFrom($DS_UPDATE.size()-1, onebon, v_idxs[i]);
			$DS_UPDATE.setValue(i,"VA_FLAG",$cmb_va_f.getValue());
		}
	}
	
	xwing.Dialog.confirm("저장하시겠습니까?", $page.getTitle(), function(e){
		if(e){
			var param = {
					_sqlName : v_sql,
					DS_UPDATE : $DS_UPDATE
			};
			
			var opt 	= {
					reqId: "FLAG_UPD",
					url: v_url,
					param: param,
					indicator : null,
					showError : true
				};
				
			Xwing.request(opt, callback);	
			}
		});
}

	if(v_flag == "M_UPDATE"){
		var idx = $DS_META.getCursor();
		
		$cmb_ta_f.setValue($DS_META.getValue(idx,"TA_FLAG"));
		$cmb_grd_f.setValue($DS_META.getValue(idx,"GRD_FLAG"));
		$cmb_ass_f.setValue($DS_META.getValue(idx,"ASS_FLAG"));
		$cmb_enc_f.setValue($DS_META.getValue(idx,"ENC_FLAG"));
		$cmb_vrs_s_f.setValue($DS_META.getValue(idx,"VRS_S_FLAG"));
		$cmb_ban_s_f.setValue($DS_META.getValue(idx,"BAN_S_FLAG"));
	}else{
		var idx = $DS_BEF_META.getCursor();
		
		$cmb_va_f.setValue($DS_BEF_META.getValue(idx,"VA_FLAG"));
	}
}

//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
//* 저장
//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓

	f_update();
}

//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
//* 콜백함수
//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	switch(reqId) {
		case "getSttMeta":
			$DS_META.setData(res.DS_LIST.column, res.DS_LIST.record);
			
			break;
		case "getSttBefMeta":
			$DS_BEF_META.setData(res.DS_LIST.column, res.DS_LIST.record);
			
			break;	
		case "FLAG_UPD":
			xwing.Dialog.alert('저장되었습니다');
			if(v_flag == "M_UPDATE"){
				btn_m_search_click();
			}else{
				btn_b_search_click();
			}
			break;
	}
}

function edt_sch_keydown(event) {
	if(event.event.keyCode == '13') {
			btn_m_search_click();
	}
}

function edt_sch_keydown2(event) {
	if(event.event.keyCode == '13') {
		btn_b_search_click();
	}
}
