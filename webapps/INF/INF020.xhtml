// 우클릭 메뉴리스트
function f_contxtDeptStatus() {
	var v_row = $DS_DEPT_LIST.getCursor();
	var v_user_yn = $DS_DEPT_LIST.getValue(v_row, "USE_YN");
	if (v_user_yn == 'N') {
		xwing.Dialog.alert("사용하지 않는 조직입니다.");
		return false;
	}

	var v_dept_level = $DS_DEPT_LIST.getValue(v_row, "DEPT_LEVEL");	

	$DS_CONTEXT.setValue(0, "disabled", false);
	$DS_CONTEXT.setValue(1, "disabled", false);
	$DS_CONTEXT.setValue(3, "disabled", false);
	$DS_CONTEXT.setValue(4, "disabled", false);
	$DS_CONTEXT.setValue(5, "disabled", false);
	// WFM000 일경우
	if (v_dept_level > 5){
		$DS_CONTEXT.setValue(0, "disabled", true);
		$DS_CONTEXT.setValue(1, "disabled", true);
	} else if (v_dept_level == 5){
		$DS_CONTEXT.setValue(0, "disabled", true);
	} else if (v_dept_level == 4){
		$DS_CONTEXT.setValue(0, "disabled", true);
	} else if (v_dept_level == 3){
		$DS_CONTEXT.setValue(0, "disabled", true);
	} else if (v_dept_level == 2){
		$DS_CONTEXT.setValue(0, "disabled", true);
		$DS_CONTEXT.setValue(5, "disabled", true);
	} else if (v_dept_level == 1){
		$DS_CONTEXT.setValue(0, "disabled", true);
		$DS_CONTEXT.setValue(5, "disabled", true);
		$DS_CONTEXT.setValue(5, "disabled", true);
	} else if (v_dept_level == 0){
		$DS_CONTEXT.setValue(3, "disabled", true);
		$DS_CONTEXT.setValue(4, "disabled", true);
		$DS_CONTEXT.setValue(5, "disabled", true);
	}
}

// 조직위치 이동함수
function f_commonOrder_click(gubun) {
	var v_row_idx = $DS_DEPT_LIST.getCursor();
	var v_ds = $DS_DEPT_LIST.getData("[UPPER_DEPT=='"
			+ $DS_DEPT_LIST.getValue(v_row_idx, "UPPER_DEPT")
			+ "'][DEPT_LEVEL == '"
			+ $DS_DEPT_LIST.getValue(v_row_idx, "DEPT_LEVEL") + "']");
	var v_col_idx_01 = f_getColIdx($DS_DEPT_LIST, "DEPT_CD");
	var v_col_idx_02 = f_getColIdx($DS_DEPT_LIST, "SORT_NO");

	var v_target_dept_cd = "";
	var v_self_dept_cd = $DS_DEPT_LIST.getValue(v_row_idx, "DEPT_CD");

	var v_target_sort_no = 0;
	var v_self_sort_no = $DS_DEPT_LIST.getValue(v_row_idx, "SORT_NO");

	var v_flag = false;
	if (gubun == "U") {
		for ( var i = (v_ds.length - 1); i >= 0; i--) {
			v_target_dept_cd = v_ds[i][v_col_idx_01];
			v_target_sort_no = v_ds[i][v_col_idx_02];
			if (v_flag)
				break;
			if (v_ds[i][v_col_idx_01] == v_self_dept_cd) {
				v_flag = true;
			}
		}
	} else {
		for ( var i = 0; i < v_ds.length; i++) {
			v_target_dept_cd = v_ds[i][v_col_idx_01];
			v_target_sort_no = v_ds[i][v_col_idx_02];
			if (v_flag)
				break;
			if (v_ds[i][v_col_idx_01] == v_self_dept_cd) {
				v_flag = true;
			}
		}
	}

	if (v_target_dept_cd == v_self_dept_cd) return false;

	var v_param = {
		_sqlName : "wfm.hr.hrm100m010p.sortno.upd01,wfm.hr.hrm100m010p.sortno.upd02,wfm.hr.hrm100m010p.dept.sel",
		center_cd : $DS_SCH.getValue("CENTER_CD"),
		use_yn : ($DS_SCH.getValue("USE_YN") == "Y" ? "" : "Y"),
		target_dept_cd : v_target_dept_cd,
		target_sort_no : v_self_sort_no,
		self_dept_cd : v_self_dept_cd,
		self_sort_no : v_target_sort_no
		, sdate : _sdate
		, edate : _edate
	};
	
	var opt = {
		reqId : "f_commonOrder_click",
		url : v_url,
		param : v_param,
		indicator : null,
		showError : true
	};

	Xwing.request(opt, callback);
}

// 공통 ColIdx
function f_getColIdx(dsObj, column) {
	var columns = dsObj.getColumnInfo();
	var i = 0;
	var idx = -1;
	for (i in columns) {
		if (g_toUpper(columns[i]) == g_toUpper(column)) {
			idx = i;
			break;
		}
	}
	return idx;
}

// 조직저장
function f_dept_save(e) {
	if (!g_nvl(e, true)) return;
	
	var v_mode = $edt_mode.getValue();
	var v_param = {};
	var v_sqlName = "";
	
	$DS_DEPT_INFO.setValue(0, 'CHG_ID', global('G_USER_ID'));
	
	if (v_mode == "center_ins" || v_mode == "dept_ins") {	
		//$DS_DEPT_INFO.setValue(0, "TEL_NO1", $edt_tel1_01.getValue() + "-" + $edt_tel1_02.getValue() + "-" + $edt_tel1_03.getValue());
		//$DS_DEPT_INFO.setValue(0, "TEL_NO2", $edt_tel2_01.getValue() + "-" + $edt_tel2_02.getValue() + "-" + $edt_tel2_03.getValue());

		v_sqlName = "wfm.hr.hrm100m010p.dept.ins";
	} else if (v_mode == "center_upd" || v_mode == "dept_upd") {
		
		var v_idx = $DS_DEPT_LIST_OLD.indexOfRow("DEPT_CD", $DS_DEPT_INFO.getValue("DEPT_CD"));
		
		if (v_idx != -1) {
			$DS_DEPT_INFO.setValue(0, "OLD_UPPER_DEPT", $DS_DEPT_LIST_OLD.getValue(v_idx, "UPPER_DEPT"));
			$DS_DEPT_INFO.setValue(0, "OLD_ORG1_CD", $DS_DEPT_LIST_OLD.getValue(v_idx, "ORG1_CD"));
			$DS_DEPT_INFO.setValue(0, "OLD_ORG2_CD", $DS_DEPT_LIST_OLD.getValue(v_idx, "ORG2_CD"));
			$DS_DEPT_INFO.setValue(0, "OLD_ORG3_CD", $DS_DEPT_LIST_OLD.getValue(v_idx, "ORG3_CD"));
			$DS_DEPT_INFO.setValue(0, "OLD_ORG4_CD", $DS_DEPT_LIST_OLD.getValue(v_idx, "ORG4_CD"));
			//$DS_DEPT_INFO.setValue(0, "OLD_ORG5_CD", $DS_DEPT_LIST_OLD.getValue(v_idx, "ORG5_CD"));
			//$DS_DEPT_INFO.setValue(0, "OLD_ORG6_CD", $DS_DEPT_LIST_OLD.getValue(v_idx, "ORG6_CD"));
			//$DS_DEPT_INFO.setValue(0, "TEL_NO1", $edt_tel1_01.getValue() + "-" + $edt_tel1_02.getValue() + "-" + $edt_tel1_03.getValue());
			//$DS_DEPT_INFO.setValue(0, "TEL_NO2", $edt_tel2_01.getValue() + "-" + $edt_tel2_02.getValue() + "-" + $edt_tel2_03.getValue());
		
		}

		v_sqlName = "wfm.hr.HRM100M010P_update_org"
				+ ($DS_DEPT_INFO.getValue("DEPT_LEVEL") == 0 && $DS_DEPT_INFO.getValue("USE_YN") == 'N'? ",wfm.hr.hrm100m010p_update_org_sub2" : ",wfm.hr.HRM100M010P_update_org_sub1");
		
	} else {
		xwing.Dialog.alert("다시 시도해주세요.");
		return false;
	}
	
	v_param["_sqlName"]  = v_sqlName + ",wfm.hr.hrm100m010p.dept.sel,wfm.hr.hrm100m010p.deptinfo.sel";
	v_param["batchlist"] = $DS_DEPT_INFO;
	v_param["center_cd"] = $DS_SCH.getValue("CENTER_CD");
	v_param["use_yn"]    = ($DS_SCH.getValue("USE_YN") == "Y" ? "Y" : "");	
	v_param["dept_cd"]   = $DS_DEPT_INFO.getValue("DEPT_CD");
	v_param["sdate"]    = _sdate;
	v_param["edate"]   = _edate;

	
	//g_select = Xwing.getTree("tre_dept").getSelection();
	//g_deptcd = $DS_DEPT_INFO.getValue(0, "DEPT_CD");
	
	var opt = {
		reqId : "f_dept_save",
		url : v_url,
		param : v_param,
		indicator : null,
		showError : true
	};
	
	//alert($DS_DEPT_INFO);
	Xwing.request(opt, callback);	
}

// 콜백함수
function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	if (reqId == "f_codebook_sel") {
		$DS_SYS011.setData(res.SYS011.column, res.SYS011.record);
		f_dept_sel();
		
	} else if (reqId == "f_dept_sel") {
		var sel_menu = Xwing.getTree('tre_dept').getSelection();

		f_set_ds_dept_list(res);
		$tre_dept.expandAll();
		
		Xwing.getTree('tre_dept').setSelection(sel_menu, true);
		tre_menu_select();
		
	} else if (reqId == "f_commonOrder_click") {
		f_set_ds_dept_list(res);
		$tre_dept.expandAll();
		var v_idx_row = $DS_DEPT_LIST.indexOfRow("DEPT_CD", $DS_DEPT_INFO.getValue("DEPT_CD"));
		$DS_DEPT_LIST.setCursor(v_idx_row);
		
		f_init();
	} else if (reqId == "f_dept_save") {
		f_set_ds_dept_list(res);
		$DS_DEPT_INFO.setData(res.DS_DEPT_INFO.column, res.DS_DEPT_INFO.record);
		$tre_dept.expandAll();
		var v_idx_row = $DS_DEPT_LIST.indexOfRow("DEPT_CD", $DS_DEPT_INFO.getValue("DEPT_CD"));
		
		//alert(v_idx_row);
		
		//alert(g_select);
		//alert($DS_DEPT_LIST);
		Xwing.getTree("tre_dept").setSelection(v_idx_row);
		//alert(Xwing.getTree("tre_dept").getSelection());
		//alert(v_idx_row);
		//alert($tre_dept.getSelection());
		//$DS_DEPT_LIST.setCursor(v_idx_row);
		xwing.Dialog.alert("저장되었습니다.");		
		//f_init();	
	}else if(reqId == "get_dept_cd"){
		Xwing.getDataset("DS_NEW_DEPT_CD").setData(res.DS_NEW_DEPT_CD.column, res.DS_NEW_DEPT_CD.record);

		var new_dept_cd = Xwing.getDataset("DS_NEW_DEPT_CD").getValue(0, "DEPT_CD");
		
		f_set_sub_dept(new_dept_cd);
	} else if(reqId == 'excel') {
		$ds_excel.setData(res.EXCEL_LIST.column, res.EXCEL_LIST.record);		
		if($DS_SCH.getValue("USE_YN") == "N"){
			$ds_excel.setData(res.EXCEL_LIST.column, $ds_excel.getData("[USE_YN == 'Y']"));
		}else{
			$ds_excel.setData(res.EXCEL_LIST.column, res.EXCEL_LIST.record);
		}	
		
		if(Xwing.getDataset('ds_excel').size() > 0) {		
			Xwing.getDataGrid('grd_for_excel').exportData('조직정보', '../jsp/export2.jsp', true);
		} else {
			xwing.Dialog.alert("출력할 데이터가 없습니다.");
		}
	} else if(reqId == 'schvalDept') {
		var totalcount = res.DS_DEPT.totalcount;
		if(totalcount == 0) {
			new xwing.Dialog.alert('존재하지 않는 조직코드입니다.', '조직코드검색');
		} else {
			var dept_name = '';

			if($edt_sch_name.getValue() != '') {
				for(var i = 0; i < res.DS_DEPT.record.length; i++) {
					if(dept_name != '') {
						dept_name = dept_name + "\n";
					}
					
					dept_name = dept_name + $DS_DEPT_LIST.lookUp('DEPT_CD', res.DS_DEPT.record[i][0], 'DEPT_NAME'); 
				}
				xwing.Dialog.alert(dept_name + "\n의 조직과 동일한지 확인하십시오.", '조직코드검색');
			} else {
				dept_name = $DS_DEPT_LIST.lookUp('DEPT_CD', res.DS_DEPT.record[0][0], 'DEPT_NAME');
				new xwing.Dialog.alert("'" + dept_name + "'의 코드와 동일합니다.", '조직코드검색');
			}
		}
	}else if(reqId == 'f_dept_update'){
		
		f_set_ds_dept_list(res);
		$DS_DEPT_INFO.setData(res.DS_DEPT_INFO.column, res.DS_DEPT_INFO.record);
		$tre_dept.expandAll();
		var v_idx_row = $DS_DEPT_LIST.indexOfRow("DEPT_CD", $DS_DEPT_INFO.getValue("DEPT_CD"));
		Xwing.getTree("tre_dept").setSelection(v_idx_row);
		
		xwing.Dialog.alert("수정되었습니다.");		
	}	
}
