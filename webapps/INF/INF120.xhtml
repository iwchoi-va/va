	var copy = Xwing.getDataset("DS_SYSTEM_COPY");
	var sys_id = copy.getValue(0, "DEVICE_ID");
	
	if(v_flag != "UPDATE" || sys_id == ""){
		alert("삭제할 항목을 선택해야 합니다.");

	}
	
	if(!confirm('선택된 시스템 : ' + sys_id +' 를 삭제 하시겠습니까?')){
		return;
	}
	
	f_delete();

//* 콜백함수
//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
function callback(reqId, res, err, xhr) {
	
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch(reqId) {
	
		case "GET_CODE":
			Xwing.getDataset("DS_SYS001").setData(res.SYS001.column, res.SYS001.record);
			$DS_SYS001.insertRow(0, ["","","전체" ]);
			$cmb_system.setItemindex("0");
			
			Xwing.getDataset("DS_SYS003").setData(res.SYS003.column, res.SYS003.record);
			$DS_SYS003.insertRow(0, ["","","전체" ]);
			//$cmb_location.setItemindex("0");
			
			Xwing.getDataset("DS_SYS005").setData(res.SYS005.column, res.SYS005.record);
			
			//상세폼
			Xwing.getDataset("DS_SYS001_D").setData(res.SYS001.column, res.SYS001.record);
			$DS_SYS001_D.insertRow(0, ["","","선택" ]);
			//$cmb_sysmenu.setItemindex("0");
			
			Xwing.getDataset("DS_SYS003_D").setData(res.SYS003.column, res.SYS003.record);
			$DS_SYS003_D.insertRow(0, ["","","선택" ]);
			//$cmb_loc.setItemindex("0");
			
			//최초도입시기 조회
			f_getFirstDate();
			
			break;
			
			
		case "SYS_SCH":
			Xwing.getDataset("DS_SYSTEM").setData(res.DS_SYSTEM.column, res.DS_SYSTEM.record);
			Xwing.getDataset("DS_SYSTEM_COPY").setColumnInfo(res.DS_SYSTEM.column);
			Xwing.getDatepicker("date_doip").setValue(v_today);
			f_setData();
			break;
			
		case "SYS_INS":
			btn_refresh_click();
			f_search();
			alert("저장이 완료 되었습니다.");
			break;
			
		case "SYS_UPD":
			btn_refresh_click();
			f_search();
			alert("수정이 완료 되었습니다.");
			break;
			
		case "SYS_DEL":
			btn_refresh_click();
			f_search();
			alert("삭제가 완료 되었습니다.");
			break;
			
		case "EXCEL_DOWNLOAD":
			alert("저장이 완료 되었습니다.");
			break;
			
		case "FISRT_DATE":
			$DS_FDAY.setData(res.DS_FDAY.column, res.DS_FDAY.record);
			$date_from.setValue($DS_FDAY.getValue(0,"DOIP_DATE"));
			break;
	}
}
