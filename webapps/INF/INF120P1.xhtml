<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var gv_device_id;
var gv_device_gu;
var gv_mib_id = "";
var gv_mib_flag = "INSERT";
var gv_oid_flag = "INSERT";

function page_load(event) {
	gv_device_id = Xwing.param.p_device_id;
	gv_device_gu = Xwing.param.P_device_gu;
	f_mib_search();
	f_device_search();
}

function f_device_search() {
	param	= {
			_sqlName: "w_mgmt.sys.device_pop.sch"
		};
		
	var opt = { 
		reqId: "DEVICE_SCH",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);
}

function f_mib_search() {
		
	param	= {
			_sqlName: "w_mgmt.sys.schmib.sch",
			device_id: gv_device_id
		};
		
	var opt = { 
		reqId: "MIB_SCH",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);	
}

function callback(reqId, res, err, xhr) {
	
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch(reqId) {
		case "DEVICE_SCH":
			Xwing.getDataset("DS_DEVICE").setData(res.DS_DEVICE.column, res.DS_DEVICE.record);
			Xwing.getEdit("edt_t_sysid").setValue(gv_device_id);
			Xwing.getCombo("cmb_o_sysid").setItemindex("0");
			break;
	
		case "MIB_SCH":
			Xwing.getDataset("DS_MIBLIST").setData(res.DS_MIBLIST.column, res.DS_MIBLIST.record);
			Xwing.getDataset("DS_MIBLIST_COPY").setColumnInfo(res.DS_MIBLIST.column);
			
			if(Xwing.getDataset("DS_MIBLIST").size() == 0){
				Xwing.getButton("btn_copypop").setEnabled(true);
			} else {
				Xwing.getButton("btn_copypop").setEnabled(false);
			}
			Xwing.getGroup("pop_copy").setVisible(false);
			
			btn_mib_refresh_click();
			break;
			
		case "OID_SCH":
			Xwing.getDataset("DS_OIDLIST").setData(res.DS_OIDLIST.column, res.DS_OIDLIST.record);
			Xwing.getDataset("DS_OIDLIST_COPY").setColumnInfo(res.DS_OIDLIST.column);
			break;
			
		case "MIB_INS":
			f_mib_search();
			btn_mib_refresh_click();
			alert("저장이 완료 되었습니다.");
			break;
			
		case "MIB_UPD":
			f_mib_search();
			btn_mib_refresh_click();
			alert("수정이 완료 되었습니다.");
			break;
			
		case "OID_INS":
			f_oid_search();
			btn_oid_refresh_click();
			alert("저장이 완료 되었습니다.");
			break;
			
		case "OID_UPD":
			f_oid_search();
			btn_oid_refresh_click();
			alert("수정이 완료 되었습니다.");
			break;
			
		case "OID_DEL":
			f_oid_search();
			btn_oid_refresh_click();
			alert("삭제가 완료 되었습니다.");
			break;
		
		case "MIB_DEL":
			f_mib_search();
			btn_mib_refresh_click();
			alert("삭제가 완료 되었습니다.");
			break;
		
		case "MIB_COPY":
			f_mib_search();
			btn_mib_refresh_click();
			alert("복사가 완료 되었습니다.");
			break;
	}
}

function grd_mib_click(event) {
	gv_mib_flag = "UPDATE"; // 수정모드로
	
	Xwing.getDataset("DS_MIBLIST_COPY").clearData();
	Xwing.getDataset("DS_MIBLIST_COPY").addRow();
	
	var row  = Xwing.getDataset("DS_MIBLIST").getCursor();
	Xwing.getDataset("DS_MIBLIST_COPY").copyRowFrom(0, "DS_MIBLIST", row);
	
	gv_mib_id = Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "MIB_ID");
	btn_oid_refresh_click();
	f_oid_search();
}

function f_oid_search() {
	param	= {
			_sqlName: "w_mgmt.sys.schoid.sch",
			mib_id: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "MIB_ID")
		};
		
	var opt = { 
		reqId: "OID_SCH",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);	
}


function grd_oid_click(event) {
	gv_oid_flag = "UPDATE"; // 수정모드로
	
	Xwing.getDataset("DS_OIDLIST_COPY").clearData();
	Xwing.getDataset("DS_OIDLIST_COPY").addRow();
	
	var row  = Xwing.getDataset("DS_OIDLIST").getCursor();
	Xwing.getDataset("DS_OIDLIST_COPY").copyRowFrom(0, "DS_OIDLIST", row);
}

function btn_mib_refresh_click(event) {
	gv_mib_flag = "INSERT"; // 수정모드로
	
	Xwing.getDataset("DS_OIDLIST_COPY").clearData();
	Xwing.getDataset("DS_OIDLIST").clearData();
	
	Xwing.getDataset("DS_MIBLIST_COPY").clearData();
	Xwing.getDataset("DS_MIBLIST_COPY").addRow();
	Xwing.getDataset("DS_MIBLIST_COPY").setValue(0, "DEVICE_ID", gv_device_id);
	Xwing.getDataset("DS_MIBLIST_COPY").setValue(0, "OID_TYPE", "M");
	Xwing.getDataset("DS_MIBLIST_COPY").setValue(0, "USE_YN", "Y");
	Xwing.getDataset("DS_MIBLIST_COPY").setValue(0, "DEVICE_GU",  gv_device_gu);
	
	gv_mib_id = "";
}

function btn_mib_save_click(event) {
	if(g_isEmpty(Xwing.getEdit("edt_mib_id").getValue())) {
		alert("MIB_ID를 입력해주세요.");
		return;
	}
	
	if(g_isEmpty(Xwing.getEdit("edt_oid_group").getValue())) {
		alert("OID_GROUP을 입력해주세요.");
		return;
	}
	
	
	if(gv_mib_flag == "INSERT"){
		f_mib_insert();
	} else {
		f_mib_update();
	}
}

function f_mib_insert() {
	param	= {
			_sqlName: "w_mgmt.sys.insertmib.insert",
			DEVICE_GU: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "DEVICE_GU"),
			DEVICE_ID: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "DEVICE_ID"),
			OID_TYPE: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "OID_TYPE"),
			OID_GROUP: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "OID_GROUP"),
			OID_DESC: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "OID_DESC"),
			SCH_INTERVL: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "SCH_INTERVL"),
			SCH_TIME: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "SCH_TIME"),
			USE_YN: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "USE_YN")
		};
		
	var opt = { 
		reqId: "MIB_INS",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);	
}

function f_mib_update() {
	param	= {
			_sqlName: "w_mgmt.sys.updatemib.update",
			MIB_ID: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "MIB_ID"),
			OID_TYPE: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "OID_TYPE"),
			OID_GROUP: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "OID_GROUP"),
			OID_DESC: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "OID_DESC"),
			SCH_INTERVL: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "SCH_INTERVL"),
			SCH_TIME: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "SCH_TIME"),
			USE_YN: Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "USE_YN")
		};
		
	var opt = { 
		reqId: "MIB_UPD",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);	
}

function btn_oid_refresh_click(event) {
	if(g_isEmpty(gv_mib_id)) {
		alert("MIB를 먼저 선택해주세요.");
		return;
	}
	
	gv_oid_flag = "INSERT"; // 수정모드로
		
	Xwing.getDataset("DS_OIDLIST_COPY").clearData();
	Xwing.getDataset("DS_OIDLIST_COPY").addRow();
	Xwing.getDataset("DS_OIDLIST_COPY").setValue(0, "MIB_ID", gv_mib_id);
}

function btn_oid_save_click(event) {
	if(g_isEmpty(Xwing.getEdit("edt_oid_name").getValue())) {
		alert("OID_NAME을 입력해주세요.");
		return;
	}
	
	if(g_isEmpty(Xwing.getEdit("edt_oid").getValue())) {
		alert("OID을 입력해주세요.");
		return;
	}
	
	if(gv_oid_flag == "INSERT") {
		f_oid_insert();
	} else {
		f_oid_update();
	}
}

function f_oid_insert() {
	param	= {
			_sqlName: "w_mgmt.sys.insertoid.insert",
			MIB_ID: Xwing.getDataset("DS_OIDLIST_COPY").getValue(0, "MIB_ID"),
			OID_NAME: Xwing.getDataset("DS_OIDLIST_COPY").getValue(0, "OID_NAME"),

		};
		
	var opt = { 
		reqId: "OID_INS",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);	
}

function f_oid_update() {
	param	= {

			OID_DESC: Xwing.getDataset("DS_OIDLIST_COPY").getValue(0, "OID_DESC")
		};
		
	var opt = { 
		reqId: "OID_UPD",
		url: "service::w_mgmt.sys.schsys.sch.do",

}

function btn_oid_delete_click(event) {
	if(g_isEmpty(Xwing.getDataset("DS_OIDLIST_COPY").getValue(0, "SEQ"))) {

	}
	
	param	= {

function btn_mib_delete_click(event) {
	if(g_isEmpty(Xwing.getDataset("DS_MIBLIST_COPY").getValue(0, "MIB_ID"))) {
		alert("MIB을 선택해주세요");

		};
		
	var opt = { 
		reqId: "MIB_DEL",
		url: "service::w_mgmt.sys.schsys.sch.do",
		param: param
	};
		
	Xwing.request(opt, callback);	
}

function btn_copypop_click(event) {
	if(Xwing.getGroup("pop_copy").getVisible() == false){
		Xwing.getGroup("pop_copy").setVisible(true);
	} else {
		Xwing.getGroup("pop_copy").setVisible(false);
	}

function btn_mib_copy_click(event) {
	param	= {
