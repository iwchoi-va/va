function page_load(event) {

//	_user_id = Xwing.param.user_id;

function f_init(){
	
	//SYS001:사용자등급
	var param = {
			cmd : "getCodes",
			codeType : "SYS001",
			useyn : "Y"
		};
	var opt = {
		reqId : "init",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}

//---callback
function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	
	switch(reqId) {
	
		case "init":
			Xwing.getDataset("DS_SYS001").setData(res.SYS001.column, res.SYS001.record);
			
			//f_getList();
			
			
		break;
		
		case 'getList' :
			Xwing.getDataset("ds_list").setData(res.DS_LIST.column, res.DS_LIST.record);			
			break;
			
		case 'update' :
			alert('저장되었습니다.(초기비밀번호 1111)', '저장');
			
			Xwing.parent.btn_sel_click();
			Xwing.parent.Xwing.getDialog("hrm120m10p").close();			
			break;
			
		case 'check' :
			if(res.DS_CHECK.totalcount > 0) {
				new xwing.Dialog.alert('사번이 이미 존재합니다.', '저장');
				return;
			}
			
			var sql = 'cs.hr.hrm120M010p.insert';
			Regist_UserInfo(sql);
			
			break;
	}

}

function f_component_enable(){
	var a_usergrade = _auth_usergrade.split(",");
	var a_info = _auth_info.split(",");
	
	var v_usergrade = 0;	//자신의 등급이 정해진 권한에 속하면 1, 아니면 0
	var v_info = 0;			//자신의 등급이 정해진 권한에 속하면 1, 아니면 0
	var v_user = 0;		//본인이면 1, 아니면0

	for(var i = 0; i < a_usergrade.length; i++) {
		if(a_usergrade[i] == global("G_USER_GRADE")){
			v_usergrade = 1;
			break;
		}		
	}

	for(var i = 0; i < a_info.length; i++) {
		if(a_info[i] == global("G_USER_GRADE")){
			v_info = 1;
			break;
		}		
	}

	
	if(_user_id == global("G_USER_ID")){
		v_user = 1;
	}
	
	if(v_info == 1 || v_user == 1){
		Xwing.getButton("btn_save").setVisible(true);
		

	}else{
		Xwing.getButton("btn_save").setVisible(false);
	}

	if(v_usergrade == 1){
		Xwing.getCombo("cmb_user_grade").setAttribute("enabled", true);
		$btn_dept.setEnabled(true);
	}else{
		Xwing.getCombo("cmb_user_grade").setAttribute("enabled", false);
		$btn_dept.setEnabled(false);
	}
	
}

function f_getList() {
	var opt = {
			reqId : "getList"
			, url : _url
			, param :{
				_sqlName : "cs.hrm.hrm120m10p.sel"	 
				, user_id : _user_id
			}		
	};

	Xwing.request(opt, callback);
}

/*

	$ds_list.clearData();

	$edt_emp_no.setStyles('');
	$edt_password.setStyles('');
	
	$edt_emp_no.setReadonly(false);

}

	var objs = [$edt_emp_no, $edt_user_name, $edt_dept_fullname, $cmb_user_grade];
	var names = ['사번', '상담사명', '부서', '사용자등급'];
	
	if(!g_checkEmptyObjects(objs, names)) {

	}
	

}

function Regist_UserInfo(sql) {
	
	var param = {
			_sqlName	: sql
			,batchlist	: $ds_list
		};
	
	var opt = {
			reqId : 'update',
			url : _url,
			param : param,
			indicator : null,
			showError : true
		};
	Xwing.request(opt, callback);	
}/*]]>*/</script>
