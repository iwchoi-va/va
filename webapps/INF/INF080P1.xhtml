function page_load(event) {
	XwingObject();
	f_STT_ANL_N_select();
	f_VRS_ANL_N_select();
	//f_V_STT_RSLT_META_select();
}

function f_STT_ANL_N_select() {
	var param	= {		
			_sqlName: "inf.inf080.stt_anl_n.sel"
	};

	var opt 	= {
			reqId: "STT_ANL_N",
			url: v_url,
			param: param,
			indicator : false
	};
	
	Xwing.request(opt, callback);	
}

function f_VRS_ANL_N_select() {
	var param	= {		
			_sqlName: "inf.inf080.vrs_anl_n.sel"
	};

	var opt 	= {
			reqId: "VRS_ANL_N",
			url: v_url,
			param: param,
			indicator : false
	};
	
	Xwing.request(opt, callback);	
}

function f_V_STT_RSLT_META_select() {
	var param	= {		
			_sqlName: "cs.info.info070m.V_STT_RSLT_META.sel.rec"
	};

	var opt 	= {
			reqId: "REC_V_STT_RSLT_META",
			url: "service::sens.cs.inf070.service.sel.do",
			param: param,
			indicator : false
	};
	
	Xwing.request(opt, callback);	
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	
	switch(reqId) {
		case "STT_ANL_N":
			$DS_STT_ANL_N.setData(res.DS_LIST.column, res.DS_LIST.record);
		break;
		case "VRS_ANL_N":
			$DS_VRS_ANL_N.setData(res.DS_LIST.column, res.DS_LIST.record);
		break;
		case "REC_V_STT_RSLT_META":
			$DS_V_STT_RSLT_META.setData(res.DS_V_STT_RSLT_META.column, res.DS_V_STT_RSLT_META.record);
		break;
	}
}



//*********************************************************************************************************
//* EXPR

function expr_reason(cellObj,rowIdx) {
	var opt = {};
	var dsName="";
	dsName = "DS_STT_ANL_N";	
	
	var str = JSON.parse($DS_STT_ANL_N.getValue(rowIdx,"REASON"));
	if(str.detail != undefined){
		var reason = str.detail;
	}else{
		var reason = str.message;
	}
	
	opt = reason;
	return opt;
}
