	if(!chkPwd(Xwing.getEdit("edt_n_pw").getValue())) {

	xwing.Dialog.confirm("저장하시겠습니까?", Xwing.getPage("page").getTitle(), f_savepass);

function chkPwd(str){
	 var pw = str;
	 var num = pw.search(/[0-9]/g);
	 var eng = pw.search(/[a-z]/ig);
	 var spe = pw.search(/[`~!@@#$%^&*|₩₩₩'₩";:₩/?]/gi);

	 if (pw.length < 8) {
		xwing.Dialog.alert("8자리 이상으로 입력해주세요.");
		return false;
	 }

	 if(pw.search(/₩s/) != -1){
		 xwing.Dialog.alert("비밀번호는 공백없이 입력해주세요.");
		 return false;
	 }

	 if(num < 0 || eng < 0 || spe < 0 ){
		 xwing.Dialog.alert("영문, 숫자, 특수문자를 혼합하여 입력해주세요.");
		 return false;
	 }

	 var SamePass_0 = 0; //동일문자 카운트
	 var SamePass_1 = 0; //연속성(+) 카운드
	 var SamePass_2 = 0; //연속성(-) 카운드

	 var chr_pass_0;
	 var chr_pass_1;

	 for(var i=0; i < str.length; i++) {
		 chr_pass_0 = str.charAt(i);
		 chr_pass_1 = str.charAt(i+1);

		// 동일문자 카운트
		if (chr_pass_0 == chr_pass_1) {
			SamePass_0 = SamePass_0 + 1
		} // if

		// 연속성(+) 카운드
		if (chr_pass_0.charCodeAt(0) - chr_pass_1.charCodeAt(0) == 1) {
			SamePass_1 = SamePass_1 + 1
		} // if

		// 연속성(-) 카운드
		if (chr_pass_0.charCodeAt(0) - chr_pass_1.charCodeAt(0) == -1) {
			SamePass_2 = SamePass_2 + 1
		} // if
	} // for

	if (SamePass_0 > 1) {
		xwing.Dialog.alert("동일문자를 3번 이상 사용할 수 없습니다.");
		return false;
	} // if

	if (SamePass_1 > 1 || SamePass_2 > 1) {
		xwing.Dialog.alert("연속된 문자열(123 또는 321, abc, cba 등)을\n 3자 이상 사용 할 수 없습니다.");
		return false;
	} // if

	return true;
}

function f_savepass(e) {
	if(e == false){
		return;
	}

	var opt = {
			reqId : "save"
			, url : "service::cs.hrm.hrm130m010t010p.changepassword.do"
			, param :{
				userid : Xwing.param.user_id
				, c_password : hex_md5(Xwing.getEdit("edt_c_pw").getValue())
				, password : hex_md5(Xwing.getEdit("edt_n_pw").getValue())
				, regid : global("G_USER_ID")
				, change_cd : "C"
				,

			}
	};

	Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {
	if (res.ResultCode != 0){
//		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);

		if(res.ResultCode == "CURPASS_ERROR"){
			changeCount++;
			Xwing.getEdit("edt_c_pw").setValue("");
			Xwing.getEdit("edt_n_pw").setValue("");
			xwing.Dialog.alert(res.ResultMessage);

			return;
		}

		if(changeCount == 3){
			xwing.Dialog.alert("현재 비밀번호 입력 3회 오류입니다.\n 다시 시도해 주십시오.");
			return;
		}

		xwing.Dialog.alert(res.ResultMessage);

		return;
	}

	switch(reqId) {

		case "save":
			xwing.Dialog.alert( '처리되었습니다.','', alertCallback);

		break;

	}
}

function alertCallback(){
	try{
		Xwing.parent.Xwing.parent.Xwing.getDialog("hrm130m").close();
		Xwing.parent.Xwing.getDialog("changePw").close();
	}catch(e) {
		Xwing.parent.Xwing.getDialog("changePw").close();
	}
}
