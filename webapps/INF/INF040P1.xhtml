function callback(reqId, res, err, xhr) {
	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
//	case "f_codebook_sel" : 
//		
//		$DS_ISTP.setData(res.COM003.column, res.COM003.record);
//		$DS_PRODUCT.setData(res.COM004.column, res.COM004.record);
//		break;
		case "getProduct" : 
		
		$DS_PRODUCT.setData(res.DS_PRODUCT.column, res.DS_PRODUCT.record);
		$DS_ISTP.setData(res.DS_ISTP.column, res.DS_ISTP.record);
		break;
		case "getExcelFile" : 
			$grd_authMenu_0.setBinddataset('');
			$DS_UPLOAD.clearData();
			
			$DS_UPLOAD.setData(res.DS_UPLOAD.column, res.DS_UPLOAD.record);
			$DS_UPLOAD.removeRow(0); //엑셀 헤더삭제
			$edit_rowcnt_s.setValue($DS_UPLOAD.size());
				if($DS_UPLOAD.size()>30){
					for(var idx=0 ; idx<30 ; idx++){
						$DS_UPLOAD_TMP.addRow();
						$DS_UPLOAD_TMP.copyRowFrom(idx, "DS_UPLOAD", idx);
						$DS_UPLOAD_TMP.setValue("REG_ID",global("G_USER_ID"));
					}
				}else{
					for(var idx=0 ; idx<$DS_UPLOAD.size() ; idx++){
						$DS_UPLOAD_TMP.addRow();
						$DS_UPLOAD_TMP.copyRowFrom(idx, "DS_UPLOAD", idx);
						$DS_UPLOAD_TMP.setValue("REG_ID",global("G_USER_ID"));
					}
				}
					
				$grd_authMenu_0.setBinddataset('DS_UPLOAD_TMP');
				if(validateCheck($DS_UPLOAD)==0){
					$btn_fileUpload.setVisible(true);
				}else{
					$btn_fileUpload.setVisibvle(false);
				};
			
			break;
		case "dataSave" : 
			alert('저장되었습니다.');

			parent.Xwing.getDialog("script_upload").close();
			parent.grd_codetype_click();
			break;
	
	}	
}

function validateCheck(dataset){
	var CheckValue=0;
	for(var idx=0;idx<$DS_UPLOAD.size() ; idx++){
		if(fidnRow($DS_PRODUCT,dataset.getValue(idx,"A").trim()) == false ){
			alert("상품 테이블에 존재하지 않는 상품코드가 있습니다. ("+(idx+1)+"번째 데이터) 상품명이 들어가지 않습니다.");
		}
		if(fidnRow($DS_ISTP,dataset.getValue(idx,"B").trim()) == false ){
			alert("등록되지 않은 보험종목 코드입니다. "+(idx+1)+"번째 데이터를 확인하세요.");
			CheckValue=1;
			return CheckValue;
		}
	
	}
	
	return CheckValue;
}

function fidnRow(arrayList, obj) {
    for(var i=0; i<arrayList.size(); i++) {    	
    	if (arrayList.getValue(i,"CODEID") == obj){ 
        	return true;
        }
    }
    return false;
}

//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
 function btn_fileUpload_sch_click(event) {
	 $DS_UPLOAD_TMP.clearData();
		
	var MAX_SIZE 		= 1024 * 1024 * 100;

	if($DS_FILE.size() == 0) {
		
		xwing.Dialog.alert("업로드할 파일을 선택해 주세요."); return;
	}
	
	if(!/.xls$/.test($DS_FILE.getValue("FILE_NAME")) && !/.xlsx$/.test($DS_FILE.getValue("FILE_NAME")) && !/.csv$/.test($DS_FILE.getValue("FILE_NAME"))) { 
		
		xwing.Dialog.alert("업로드할 파일의 확장자는 xls,xlsx,csv만 가능합니다."); return;
	}
	
	if(parseInt($DS_FILE.getValue("FILE_SIZE")) > MAX_SIZE) {
		
		xwing.Dialog.alert("업로드할 파일의 용량이 "+ MAX_SIZE/1024/1024 +"Mb 를 초과하였습니다."); return;
	}
	
	var param = {
			
			LIST: "01"
	};
	$file_upload_icon.send(param, file_callback);	
}

//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
//*	파일업로드 콜백함수.
//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
function file_callback(response) {
	//파일 CALLBACK함수는 일반 CALLBACK함수와 구조가 다름.
	var res = eval("("+response+")"); // String 으로 받은 데이터를 JSON으로 파싱.
	
	if (res.Error != '0') {
		
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return; 
	}
	
	// 업로드한 파일경로를 데이터셋에 담음.
	$DS_SCRIPT_LIST.setValue("FILE_PATH", res.FilePath);
	$DS_SCRIPT_LIST.setValue("SCRIPT_FILE", $DS_FILE.getValue("FILE"));
	
	var fileGubun = "";
	if(/.xlsx$/.test($DS_FILE.getValue("FILE_NAME"))){
		fileGubun = "xlsx";	
		
	}else if(/.xls$/.test($DS_FILE.getValue("FILE_NAME"))){
		fileGubun = "xls";	
		
	}else if(/.csv$/.test($DS_FILE.getValue("FILE_NAME"))) { 		
		fileGubun = "csv";	
	}

	var opt = {

			reqId: "getExcelFile",
			url: "service::list.excelUtil.do",
			param: {
				cmd:"getExcelFile",
				filePath: $DS_SCRIPT_LIST.getValue(5),
				FILE_NAME : $DS_FILE.getValue("FILE_NAME"),
				fileGubun : fileGubun,
				useyn: "Y"
			},
			indicator: null,
			showError: true
	};

	Xwing.request(opt, callback);	
}
function filedataSave(){
	xwing.Dialog.confirm("저장하시겠습니까?", $page.getTitle(), function(e){
		if(e){
			var param	= {			
					_sqlName: "wfm.info.info040.product.mapping.ins",
					batchlist:$DS_UPLOAD_TMP
				};	
				var opt 	= {
					reqId: "dataSave",
					url: v_url,
					param: param
				};
				
				Xwing.request(opt, callback);
			}
		});
}
