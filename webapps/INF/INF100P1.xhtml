 //엑셀다운권한정의

// 녹취록 조회
function getSTT()
{
	$pnl_stt.setUrl("./INF100P2.html");
	
	//녹취록 원문조회
	var sqlName = "inf.inf100p1.getSttContent.sel";
	
	
	var opt = {
			reqId: 'getSTT',
			url: "service::msens.xcron.hansol.sttEncryptWebaction.do",
			param:{ 
				_sqlName : sqlName
				,UCID : ucid 
				,type : "M"
		          },
			indicator: null,
			showError: true
		};
	Xwing.request(opt, callback);
}

//STT문장 조회
function callbackgetSTT() {
	var content = "";
	if(ucid != ""){
		content = $ds_stt.getValue(0, "CONTENT");
		//rx|tx 구분 안되있는 경우
		content = content.replace(/[0-9]/g,'');
		content = content.replace(/TX\|/gi,"<br>");
		content = content.replace(/RX\|/gi,"<br>");
	}else{
	
	}
	
	var docInit = content;
	var iframe = document.getElementById("if::pnl_stt");
	var fDoc = null;

	if(iframe) {
		var frm = iframe.contentWindow || iframe.contentDocument;
		frm.f_setContent_box(docInit);
	}
}

// 트랜잭션 콜백
function callback(reqId, res, err, xhr){
	//* Response 시 에러 발생한 경우
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId)
	{
		case "getSTT" :
			$ds_stt.setData(res.DS_RES.column, res.DS_RES.record);

			setTimeout("callbackgetSTT()", 500);
		break;
		default :
	}
}


function btn_excel_click(event) {
	location.href = "../jsp/sttExport.jsp?ucid="+ucid;
}/*]]>*/</script>
