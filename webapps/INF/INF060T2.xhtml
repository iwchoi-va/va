<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/function page_load(event) {
	XwingObject();
	f_selCodeBook();
}

function f_selCodeBook() {
	var param = {
		cmd : "getCodes",
		codeType : "SYS070",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_selCodeBook",
		url : "service::cs.com.codeutil.do",
		param : param,
		indicator : false
	};
	Xwing.request(opt, callback);
}

function cmb_server_ip_change(event) {
	Xwing.getDataset("DS_SERVER_IP").setCursor(parseInt(Xwing.getCombo("cmb_server_ip").getItemindex()));
}

function btn_sel_click(event) {
	if(g_isEmpty(Xwing.getEdit("edt_server_ip").getValue())) {
		xwing.Dialog.alert("XCron 서버 정보에서 서버IP를 선택하십시오.");
		return false;
	}

	var param = {
			cmd	: "getschedule"
			,SERVER_IP	: Xwing.getEdit("edt_server_ip").getValue()
			,SERVER_PORT	: Xwing.getEdit("edt_port").getValue()
			,SERVER_TIMEOUT	: Xwing.getEdit("edt_timeout").getValue()
		};
		
		var opt = {
			reqId		: "f_selSchedule"
			,url		: "service::cs.xcron.control.exe.do"
			,param		: param
			,indicator	: null
			,showError	: true
		};
		
		Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	
	switch(reqId) {
	
	case "f_selCodeBook":

		Xwing.getDataset("DS_SERVER_IP").setData(res.SYS070.column, res.SYS070.record);
		Xwing.getCombo("cmb_server_ip").setItemindex("0");
		
		break;
		
	case "f_selSchedule":
		Xwing.getDataset("DS_SCHEDULE").clear();
		Xwing.getDataset("DS_SCHEDULE").setData(res.XCRON_RESULT.column, res.XCRON_RESULT.record);
		Xwing.getDataset("DS_SCHEDULE").sort("ID", false);
		
		break;
		
	}
}
/*]]>*/</script>
<xwing:data>

		<xwing:dataset-column id="ID"></xwing:dataset-column>
		<xwing:dataset-column id="PARAMETERS"></xwing:dataset-column>
		<xwing:dataset-column id="DAYSOFMONTH"></xwing:dataset-column>
		<xwing:dataset-column id="HOURS"></xwing:dataset-column>
		<xwing:dataset-column id="MINUTES"></xwing:dataset-column>
		<xwing:dataset-column id="SECONDS"></xwing:dataset-column>
		<xwing:dataset-column id="CLASS"></xwing:dataset-column>
		<xwing:dataset-column id="METHOD"></xwing:dataset-column>
		<xwing:dataset-column id="DESCRIPTION"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="DS_SERVER_IP">

		<xwing:dataset-column id="ETC1"></xwing:dataset-column>
		<xwing:dataset-column id="ETC2"></xwing:dataset-column>
		<xwing:dataset-column id="ETC3"></xwing:dataset-column>
		<xwing:dataset-row>
			<xwing:dataset-cell>01</xwing:dataset-cell>
			<xwing:dataset-cell>테스트(Localhost)</xwing:dataset-cell>
			<xwing:dataset-cell>127.0.0.1</xwing:dataset-cell>
			<xwing:dataset-cell>2005</xwing:dataset-cell>
			<xwing:dataset-cell>300000</xwing:dataset-cell>
		</xwing:dataset-row>
	</xwing:dataset>
</xwing:data>
