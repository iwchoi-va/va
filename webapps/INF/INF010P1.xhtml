function f_init(){
	
	//SYS001:사용자등급, SYS001:근무상태, HRM100:파견사, SYS003:성별, SYS004:사용자등굽(WFM)
	//SYS011:업무그룹, HRM130:직급, HRM140:직책
	var param = {
			cmd : "getCodes",
			codeType : "SYS001",
			useyn : "Y"
		};
	var opt = {
		reqId : "init",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}

//---개인정보가져오기.

				, user_id : _user_id
			}		
	};

	Xwing.request(opt, callback);
	
}

function f_getAgentId() {
	var param = '';
	
	param = 'NUM=ALL';
	
    var opt = {
			reqId: 'getHostAgentInfo',
			url: 'service::admin.xwing.host.do',
			param:{
					_serviceName:'SHOW-AGENT',
					COMMAND:'SHOW-AGENT',
					PARAMETER:param
				  },
			indicator: null,
			showError: true
		};
	
   Xwing.request(opt, callback);	
}

function f_getUserInfo() {
	var param = {
			_sqlName	: "cs.hr.hrm110m20t.getAgentInfo"
		};	

	var opt = {
			reqId : 'getAgentInfo',
			url : 'service::cs.hr.hrm110m20t.getAgentInfo.do',
			param : param,
			indicator : null,
			showError : true
		};
	Xwing.request(opt, callback);	
}

function checkAgentId() {
	var agentId = $edt_agent_id.getValue();
	var HostAgent = $ds_agent.indexOfRow('AGT_IDX', agentId);
	var userAgent = $ds_user_agent.indexOfRow('AGENT_ID', agentId);
	
	if(agentId != '') {
		if(HostAgent == -1) {
			new xwing.Dialog.alert('사용불가능한 CTI ID입니다.', '적용');
			return;
		}
		
		if(userAgent != -1 && old_agentId != agentId) {
			new xwing.Dialog.alert('이미 사용중인 CTI ID입니다.', '적용');
			return;
		}
		
		
	}
	
	update_user();
}


function update_user(){
	var opt = {
	reqId : "update"
	, url : _url
	, param :{
		_sqlName : "cs.hrm.hrm130m.upd"	 
		,ds_list : Xwing.getDataset("ds_list")
		,CHG_ID : global("G_USER_ID")
		
		}		
	};

	Xwing.request(opt, callback);
}

//---callback
function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	switch(reqId) {
	
		case "init":
		
			Xwing.getDataset("DS_SYS001").setData(res.SYS001.column, res.SYS001.record);
		//	$ds_grade_wfm.setData(res.SYS004.column, res.SYS004.record);
		//	$ds_sex.setData(res.SYS003.column, res.SYS003.record);
		//	$ds_smoke.setData(res.SYS004.column, res.SYS004.record);
		//	$ds_gpa.setData(res.HRM100.column, res.HRM100.record);
			
		//	$ds_level.setData(res.HRM130.column, res.HRM130.record);
		//	$ds_work_group.setData(res.SYS011.column, res.SYS011.record);
		//	$ds_function.setData(res.HRM140.column, res.HRM140.record);
		//	$ds_level.insertRow(0, ["","","선택" ]);
		//	$ds_work_group.insertRow(0, ["","","선택" ]);
		//	$ds_function.insertRow(0, ["","","선택" ]);
		//	$ds_gpa.insertRow(0, ["","","선택" ]);
			

			f_getList();
		break;
		
		case "getList":
			
			Xwing.getDataset("ds_list").setData(res.DS_LIST.column, res.DS_LIST.record);
			if($ds_list.getValue('USE_YN') == 'N') {
				$cal_retire.setStyles('');
				$cal_retire.setEnabled(true);
			} else {
				$cal_retire.setStyles('cal_readonly');
				$cal_retire.setEnabled(false);
			}
		
			g_setOrg($ds_list.getValue(0,"ORG1_CD"),$ds_list.getValue(0,"ORG2_CD"),$ds_list.getValue(0,"ORG3_CD"),$ds_list.getValue(0,"USER_ID"));

			if($ds_list.getValue(0, "BATCH_UPDATE_FLAG") == "N") {
			//	$btn_dept.setEnabled("true");
			//	$cmb_function.setEnabled("true");
			//	$cmb_grade_wfm.setEnabled("true");
			//	$cmb_work_group.setEnabled("true");
				$rdo_iswork.setEnabled("true");
			} else {
			//	$btn_dept.setEnabled("false");
			//	$cmb_function.setEnabled("false");
			//	$cmb_grade_wfm.setEnabled("false");
			//	$cmb_work_group.setEnabled("false");
				$rdo_iswork.setEnabled("false");
			}
			
			break;
		
		case "update":
			xwing.Dialog.alert('처리되었습니다.');
			Xwing.parent.btn_sel_click();
			Xwing.parent.Xwing.getDialog("hrm130m").close();
		break;
		
		case 'getHostAgentInfo' :
			Xwing.getDataset('ds_agent').setData(res.SHOW_AGENT_LIST.column,res.SHOW_AGENT_LIST.record );
			f_getUserInfo();
			break;
			
		case 'getAgentInfo' :
			Xwing.getDataset('ds_user_agent').setData(res.AGENT_LIST.column, res.AGENT_LIST.record);
			
			checkAgentId();
			break;
			
		case "getUserDelete":
			xwing.Dialog.alert('처리되었습니다.');
			Xwing.parent.btn_sel_click();
			setTimeout("f_popupclose()", 2000);
		break;
		
		case "changePw":
			xwing.Dialog.alert( '비밀번호가 [1111]로 초기화되었습니다.');
		break;
		
		case "init_pwd_err" : 
			xwing.Dialog.alert( '초기화되었습니다.');
			f_getList();
		break;
	}

}

	Xwing.parent.Xwing.getDialog("hrm130m").close();

function f_userdelete(e) {
	if(e == false){
		return;
	}
	
	var opt = {
			reqId : "getUserDelete"
			, url : _url
			, param :{
				_sqlName : "cs.hrm.HRM130M.user.delete"	 
				, user_id : _user_id
			}		
	};

	Xwing.request(opt, callback);
}

function btn_pass_click(event) {
	var username = $edt_user_name.getValue();
	if(confirm(username+"님의 비밀번호를 초기화하시겠습니까?")) {
		changePassword();
	}
}

function changePassword() {
	var opt = {
			reqId:"changePw"
			, url:"service::cs.hrm.hrm120m.changepassword.do"
			, param : {
				userid : _user_id
				, password : hex_md5("1111")
				, regid : global("G_USER_ID")
				, change_cd : "I"
			}
	};
	
	Xwing.request(opt, callback);
}

function btn_init_err_count_click(event) {
	var name = $edt_user_name.getValue();
	
	if(confirm(name+"님의 비밀번호 오류횟수를 초기화 하시겠습니까?")){
		var opt = {
				reqId:"init_pwd_err",
				url:_url,
				param:{
					_sqlName:"cs.hrm.hrm120m.err_count_init.upd",
					user_id:_user_id
				},
				indicator:null,
				showError:true
		};
		Xwing.request(opt, callback);
	}
