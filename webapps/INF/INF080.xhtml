<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var v_url = "service::inf.inf080.systeminfosearch.do";
var g_system_time = new Timer;
var timeInterval = 180000; //기본 3분

function page_load(event) {
	XwingObject();
	
	timeGo();
	clearInterval(g_system_time);
	f_codebook_sel();
	
	
}

function reciever(){
	getSystem();
}


function f_codebook_sel() {

	var param = {
		cmd : "getCodes",
		codeType : "COM001",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}
function timeGo() {
    setInterval("nowDate()", 1000);
}

function nowDate() {
    var now = new Date();
    var nowTime = now.getFullYear() + "년 " + LPAD((now.getMonth()+1), "0", 2) + "월 " + LPAD(now.getDate(), "0", 2) + "일 " 
    			+ LPAD(now.getHours(), "0", 2) + ":" + LPAD(now.getMinutes(), "0", 2) + ":" + LPAD(now.getSeconds(), "0", 2);
    $lbl_time.setValue(nowTime);
}


function getSystem() {
	var opt = {
			reqId : "System_Search"
			, url : v_url
			, result_name1 : "DS_DATALIST"
			, indicator : null
			, showError : true
		};
	Xwing.request(opt, callback);
}

function f_getAlarm_search() {
	var opt = {
			reqId: "AlarmSel",
			url: "service::sens.common.alarmmonitoringwebaction.sel.do",
			param: {
				reseult_name: "DS_ALARMLIST"
			},
			indicator: null,
			showError: true
	};

	Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	
	switch(reqId) {
		case "f_codebook_sel" :
			$DS_COM001.setData(res.COM001.column, res.COM001.record);
			timeInterval = $DS_COM001.getValue(0,"CODEID")*1000; //second*ms
			
			g_system_time = setInterval("getSystem()", timeInterval);
			
			getSystem();
		break;
		
		case "System_Search":
			$DS_DATALIST.setData(res.DS_DATALIST.column, res.DS_DATALIST.record);
			$DS_TEMP.setData(res.DS_TIMELIST.column, res.DS_TIMELIST.record);
			$DS_TEMP.sort("DATETIME", false);
			$DS_TIMELIST.copyFrom($DS_TEMP);
			
		//	f_getAlarm_search();
		break;
		case "AlarmSel":
			$DS_ALARMLIST.setData(res.DS_ALARMLIST.column, res.DS_ALARMLIST.record);
			
		break;
		case "REC_BATCHTIME":
			$DS_BATCHTIME.setData(res.DS_BATCHTIME.column, res.DS_BATCHTIME.record);
		break;
	}
}


/************************************************************************************
*UTIL
************************************************************************************/

function LPAD(s, c, n) {
	s = s + "";
    if (! s || ! c || s.length >= n) {
        return s;
    }
 
    var max = (n - s.length)/c.length;
    for (var i = 0; i < max; i++) {
        s = c + s;
    }
 
    return s;
}

function btn_showErr_click(event) {
	var opt = {
			modal: false,
			resizable: false,
			id : 'INF080P1',
			url : './INF080P1.xhtml',		
			width : 676,
			height : 650,
			title : "미분석 데이터 확인",
			draggable:true
		};
	
	var dialog = new xwing.Dialog(opt);
	dialog.open();
}
