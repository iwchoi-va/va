function f_codebook_sel() {

	var param = {
		cmd : "getCodes",
		codeType : "COM001",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);

function getSystem() {
	var opt = {
			reqId : "System_Search"
			, url : v_url
			, result_name1 : "DS_DATALIST"
			, indicator : null
			, showError : true
		};
	Xwing.request(opt, callback);
}

function getSystemMonitoring() {
	var opt = {
			reqId: "getSystemMonitoring",
			url: "service::inf.inf070.service.sel.do",
			param: {
				_sqlName  : 'inf.inf070.getUsedCPU.sel,inf.inf070.getUsedMemory.sel,inf.inf070.getUsedDisk.sel',

			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}



function f_setting(ds) {
	var v_cpu ="", v_mem="", v_disk="";
	var lbl_name = ds.id.split('_');
	lbl_name= lbl_name[1].toLowerCase();
	for(var i = 0, len = ds.size(); i<len; i++){
		eval('$lab_'+lbl_name+'_'+(i+1)+'.setValue(ds.getValue('+i+', "DESC"));');
		v_cpu = ds.getValue(i, "CPU") + "%";
		v_mem = ds.getValue(i, "MEMORY") + "%";
		v_disk = ds.getValue(i, "DISK") + "%";
		eval('$lbl_'+lbl_name+'_cpu_'+(i+1)+'.setValue("'+v_cpu+'");');
		eval('$lbl_'+lbl_name+'_mem_'+(i+1)+'.setValue("'+v_mem+'");');
		eval('$lbl_'+lbl_name+'_disk_'+(i+1)+'.setValue("'+v_disk+'");');
		if(v_cpu == "100%" || v_mem == "100%" || v_disk == "100%"){
			eval('$lab_'+lbl_name+'_'+(i+1)+'.setBgimage("../images/ico_server_red.gif")');
			if(lbl_name == "smc" || lbl_name == "rec"){
				$lbl_area_vr.setBgimage("../images/red_light.png");
			}else{
				$lbl_area_va.setBgimage("../images/red_light.png");
			}
		}
	}
}

function f_settingSttqueue() {
	var v_stt_alarmgrade = 0;

	for(var i=0; i<$DS_STT.size(); i++) {
		var v_queue = $DS_STT.getValue(i, "ETC1");
		var v_cpu = $DS_STT.getValue(i, "CPU") + "%";
		var v_mem = $DS_STT.getValue(i, "MEMORY") + "%";
		var v_disk = $DS_STT.getValue(i, "DISK") + "%";
		var v_alarmgrade = $DS_STT.getValue(i, "ALARMGRADE");

		eval("$lab_proce_" + (i + 1)).setValue(v_queue);
		eval("$lbl_rate_cpu_" + (i + 1)).setValue(v_cpu);
		eval("$lbl_rate_mem_" + (i + 1)).setValue(v_mem);
		eval("$lbl_rate_disk_" + (i + 1)).setValue(v_disk);

		if(v_alarmgrade == "MAJ") {

function nowDate() {
    var now = new Date();
    var nowTime = now.getFullYear() + "년 " + LPAD((now.getMonth()+1), "0", 2) + "월 " + LPAD(now.getDate(), "0", 2) + "일 "
    			+ LPAD(now.getHours(), "0", 2) + ":" + LPAD(now.getMinutes(), "0", 2) + ":" + LPAD(now.getSeconds(), "0", 2);
    $lbl_time.setValue(nowTime);
}

function LPAD(s, c, n) {
	s = s + "";
    if (! s || ! c || s.length >= n) {
        return s;
    }

    var max = (n - s.length)/c.length;
    for (var i = 0; i < max; i++) {
        s = c + s;
    }

    return s;
}/*]]>*/</script>
