//*	콜백함수.
//*〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '<br/>' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "GETCODES" :
			$DS_SYS001.setData(res.SYS001.column, res.SYS001.record);
			//$DS_COM036.setData(res.COM036.column, res.COM036.record);
			$DS_AUTHORITY.clear();
			for(var i = 0, j = 1 ; i < $DS_SYS001.size() ; i ++ ){
				j = (i % 1);
				var codeId = $DS_SYS001.getValue(i, "CODEID");
				var codeName = $DS_SYS001.getValue(i, "CODENAME");
				var bindcol = "CHK_"+codeId;
				$DS_AUTHORITY.addColumn(bindcol);
				var chk = Xwing.createCheckbox({
					id   : "chk_" + codeId,
					left : (110 * j) + 12,
					width: 150,
					top  : Math.floor(i / 1) * 20 +7 ,
					label : codeName,
					truevalue : "Y",
					falsevalue : "N",
					value : "N",
					binddataset: "DS_AUTHORITY",
					bindcolumn : bindcol,
					fontcolor : "#084B8A",
					fontsize : 12,
					click : "common_auth_click"
				});
				$pnl_auth.appendChild(chk);
			}
			$DS_AUTHORITY.addRow();
			break;
		case "MENU_SCH" :

			var sel_menu = Xwing.getTree('tre_menu').getSelection();

			$DS_MENU.setData(res.DS_MENU.column, res.DS_MENU.record);
			$DS_MENU_COPY.setColumnInfo(res.DS_MENU.column);

			Xwing.getTree('tre_menu').setSelection(sel_menu, true);
			tre_menu_select();
			//setTree();
			//f_addContext(); //이거 왜 하는거임??

			break;
		case "MENU_ISR" :
			xwing.Dialog.alert("저장되었습니다.");
			f_getMenu();
			setTree();
			parent.f_menu_sel();
			break;

		case "MENU_UPD" :
			xwing.Dialog.alert("저장되었습니다.");
			f_getMenu();
			setTree();
			parent.f_menu_sel();
			break;

		case "MENU_DEL" :
			xwing.Dialog.alert("삭제되었습니다.");
			f_getMenu();
			setTree();
			parent.f_menu_sel();
			break;
	}
}

function setTree(){
	//이전 설정 상태로 보여주기

	}
}

function f_create_auth_chk(strAuthCd){
	var v_auth = strAuthCd.split(",");
	var v_col_info = $DS_AUTHORITY.getColumnInfo();
	for(var i = 0 ; i < v_col_info.length ; i++ ){
		$DS_AUTHORITY.setValue(0, v_col_info[i], "N");
	}
	for(var i = 0 ; i < v_auth.length ; i++){
		$DS_AUTHORITY.setValue(0, "CHK_"+v_auth[i], "Y");
	}
}

function f_addContext(parentId) {
	parentId = g_nvl(parentId, "0");
	var v_id = 0;
	var v_menu_seq = 0;
	var v_authority_cd = g_nvl($DS_MENU.lookUp("MENU_ID", parentId, "AUTHORITY_CD"), "");

	if (parentId == "0") {
		v_id = parseInt($DS_MENU.max("MENU_ID", "[PARENT_ID =='" + parentId + "']"),10) + 10000;
		v_menu_seq = parseInt($DS_MENU.max("MENU_SEQNO", "[PARENT_ID=='" + parentId + "']"),10) + 1;
	} else {
		var v_max_menu_id = $DS_MENU.max("MENU_ID", "[PARENT_ID^='" + g_substr(parentId, 0, 3) + "']");
		if(g_isNull(v_max_menu_id) || g_isEmpty(v_max_menu_id)){
			v_max_menu_id = parentId;
		}
		v_id = parseInt(v_max_menu_id) + 1;
		var v_max_menu_seq = $DS_MENU.max("MENU_SEQNO", "[PARENT_ID=='" + parentId + "']");
		if (g_isNull(v_max_menu_seq) || g_isEmpty(v_max_menu_seq)){
			v_max_menu_seq = 0;
		}
		v_menu_seq = parseInt(v_max_menu_seq) + 1;
	}
	v_flag 	= "INSERT";
	$DS_MENU_COPY.clearData();
	$DS_MENU_COPY.addRow();
	$DS_MENU_COPY.setValue("MENU_ID"   , v_id       );
	$DS_MENU_COPY.setValue("PARENT_ID" , parentId   );
	$DS_MENU_COPY.setValue("MENU_SEQNO", v_menu_seq );
	$DS_MENU_COPY.setValue("WINTYPE"   , "main"     );
	$DS_MENU_COPY.setValue("LEAF_YN"   , "Y"        );
	$DS_MENU_COPY.setValue("WIDTH"     , "0"        );
	$DS_MENU_COPY.setValue("HEIGHT"    , "0"        );
	$DS_MENU_COPY.setValue("USE_YN"    , "Y"        );
	$DS_MENU_COPY.setValue("AUTHORITY_CD", v_authority_cd);
	f_create_auth_chk(v_authority_cd);
	//$edt_caption.focus();
}

function btn_save_click(event) {

	if($DS_MENU_COPY.getValue("LEAF_YN") == "N") {

		$DS_MENU_COPY.setValue("WINTYPE", "main");
	}

	var v_authority = "";
	var v_col_info = $DS_AUTHORITY.getColumnInfo();
	for(var i = 0 ; i < v_col_info.length ; i++ ){
		var v_chk_val = $DS_AUTHORITY.getValue(0, v_col_info[i]);
		if(v_chk_val == "Y"){
			v_authority += ","+ g_substr(v_col_info[i], 4);
		}
	}
	$DS_MENU_COPY.setValue("AUTHORITY_CD", g_substr(v_authority, 1));

	if(v_flag == "INSERT") {
		f_addMenu();
	}

	if(v_flag == "UPDATE") {
		f_updMenu();
	}

	//$edt_caption.focus();
	v_flag = "UPDATE";
}

function f_getMenu() {

	var useyn="Y";
	if($chk_useyn.isChecked() == true) useyn="";

	var param	= {
			useyn : useyn,
			_sqlName: "cs.info.info100m.menu.sel"
	};

	var opt 	= {
			reqId: "MENU_SCH",
			url: v_url,
			param: param,
			indicator : false
	};

	Xwing.request(opt, callback);
}

function btn_expand_click(event) {
	var value = $btn_expand.getValue();
	if(value == "펼쳐보기"){
		$tre_menu.expandAll();
		$btn_expand.setValue("접어보기");
