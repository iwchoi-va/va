//*********************************************************************************************************
//Call Back Action

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return false;
	}
	
	switch (reqId) {
		case "f_codebook_sel" :
			
			$DS_SYS150.setData(res.SYS150.column, res.SYS150.record);
			for(var i = 0; i< $DS_SYS150.size(); i++){
				_auth_User.push($DS_SYS150.getValue(i,"CODENAME"));
			}
			
			var bool = false;
			var bool1 = false;
			if(_auth_User.indexOf(global("G_USER_ID")) != -1 && global("G_USER_GRADE") == "24") bool = true;
			
			$btn_upload_0.setVisible(bool);
			$btn_upload.setVisible(bool);
			
			
			if(_auth_User.indexOf(global("G_USER_ID")) != -1) bool1 = true; 
			$btn_fileUpload_sch.setVisible(bool1);
			
		break;
		case "insertFile":
			alert("저장되었습니다");
			$DS_FILE.clearData();
			$file_upload_icon.removeFile();
			$recStartTime.setValue(g_toDate());
		break;
		case "getUploadLimit":
			$DS_LIMIT.setData(res.DS_LIMIT.column, res.DS_LIMIT.record);
		break;
		default: break;	
	} 
}

function btn_fileUpload_sch_click(event) {
	
	if($DS_LIMIT.getValue(0,"CNT") > 100){
		xwing.Dialog.alert("당일 수동 업로드 건수는 100건입니다."); 
		$DS_FILE.clearData();
		$file_upload_icon.removeFile();
		return;
	}
	
	var MAX_SIZE 		= 1024 * 1024 * 100;

	if($DS_FILE.size() == 0) {
		
		xwing.Dialog.alert("업로드할 파일을 선택해 주세요."); return;
	}
	
	if(!/.wav$/.test($DS_FILE.getValue("FILE_NAME")) ) { 
		
		xwing.Dialog.alert("업로드할 파일의 확장자는 *.wav만 가능합니다."); 
		$DS_FILE.clearData();
		$file_upload_icon.removeFile();
		return;
	}
	
	if(parseInt($DS_FILE.getValue("FILE_SIZE")) > MAX_SIZE) {
		
		xwing.Dialog.alert("업로드할 파일의 용량이 "+ MAX_SIZE/1024/1024 +"Mb 를 초과하였습니다."); 
		$DS_FILE.clearData();
		$file_upload_icon.removeFile();
		return;
	}
	
	var param = {
			
			LIST: "01"
	};
	$file_upload_icon.send(param, file_callback);	
}


function file_callback(response) {
	
	var res = eval("("+response+")"); // String 으로 받은 데이터를 JSON으로 파싱.
	
	if (res.Error != '0') {
		
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return; 
	}

	// 업로드한 파일경로를 데이터셋에 담음.
	//$DS_SCRIPT_LIST.setValue("FILE_PATH", res.FilePath);
	//$DS_SCRIPT_LIST.setValue("SCRIPT_FILE", $DS_FILE.getValue("FILE_NAME"));
	/*
	var fileGubun = "";
	if(/.xlsx$/.test($DS_FILE.getValue("FILE_NAME"))){
		fileGubun = "xlsx";	
		
	}else if(/.xls$/.test($DS_FILE.getValue("FILE_NAME"))){
		fileGubun = "xls";	
		
	}else if(/.csv$/.test($DS_FILE.getValue("FILE_NAME"))) { 		
		fileGubun = "csv";	
	}
*/
	var drive = getDriveTxt();
	var param = {
			_sqlName : 'inf.inf100.insertFile.ins',
			REC_START_TIME : $recStartTime.getValue(),
			ORGFILEFULLPATH: drive+res.FilePath+$DS_FILE.getValue("FILE_NAME"),
			ORGFILENAME : $DS_FILE.getValue("FILE_NAME"),
			REQ_ID : $reqId.getValue(),
			BATCH_YN : "N",
			REG_ID : global("G_USER_ID")
		};

		var opt = {
			reqId : "insertFile",
			url : v_url,
			param : param,
			indicator : null,
			showError : true
		};
	
	Xwing.request(opt, callback);	
}


function getDriveTxt(){
	
	var hostname = window.location.hostname.split(".");
	
	var url ="";
	if(hostname[0] == "vadev"){
		url = "E:/";
	}else if(hostname[0] == "vauat"){
		url = "E:/";
	}else if(hostname[0] == "va"){
		url = "H:/";
	}else{
		url = "E:/";
	}
	
	return url;
}
