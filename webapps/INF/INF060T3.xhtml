<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/function page_load(event) {
	XwingObject();
	
	for( var i = 0; i < 24; i++ ) {
		Xwing.getDataset("DS_STIME").addRow([ f_lpad(i.toString(), "0", 2)+"00", f_lpad(i.toString(), "0", 2)+":00"]);
		Xwing.getDataset("DS_ETIME").addRow([ f_lpad((i+1).toString(), "0", 2)+"00", f_lpad((i+1).toString(), "0", 2)+":00"]);
	}
	
	Xwing.getCombo("cmb_stime").setItemindex("0");
	Xwing.getCombo("cmb_etime").setItemindex((Xwing.getDataset("DS_ETIME").size()-1).toString());
	Xwing.getDatepicker("cal_sdate").setValue(g_toDate());
	Xwing.getDatepicker("cal_edate").setValue(g_toDate());
	
	f_selCodeBook();
}

function f_selCodeBook() {
	var param = {
		cmd : "getCodes",
		codeType : "SYS070",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_selCodeBook",
		url : "service::cs.com.codeutil.do",
		param : param,
		indicator : false
	};
	Xwing.request(opt, callback);
}

function f_lpad(s, c, n) {
	if (!s || !c || s.length >= n) {
		return s;
	}

	var max = (n - s.length) / c.length;
	for ( var i = 0; i < max; i++) {
		s = c + s;
	}
	return s;
}

function cmb_server_ip_change(event) {
	Xwing.getDataset("DS_SERVER_IP").setCursor(parseInt(Xwing.getCombo("cmb_server_ip").getItemindex()));
}

function f_getinfo() {
	if(g_isEmpty(Xwing.getEdit("edt_server_ip").getValue())) {
		xwing.Dialog.alert("XCron 서버 정보에서 서버IP를 선택하십시오.");
		return false;
	}

	var param = {
		cmd	: "getinfo"
		,type	: "Service"
		,SERVER_IP	: Xwing.getEdit("edt_server_ip").getValue()
		,SERVER_PORT	: Xwing.getEdit("edt_port").getValue()
		,SERVER_TIMEOUT	: Xwing.getEdit("edt_timeout").getValue()
	};

	var opt = {
		reqId		: "getinfo"
		,url		: "service::cs.xcron.control.exe.do"
		,param		: param
		,indicator	: null
		,showError	: true
	};
	
	Xwing.request(opt, callback);
}

function f_getloginfo() {
	if(g_isEmpty(Xwing.getEdit("edt_server_ip").getValue())) {
		xwing.Dialog.alert("XCron 서버 정보에서 서버IP를 선택하십시오.");
		return false;
	}

	var param = {
			_sqlName : "wfm.xcron.xcron010m.servicelog.sel"
			,p_server_ip	: Xwing.getEdit("edt_server_ip").getValue()
			,p_service_name	: Xwing.getEdit("edt_service_id").getValue()
			,p_sdate	: Xwing.getDatepicker("cal_sdate").getValue()
			,p_stime	: Xwing.getCombo("cmb_stime").getValue()
			,p_edate	: Xwing.getDatepicker("cal_edate").getValue()
			,p_etime	: Xwing.getCombo("cmb_etime").getValue()
			,p_proc_rslt	: Xwing.getCombo("cmb_proc_result").getValue()
	};
		
	var opt = {
			reqId		: "btn_sel_log_click"
			,url		: "service::cs.xcron.log.sel.do"
			,param		: param
			,indicator	: null
			,showError	: true
	};
		
	Xwing.request(opt, callback);
}

function btn_sel_click(event) {
	f_getinfo();
}

function dgrd_log_click(event) {
	var bindColumn = event.cell.getBindcolumn();
	
	if(bindColumn == "ERR_MSG") {
		var v_err_msg = $DS_SERVICELOG.getValue(event.rowIdx, "ERR_MSG");
		
		if(v_err_msg != "") {
			xwing.Dialog.alert(v_err_msg);
		}
	}
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}	
	
	switch(reqId) {
	
	case "f_selCodeBook":

		Xwing.getDataset("DS_SERVER_IP").setData(res.SYS070.column, res.SYS070.record);
		Xwing.getCombo("cmb_server_ip").setItemindex("0");
		
		break;
		
	case "getinfo":
		Xwing.getDataset("DS_SERVICE_LIST").clear();
		Xwing.getDataset("DS_SERVICE_LIST").setData(res.XCRON_RESULT.column, res.XCRON_RESULT.record);
		f_getloginfo();
		break;
		
	case "btn_sel_log_click":
		Xwing.getDataset("DS_SERVICELOG").setData(res.DS_SERVICELOG.column, res.DS_SERVICELOG.record);
		
		for(var i=0; i<$DS_SERVICELOG.size(); i++) {
			var v_service_id = $DS_SERVICELOG.getValue(i, "SERVICE_NAME");
			
			for(var j=0; j<$DS_SERVICE_LIST.size(); j++) {
				var t_service_id = $DS_SERVICE_LIST.getValue(j, "ID");
				
				if(v_service_id == t_service_id) {
					var t_description = $DS_SERVICE_LIST.getValue(j, "DESCRIPTION");
					$DS_SERVICELOG.setValue(i, "DESCRIPTION", t_description);
				}
			}
		}
		
		break;
		
	}
}


/*]]>*/</script>
