function getMentDetailRes(){
	var opt = {
			reqId: "getMentRes",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t5.getDmboRes.sel',
				PROD_CD : parent.prod_cd,
				CED_NO : parent.ced_no
			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

function getMentDetailStt(){	
	var opt = {
			reqId: "getDetailStt",
			url: "service::msens.xcron.hansol.sttEncryptWebaction.do",
			param: {
				_sqlName  : 'oba.oba010t5.getMentDetailRes.sel'
				,TYPE : 'D'
				,PROD_CD : parent.prod_cd
				,CED_NO : parent.ced_no
				,DMBO_CD : dmbo_cd
			},
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getMentRes":
			$DS_MENT_RES.setData(res.DS_MENT_RES.column, res.DS_MENT_RES.record);
			
			if($DS_MENT_RES.size() > 0){
				grd_dmbo_list_dblclick();
			}else{
				$DS_MENT_RES.addRow();
				$DS_MENT_RES.setValue(0,"DMBO_NM","담보에 등록된 필수멘트가 없습니다.");
				$DS_MENT_RES.setValue(0,"MENT_CNT","X");
				
			}
			
		break;
		
		case "getDetailStt" :
			$DS_MENT_ANS.setData(res.DS_RES.column, res.DS_RES.record);
			/*var idxs = $DS_MENT_ANS.searchRow("[DMBO_CD =='"+dmbo_cd+"']");
			
			for(var i =0; i< idxs.length; i++){
				$("#grd_ment_stt .xw-datagrid-area-body table tbody tr[cy='"+idxs[i]+"']").addClass("select");
			}
			
			$DS_MENT_ANS.setCursor(idxs[0]);*/
			
		break;
	}
}

function grd_dmbo_list_dblclick(event) {
	if(event != null){

	getMentDetailStt();
}

function grd_ment_stt_click(event) {
	var nCell = event.cell._getColIndex();
	
	var selected = document.querySelectorAll("#grd_ment_stt .select");
	for(var i=0, len=selected.length; i<len; i ++){
		selected[i].classList.remove("select");
	}
	
	$("#grd_ment_stt .xw-datagrid-area-body table tbody tr[cy='"+event.rowIdx+"']").addClass("select");
	
	if(nCell == 0){
		var selectedRec = $DS_MENT_ANS.getValue(event.rowIdx,'UCID');
		if(selectedRec == ''){
			//xwing.Dialog.alert("준수문장이 없습니다.");
			return;
		}			
		
		rec_key =  $DS_MENT_ANS.getValue(event.rowIdx,'UCID');
		call_time = $DS_MENT_ANS.getValue(event.rowIdx,'UCID_DATE');
		file_path = $DS_MENT_ANS.getValue(event.rowIdx,'FILE_FULL_PATH');
		if(parent.selected_ucid != rec_key){
			parent.load_player(rec_key,call_time,'L', file_path);
			parent.selected_ucid = rec_key;
			parent.cmb_ucid_date_change2(rec_key);
		}
		
	}else if(nCell == 2){
		var selectedRec = $DS_MENT_ANS.getValue(event.rowIdx,'UCID');
		var selectedTime = $DS_MENT_ANS.getValue(event.rowIdx,'UCID_DATE');
		var selectedFile = $DS_MENT_ANS.getValue(event.rowIdx,'FILE_FULL_PATH');
		
		
		if(selectedRec == ''){
			return;
					
		}else if(parent.selected_ucid != '' && parent.selected_ucid != selectedRec){
			xwing.Dialog.alert("현재 청취하고 계시는 녹취 콜과 다른 콜입니다.\n 좌측의 청취 버튼을 클릭해주세요.");
			return;
		}else{
			var start_point = $DS_MENT_ANS.getValue(event.rowIdx,'START_TIME');
			parent.seekToSTT(start_point);
		}
		
		/*if(selectedRec != rec_key && selectedTime != call_time){
			rec_key = selectedRec;
			call_time = selectedTime;
			file_path = selectedFile;
			parent.load_player(rec_key,call_time,'L', file_path);
		}else{
			var start_point = $DS_MENT_ANS.getValue(event.rowIdx,'START_TIME');
			
			parent.seekToSTT(start_point);
		}*/
	}
}
/* ***********************************************************

 *************************************************************/
function stt_del_alpha_num_expr(cellObj,rowIdx) {
	var opt = {};
	var sent = $DS_MENT_ANS.getValue(rowIdx, "STT_SENT");
	//sent.replace('\|',''); --이건 쿼리에서 제거
	sent = sent.replace(/[A-Za-z0-9]/gi,""); //한글만
	opt['value'] = sent.replace(/(^\s*)|(\s*$)/gi, ""); //앞 공백제거
	
	if(duplicateIdx.length > 0){
		for(var i=0, len=duplicateIdx.length; i<len; i++){
			
			if(duplicateIdx[i]==rowIdx){
				opt['bgcolor'] = "#d8e9ee";
			}else{
				opt['bgcolor'] = "#fff";
			}
		}
	}
	
	return opt;
}

function setColor2(cellObj,rowIdx) {
	var val={};
	
	if($DS_MENT_ANS.getValue(rowIdx,"UCID") != ""){
		if($DS_MENT_ANS.getValue(rowIdx-1,"UCID") != $DS_MENT_ANS.getValue(rowIdx,"UCID")){
			val['bgimage'] = "../images/icon_notice.png";
			val['bgimagerepeat'] = "no-repeat";
			val['bgimagealign'] = "center center";
		}
	}else{
		$DS_MENT_ANS.setValue(rowIdx,"UCID_DATE","X");
	}

	return val;
