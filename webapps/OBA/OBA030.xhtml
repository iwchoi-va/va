function btn_search_click(event) {
	if(event != undefined){
		c_page = 1;
		c_start = 0;
	}
	
	if(checkDate($dpk_sdate,$dpk_edate,$edt_stime,$edt_etime)) return;

	var sdate = "", edate = "", type = "";
	$DS_LIST1.clearData();
	$DS_LIST2.clearData();
	$DS_LIST3.clearData();

	type = $cmb_type.getValue();

	//if (g_checkDate(sdate,edate)== false)	return;

	//parameters
	var v_sql = "oba.oba030.gradeResult.cedno.cnt.sel,oba.oba030.gradeResult.cedno.sel";
	if(type == 'C') {
		v_sql = "oba.oba030.gradeResult.org2.cnt.sel,oba.oba030.gradeResult.org2.sel";
	}else if(type == 'T'){
		v_sql = "oba.oba030.gradeResult.user.cnt.sel,oba.oba030.gradeResult.user.sel";
	}

	var sdate = $dpk_sdate.getValue()+$edt_stime.getValue();
	var edate = $dpk_edate.getValue()+$edt_etime.getValue();

	var ced_no = $edt_ced_no.getValue();
	var grade = $cmb_grade.getValue();
	var new_user_id = $chk_new_user.getValue()=="true"?$chk_new_user.getValue():"";
	var cust_nm = $edt_cust_nm.getValue();
	var qc_nm = $edt_qc_nm.getValue();

	var param	= {
			TYPE : type,
			_sqlName: v_sql,
			SDATE:sdate,
			EDATE:edate,
			CED_NO:ced_no,
			GRADE:grade,
			CUST_NM:cust_nm,
			QC_NM : qc_nm,
			new_user_id : new_user_id
			, _START : c_start
			, _PAGESIZE : c_pageSize

	};

	g_orgToParam("", param);
	g_productToParam("",param);
	g_analStatToParam("",param);

	var opt 	= {
			reqId: "btn_search_click",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "f_codebook_sel" :
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);

			getGradeinfo();
			var authLevel = top.$DS_GRADEAUTH.getValue(top.$DS_GRADEAUTH.indexOfRow("CODEID",global("G_USER_GRADE")),"ETC1");
			if(authLevel == 4){
				setTimeout(function(){btn_search_click();},1500); //상담사 세팅까지 기다림.
			}else{
				setTimeout(function(){btn_search_click();},600);
			}

			break;
		case "f_Headcodebook_sel":
			$DS_HEAD.setData(res.VSS160.column, res.VSS160.record);
			var grdName = ["grd_c_list","grd_t_list"];
			var startIdx = [9,11];
			for(var i =0 , len=grdName.length; i<len ; i++){
				var k =0;
				for(var j=startIdx[i], len2 = startIdx[i]+$DS_HEAD.size() , k = 0; j< len2; j++, k++){
					Xwing.getDataGrid(grdName[i]).getCell('head',0,j).setText($DS_HEAD.getValue(k,"CODENAME"));
				}
			}
			break;
		case "getGradeinfo":

			$DS_WEIGHT.setData(res.DS_RES_WEIGHT.column, res.DS_RES_WEIGHT.record);
			var help="※Grade가중치:";
			for(var i=0, len = $DS_WEIGHT.size(); i<len; i++){
				help += ' '+$DS_WEIGHT.getValue(i,"CODE_NM")+":"+$DS_WEIGHT.getValue(i,"WEIGHT");
			}
			$lbl_help.setValue(help);
			$lbl_help.setWidth(50+$lbl_help.getValue().length*7);
			//$lbl_help.setLeft($lbl_help.getLeft()+70-$lbl_help.getWidth());
			break;
		case 'btn_search_click' :
			var type =$cmb_type.getValue();

				if(type == 'A') {
					$DS_LIST1.setData(res.DS_LIST.column, res.DS_LIST.record);
				}else if(type == 'C') {
					var org2_cd = "",cntr_data="",ced_cnt = "", duration="";
					$DS_LIST2.setData(res.DS_LIST2.column, res.DS_LIST2.record);
				}else if(type == 'T'){
					var user_id = "",user_data="",ced_cnt = "", duration="";
					$DS_LIST3.setData(res.DS_LIST3.column, res.DS_LIST3.record);
				}
			c_totalPage	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize);
			Xwing.getEdit("edit_rowcnt").setValue(res.DS_CNT_LIST.record[0]);
			setPaging();

			break;
	}
}

function expr_dateTime(cellObj,rowIdx) {
	var opt = {};
	var dsName="";

	if($cmb_type.getValue() == 'A') {
		dsName = "DS_LIST1";
	}else{
		dsName="DS_DETAIL";
	}
	var datetime = eval("$"+dsName+".getValue(rowIdx,'CED_DATE')");
	var yyyy = datetime.substr(0,4);
	var MM = datetime.substr(4,2);
	var dd = datetime.substr(6,2);
	var hh =datetime.substr(8,2);
	var mm =datetime.substr(10,2);
	var ss =datetime.substr(12,2);

	opt=yyyy+"-"+MM+"-"+dd+" "+hh+":"+mm+":"+ss;
	//var score = $DS_RES.getValue(rowIdx, "SCORE");
	return opt;
}

function expr_duration(cellObj,rowIdx) {
	var opt = {};
	var dsName="";
	var type = $cmb_type.getValue();
	if(type == 'A') {
		dsName = "DS_LIST1";
	}else if(type == 'C') {
		dsName = "DS_LIST2";
	}else{
		dsName = "DS_LIST3";
	}

	var totalSeconds = eval("$"+dsName+".getValue(rowIdx,'DURATION')");
	//var score = $DS_RES.getValue(rowIdx, "SCORE");

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();
	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}

function setPaging(){
	Xwing.getButton("btn_page_last").setEnabled(true);
	Xwing.getButton("btn_page_next").setEnabled(true);
	Xwing.getButton("btn_page_pre").setEnabled(true);
	Xwing.getButton("btn_page_first").setEnabled(true);

	if(c_totalPage > 0){
		$edt_curPage.setValue(c_page);
		$edt_totalPage.setValue(c_totalPage);
	}else{
		$edt_curPage.setValue("");
		$edt_totalPage.setValue("");
	}
	
	
	
	//페이징버튼세팅
	if( c_page == 1 || c_totalPage == 0 )
	{
		Xwing.getButton("btn_page_first").setEnabled(false);
		Xwing.getButton("btn_page_pre").setEnabled(false);
	}else{
		Xwing.getButton("btn_page_first").setEnabled(true);
		Xwing.getButton("btn_page_pre").setEnabled(true);
	}

	if( c_page == c_totalPage || c_totalPage == 0 )
	{
		Xwing.getButton("btn_page_last").setEnabled(false);
		Xwing.getButton("btn_page_next").setEnabled(false);
	}else{
		Xwing.getButton("btn_page_last").setEnabled(true);
		Xwing.getButton("btn_page_next").setEnabled(true);
	}

	if(c_totalPage > 1){
		$edt_curPage.setEnabled(true);
	}
}

function btn_page_first_click(event) {
	c_page = 1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_pre_click(event) {
	c_page = c_page-1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_next_click(event) {
	c_page = c_page+1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_last_click(event) {
	c_page = c_totalPage;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function cmb_page_change(event) {
	c_page = Xwing.getDataset("DS_PAGE_CNT").getValue((event.value-1), "PAGE");
	c_start = (c_page-1)*c_pageSize;

	btn_search_click();

}

function edt_curPage_keydown(event) {
	if(event.event.keyCode == '13') {
		if(parseInt($edt_curPage.getValue()) > c_totalPage){
			xwing.Dialog.alert("전체 페이지 수를 초과합니다.");
			$edt_curPage.setValue(c_page);
			return;
		}
		if(parseInt($edt_curPage.getValue()) < 1){
			xwing.Dialog.alert("0보다 큰 숫자를 입력해주세요.");
			$edt_curPage.setValue(c_page);
			return;
		}
		c_page = parseInt($edt_curPage.getValue());
		c_start = (c_page-1)*c_pageSize;
		btn_search_click();
}
