function reciever(param){
	init_search();
	setTimeout(function(){
		param = param.gubun == undefined? parent._parameter: param;
		var ced_no=param.ced_no != undefined? param.ced_no:'';
		var p_gubun = param.gubun != undefined? param.gubun:'';
		var user_id = param.user_id != undefined? param.user_id:'';
		var org1_cd = param.org1_cd != undefined? param.org1_cd:$cmb_org1.getValue();
		var org2_cd =param.org2_cd != undefined? param.org2_cd:'';
		var org3_cd =param.org3_cd != undefined? param.org3_cd:'';
		var sdate =param.sdate != undefined? param.sdate:'';
		var edate =param.edate != undefined? param.edate:'';
		var stime =param.stime != undefined? param.stime:'';
		var etime =param.etime != undefined? param.etime:'';

		if(p_gubun == 'A')$edt_ced_no.setValue(ced_no);
		if(p_gubun == 'C')g_setOrg(org1_cd,org2_cd);
		if(p_gubun == 'T')g_setOrg(org1_cd,org2_cd,org3_cd,user_id);
		//alert(stime);
		if(sdate != "") $dpk_sdate.setValue(sdate);
		if(edate != "") $dpk_edate.setValue(edate)
		if(stime != "") $edt_stime.setValue(stime)
		if(edate != "") $edt_etime.setValue(etime);


		setTimeout(function(){btn_search_click();},400);
	},300);
}

function btn_search_click(event) {
	if(checkDate($dpk_sdate,$dpk_edate,$edt_stime,$edt_etime)) return;
	$DS_BAN_DETAIL.clearData();
	$DS_RES.clearData();
	$grd_list.setHeight($page.getHeight()-$search_box.getHeight()-$lbl_subtitle1_0.getHeight()-30);
	$pnl_detail.setVisible(false);
	$splitbar.setVisible(false);
	$pnl_ban_grp.setVisible(false);
	if(event != undefined){
		c_page = 1;
		c_start = 0;
		c_page2 = 1;
		c_start2 = 0;
		$pnl_detail.setVisible(false);
	}
	
	if($edt_ced_no.getValue() != ""){
		getBannedGroup();
	}else{
		setTimeout(function(){f_getBannedTermsRes();},300);
	}


}

function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "f_codebook_sel" :
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);

			$cmb_ban_grp.setItemindex("0");
			$DS_HEAD.clearData();

				setTimeout(function(){
					init_search();
					setTimeout(function(){btn_search_click();},300);
				},400);
			}
			break;
		case "getBannedGroup" :
			$DS_GRP.setData(res.DS_GRP_RES.column, res.DS_GRP_RES.record);

			if($DS_GRP.size()>0){
				var help="";

					help += $DS_GRP.getValue(i,"GRP_NM")+",";

				($cmb_ban_grp.getValue());
