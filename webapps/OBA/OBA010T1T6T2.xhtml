function getInsuPlanPaAuth(){
	//CON_FAMAILY_GB = '1'  /* 1:대리인, 2:친권자 */
	var opt = {
			reqId: "getInsuPlanPaAuth",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t1t6.getInsuPlanPaAuth.sel,oba.oba010t1t1.isMaskYn.sel,oba.oba010t1t1.getUserGrade.sel', 
				CED_NO : ced_no,
				USER_ID : user_id,
				CON_FAMAILY_GB : "2"
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}


/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getInsuPlanPaAuth":
			$DS_INFO.setData(res.DS_LIST.column, res.DS_LIST.record);
			$DS_MASK.setData(res.DS_MASK.column, res.DS_MASK.record);
			$DS_USER_GRADE.setData(res.DS_USER_GRADE.column, res.DS_USER_GRADE.record);
			
			var opt = {qmYn : $DS_MASK.getValue(0,"QM_YN") 
					,usergroupcd : $DS_MASK.getValue(0,"USERGROUPCD") 
					,conPolNo :$DS_MASK.getValue(0,"CON_POL_NO")
					,gradeinfo : $DS_USER_GRADE.getValue(0,"USER_GRADE") 
					, grade : user_grade};
			
			$conPa1PsnNo.setValue(setMask($DS_INFO.getValue(0,"CON_PA1_PSN_NO"),'j',opt)); //계약자 주민번호
			$conPa1Addr2.setValue(setMask($DS_INFO.getValue(0,"CON_PA1_ADDR_2"),'a',opt)); //계약자 주소2
			$conPa1HomeTel.setValue(setMask($DS_INFO.getValue(0,"CON_PA1_HOME_TEL"),'e',opt)); //계약자 자택번호
			$conPa1HpNo.setValue(setMask($DS_INFO.getValue(0,"CON_PA1_HP_NO"),'p',opt)); //계약자 휴대번호
			$conPa1OffTel.setValue(setMask($DS_INFO.getValue(0,"CON_PA1_OFF_TEL"),'e',opt)); //계약자 직장번호
			$conPa1EtcTel.setValue(setMask($DS_INFO.getValue(0,"CON_PA1_ETC_TEL"),'e',opt)); //계약자 기타번호
			
			$conPa2PsnNo.setValue(setMask($DS_INFO.getValue(0,"CON_PA2_PSN_NO"),'j',opt)); //계약자 주민번호
			$conPa2Addr2.setValue(setMask($DS_INFO.getValue(0,"CON_PA2_ADDR_2"),'a',opt)); //계약자 주소2
			$conPa2HomeTel.setValue(setMask($DS_INFO.getValue(0,"CON_PA2_HOME_TEL"),'e',opt)); //계약자 자택번호
			$conPa2HpNo.setValue(setMask($DS_INFO.getValue(0,"CON_PA2_HP_NO"),'p',opt)); //계약자 휴대번호
			$conPa2OffTel.setValue(setMask($DS_INFO.getValue(0,"CON_PA2_OFF_TEL"),'e',opt)); //계약자 직장번호
			$conPa2EtcTel.setValue(setMask($DS_INFO.getValue(0,"CON_PA2_ETC_TEL"),'e',opt)); //계약자 기타번호
			
			var r = $DS_RES.searchRow("[ev =='"+ $DS_INFO.getValue(0,"CON_PA1_GB") +"']");
			$conPa1Gb.setValue($DS_RES.getValue(r,"evNm"));
			
			var r2 = $DS_RES.searchRow("[ev =='"+ $DS_INFO.getValue(0,"CON_PA2_GB") +"']");
			$conPa2Gb.setValue($DS_RES.getValue(r2,"evNm"));
			
			break;
		case "stndItemEvInBndVOList":	
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			
			getInsuPlanPaAuth();
		default: break;	
	}
}



function fnCallWebService(){
	//"https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0090&_reqJson={\"planNo\":\"941802602612\"}";
	//var url = "https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0090&_reqJson={\"planNo\":\"941802602612\"}";
	
	var url = getWebServiceURL();
	var serviceName ="LTTMINFR0137";
	var reqJson ="{reqItcd:73041}";
	//var reqJson ="{\"planNo\":\""+ '941802602612' +"\"}";
	
	var opt = {
			reqId: "stndItemEvInBndVOList",
			url: "service::oba.oba010T3.getHistDtlIvstInfoList.sel.do",
			param: {
				serviceUrl: url,
				serviceName : serviceName ,
				serviceResult : "stndItemEvInBndVOList",
				reqJson :reqJson,
				DS_RES: $DS_RES
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
	
	//$panel0.setUrl("https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0090&_reqJson={\"planNo\":\"941802602612\"}");



}

function getWebServiceURL(){
	
	var hostname = window.location.hostname.split(".");
	
	var url ="";
	if(hostname[0] == "vadev"){
		url = "https://tsdev.aig.co.kr/tmMciService.do";
		//url = "http://10.51.193.38:18080/tmMciService.do";
	}else if(hostname[0] == "vauat"){
		url = "https://tsuat.aig.co.kr/tmMciService.do";
	}else if(hostname[0] == "va"){
		url = "https://ts.aig.co.kr/tmMciService.do";
	}else{//로컬도 개발url로.
		url = "https://tsuat.aig.co.kr/tmMciService.do";
		//url = "https://tsdev.aig.co.kr/tmMciService.do";
		//url = "http://10.51.193.38:18080/tmMciService.do";
	}
	
	return url;
}
