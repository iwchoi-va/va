<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var v_url="service::oba.oba010.sel.do";
var ced_no="",user_grade="",isMask="", browser="" ,user_id ="";
/***********************************************************************

 * *********************************************************************/

function page_load(event) {
		XwingObject();
		
		
		ced_no= parent.ced_no;
		user_grade = parent.parent.user_grade;
		user_id = parent.parent.user_id;
		getCustId();
		combo0_change();
		//lbl_tab1_click();
}

//*********************************************************************************************************
//* UI ACTION
//*********************************************************************************************************/
function getCustId(){
	var opt = {
			reqId: "getCustId",
			url: v_url,
			param: {		
				_sqlName  : 'oba.oba010t1t4.getCustId.sel,oba.oba010t1t1.isMaskYn.sel,oba.oba010t1t1.getUserGrade.sel', 
				CED_NO : ced_no,
				USER_ID : user_id
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}


/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getCustId":
			$DS_CUST.setData(res.DS_CUST.column, res.DS_CUST.record);
			$DS_MASK.setData(res.DS_MASK.column, res.DS_MASK.record);
			$DS_USER_GRADE.setData(res.DS_USER_GRADE.column, res.DS_USER_GRADE.record);
			
			var opt = {qmYn : $DS_MASK.getValue(0,"QM_YN") 
					,usergroupcd : $DS_MASK.getValue(0,"USERGROUPCD") 
					,conPolNo :$DS_MASK.getValue(0,"CON_POL_NO")
					,gradeinfo : $DS_USER_GRADE.getValue(0,"USER_GRADE") 
					, grade : user_grade};
			
			$conIpPsnNo.setValue(setMask($DS_CUST.getValue(0,'CON_IP_PSN_NO_MASK'),'j',opt));
			$conIpIsdName.setValue($DS_CUST.getValue(0,'CON_IP_ISD_NAME'));
			$cedNo.setValue(ced_no);
			break;
		default: break;	
	}
}

function combo0_change(event) {
	
	var url = ($combo0.getValue("code") == "1") ? "./OBA010T1T6T1.xhtml" : "./OBA010T1T6T2.xhtml";
	$pan_tab_content.setUrl(url);	
	
}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="DS_CUST">
		<xwing:dataset-column id="CON_IP_PSN_NO_MASK"></xwing:dataset-column>
		<xwing:dataset-column id="CON_IP_ISD_NAME"></xwing:dataset-column>
		<xwing:dataset-column id="CON_IP_PSN_NO"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="DS_MASK"></xwing:dataset>
	<xwing:dataset id="DS_COMBO">

		<xwing:dataset-row>

		<xwing:dataset-row>

		</xwing:dataset-row>
	</xwing:dataset>
	<xwing:dataset id="DS_USER_GRADE"></xwing:dataset>
</xwing:data>
