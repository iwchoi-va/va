//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "f_init_codebook_sel" :
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
			$ds_time.copyFrom($DS_RPT200);
			init_search();
		break;
		case "f_codebook_sel" :
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
			$ds_time.copyFrom($DS_RPT200);
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);
			$DS_SYS105.setData(res.SYS105.column, res.SYS105.record);
			
//			var help="※계피구분코드 :";
//			for(var i=0, len = $DS_SYS105.size(); i<len; i++){
//				help += ' '+$DS_SYS105.getValue(i,"CODEID")+":"+$DS_SYS105.getValue(i,"CODENAME");
//			}
//			$lbl_help.setValue(help);
//			$lbl_help.setWidth(50+$lbl_help.getValue().length*8);
//			$lbl_help.setLeft($lbl_help.getLeft()+80-$lbl_help.getWidth());
			f_getDmbo();
			
			
			
			break;
		case "f_getDmbo" :
			$DS_DMBO_TEMP.setData(res.DS_DMBO.column, res.DS_DMBO.record);
			$DS_DMBO.setData(res.DS_DMBO.column, res.DS_DMBO.record);
			$DS_DMBO.insertRow(0, [ "", "","전체" ]);
			if(!parent._load_val){
				setTimeout(function(){
					init_search();
					setTimeout(function(){btn_search_click();},500);
				},400);
			}
		break;
		case 'btn_search_click' :
			$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);

			c_totalPage	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize);
			Xwing.getEdit("edit_rowcnt").setValue(res.DS_CNT_LIST.record[0]);
			detail_paging = false;
			setPaging();


			break;
		case 'getDetailRes' :
			$DS_DETAIL.setData(res.DS_LIST.column, res.DS_LIST.record);
			c_totalPage2	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize2);
			Xwing.getEdit("edit_rowcnt2").setValue(res.DS_CNT_LIST.record[0]);

			detail_paging = true;

			setPaging();


			break;

	}

}

function expr_dateTime(cellObj,rowIdx) {
	var opt = {};
	var datetime = $DS_LIST.getValue(rowIdx,'CED_DATE');
	var yyyy = datetime.substr(0,4);
	var MM = datetime.substr(4,2);
	var dd = datetime.substr(6,2);
	var hh =datetime.substr(8,2);
	var mm =datetime.substr(10,2);
	var ss =datetime.substr(12,2);

	opt=yyyy+"-"+MM+"-"+dd+" "+hh+":"+mm+":"+ss;
	//var score = $DS_RES.getValue(rowIdx, "SCORE");
	return opt;
}

function expr_excel_duration(cellObj,rowIdx) {
	var opt = {};
	var dsName="DS_EXCEL";

	var totalSeconds = eval("$"+dsName+".getValue(rowIdx,'RECODE_TIME')");
	//var score = $DS_RES.getValue(rowIdx, "SCORE");

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();
	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}

	var opt = {};
	var dsName="";

function setPaging(){

	if(!detail_paging){
		Xwing.getButton("btn_page_last").setEnabled(true);
		Xwing.getButton("btn_page_next").setEnabled(true);
		Xwing.getButton("btn_page_pre").setEnabled(true);
		Xwing.getButton("btn_page_first").setEnabled(true);

		if(c_totalPage > 0){
			$edt_curPage.setValue(c_page);
			$edt_totalPage.setValue(c_totalPage);
		}else{
			$edt_curPage.setValue("");
			$edt_totalPage.setValue("");
		}
		
		//페이징버튼세팅
		if( c_page == 1 || c_totalPage == 0 )
		{
			Xwing.getButton("btn_page_first").setEnabled(false);
			Xwing.getButton("btn_page_pre").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_first").setEnabled(true);
			Xwing.getButton("btn_page_pre").setEnabled(true);
		}

		if( c_page == c_totalPage || c_totalPage == 0 )
		{
			Xwing.getButton("btn_page_last").setEnabled(false);
			Xwing.getButton("btn_page_next").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_last").setEnabled(true);
			Xwing.getButton("btn_page_next").setEnabled(true);
		}
		if(c_totalPage > 1){
			$edt_curPage.setEnabled(true);
		}
	}else{
		Xwing.getButton("btn_page_last2").setEnabled(true);
		Xwing.getButton("btn_page_next2").setEnabled(true);
		Xwing.getButton("btn_page_pre2").setEnabled(true);
		Xwing.getButton("btn_page_first2").setEnabled(true);

		if(c_totalPage2 > 0){
			$edt_curPage2.setValue(c_page2);
			$edt_totalPage2.setValue(c_totalPage2);
		}else{
			$edt_curPage2.setValue("");
			$edt_totalPage2.setValue("");
		}
		
		//페이징버튼세팅
		if( c_page2 == 1 || c_totalPage2 == 0 )
		{
			Xwing.getButton("btn_page_first2").setEnabled(false);
			Xwing.getButton("btn_page_pre2").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_first2").setEnabled(true);
			Xwing.getButton("btn_page_pre2").setEnabled(true);
		}

		if( c_page2 == c_totalPage2 || c_totalPage2 == 0 )
		{
			Xwing.getButton("btn_page_last2").setEnabled(false);
			Xwing.getButton("btn_page_next2").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_last2").setEnabled(true);
			Xwing.getButton("btn_page_next2").setEnabled(true);
		}
		if(c_totalPage2 > 1){
			$edt_curPage2.setEnabled(true);
		}
	}
}
