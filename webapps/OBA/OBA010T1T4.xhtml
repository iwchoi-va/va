<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var v_url="service::oba.oba010t1t4.getMrLsHist.sel.do";
var ced_no="", user_grade="",browser="";
/***********************************************************************

 * *********************************************************************/

function page_load(event) {
		XwingObject();
		
		ced_no= parent.ced_no;
		user_grade = parent.parent.user_grade;
		getCustId();
		//엑셀다운권한정의
		//excelDownAuth($btn_excel,false,false);
}

//*********************************************************************************************************
//* UI ACTION
//*********************************************************************************************************/
function getCustId(){
	var opt = {
			reqId: "getCustId",
			url: v_url,
			param: {		
				_sqlName  : 'oba.oba010t1t4.getCustId.sel,oba.oba010t1t1.isMaskYn.sel,oba.oba010t1t1.getUserGrade.sel', 
				CED_NO : ced_no,
				USER_ID : parent.parent.user_id
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}

function getMrLsHist(cust_id){
	//B.CON_IP_PSN_NO --피보험자 주민번호
	//,B.CON_IP_ISD_NAME  -- 피보험자 명
	
	var opt = {
			reqId: "getMrLsHist",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t1t4.getMrHist.sel', 
				CUST_ID : cust_id
					
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}


/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getCustId":
			$DS_CUST.setData(res.DS_CUST.column, res.DS_CUST.record);
			$DS_MASK.setData(res.DS_MASK.column, res.DS_MASK.record);
			$DS_USER_GRADE.setData(res.DS_USER_GRADE.column, res.DS_USER_GRADE.record);
			
			var opt = {qmYn : $DS_MASK.getValue(0,"QM_YN") 
					,usergroupcd : $DS_MASK.getValue(0,"USERGROUPCD") 
					,conPolNo :$DS_MASK.getValue(0,"CON_POL_NO")
					,gradeinfo : $DS_USER_GRADE.getValue(0,"USER_GRADE") 
					, grade : user_grade};
			
			$conIpPsnNo.setValue(setMask($DS_CUST.getValue(0,'CON_IP_PSN_NO_MASK'),'j',opt));
			$conIpIsdName.setValue($DS_CUST.getValue(0,'CON_IP_ISD_NAME'));
			
			var cust_id = g_isEmpty($DS_CUST.getValue(0,'CON_IP_PSN_NO')) ? " " : $DS_CUST.getValue(0,'CON_IP_PSN_NO');
			
			getMrLsHist(cust_id);
			
		break;
		case "getMrLsHist":
			
			$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
			
			break;
		default: break;	
	}
}


/*]]>*/</script>
