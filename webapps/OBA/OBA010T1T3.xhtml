function page_load(event) {
		XwingObject();
		
		ced_no= parent.ced_no;
		//alert(ced_no);
		fnCallWebService();
}

//*********************************************************************************************************
//* UI ACTION
//*********************************************************************************************************/
function getInfo(){
	var opt = {
			reqId: "getInfo",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t1.getInfo.sel', 
				CED_NO : ced_no
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}


/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getHistDtlIvstInfoList":
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			break;
		default: break;	
	}
}

function fnCallWebService(){
	//"https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0090&_reqJson={\"planNo\":\"941802602612\"}";
	//var url = "https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0090&_reqJson={\"planNo\":\"941802602612\"}";
	
	var url = getWebServiceURL();
	var serviceName ="LTTMINFR0090";
	var reqJson ="{planNo:"+ ced_no +"}";
	//var reqJson ="{\"planNo\":\""+ '941802602612' +"\"}";
	
	var opt = {
			reqId: "getHistDtlIvstInfoList",
			url: "service::oba.oba010T3.getHistDtlIvstInfoList.sel.do",
			param: {
				serviceUrl: url,
				serviceName : serviceName ,
				serviceResult : "uwHistoryDetailIvstInfoVOList",
				reqJson :reqJson,
				DS_RES: $DS_RES
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
	
	//$panel0.setUrl("https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0090&_reqJson={\"planNo\":\"941802602612\"}");



}

function getWebServiceURL(){
	
	var hostname = window.location.hostname.split(".");
	
	var url ="";
	if(hostname[0] == "vadev"){
		url = "https://tsdev.aig.co.kr/tmMciService.do";
		//url = "http://10.51.193.38:18080/tmMciService.do";
	}else if(hostname[0] == "vauat"){
		url = "https://tsuat.aig.co.kr/tmMciService.do";
	}else if(hostname[0] == "va"){
		url = "https://ts.aig.co.kr/tmMciService.do";
	}else{//로컬도 개발url로.
		url = "https://tsuat.aig.co.kr/tmMciService.do";
		//url = "https://tsdev.aig.co.kr/tmMciService.do";
		//url = "http://10.51.193.38:18080/tmMciService.do";
	}
	
	return url;
}/*]]>*/</script>
