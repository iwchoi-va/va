<script type="text/javascript" charset="UTF-8">/*<![CDATA[*//* ******************************************************************************************************

var ban_keyword ="", ban_cd = "";
var v_url = "service::oba.oba040p1.getBankeywordDeptRank.sel.do";
/*
 * 소속별 랭킹화면 추가 구현사항
 * 1. 팀별로 금칙어 건수 조회해온 다음 소속별, 센터별 sum해서 각각의 dataset에 넣어주는 작업 수행하면됨
 * 2. 각각의 건수 별로 sorting 후 rank 부여
 * 3. 엑셀다운로드 구현
 */
/* ******************************************************************************************************
 * 	로딩
 ********************************************************************************************************/
function page_load(event) {
	XwingObject();

	ban_keyword = Xwing.param.ban_keyword;
	ban_cd = Xwing.param.ban_cd;
	
	var authLevel = top.$DS_GRADEAUTH.getValue(top.$DS_GRADEAUTH.indexOfRow("CODEID",global("G_USER_GRADE")),"ETC1");
	if(authLevel == 1 || authLevel == 2){
		$cbo_gubun.setValue("ORG2");
	}else if(authLevel == 3){
		$cbo_gubun.setValue("ORG3");
	}else{
		$cbo_gubun.setValue("USER");
	}
	$lbl_ban_nm.setValue(ban_keyword);
	
	//엑셀다운권한정의
	excelDownAuth($btn_excel);
	
	
	getBanDeptRank();
	
}

function getBanDeptRank(){

	var new_user_id = "";
	var sql_search="";
	var sql_groupby="";
	new_user_id = parent.$chk_new_user.getValue()=="true"?"AND B.USER_ID IN (SELECT USER_ID FROM ms_usermaster WHERE WORK_MONTH <= (SELECT ETC1 FROM ms_codebook where code_type='SYS103' and code_id != 00))":"";
	
	var param	= {		
			_sqlName: "oba.oba040p1.getBanKeywordDeptRank.sel",
			ban_cd : ban_cd,
			new_user_id : new_user_id,
			sdate: parent.start,
			edate: parent.end,
			sql_groupby : sql_groupby,
			sql_search:sql_search
	};

	parent.g_orgToParam("", param);
	parent.g_productToParam("",param);
	var opt 	= {
			reqId: "getBanDeptRank",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);	
	
}

function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getBanDeptRank" :
			var org2_cd = "", org2_nm="", org2_nm="",org3_cd="", org3_nm="", user_id="", user_name="";
			$DS_USER_RANK.setData(res.DS_BAN_CNT.column, res.DS_BAN_CNT.record);
			for(var i =0; i<$DS_USER_RANK.size();i++){
				 org2_cd = $DS_USER_RANK.getValue(i, "ORG2_CD");
				 org2_nm = $DS_USER_RANK.getValue(i, "ORG2_NM");
				 org3_cd = $DS_USER_RANK.getValue(i, "ORG3_CD");
				 org3_nm = $DS_USER_RANK.getValue(i, "ORG3_NM");
				 user_id = $DS_USER_RANK.getValue(i, "USER_ID");
				 user_name = $DS_USER_RANK.getValue(i, "USER_NAME");
				 
				if(i== 0 || $DS_ORG3_RANK.indexOfRow("ORG3_CD" , org3_cd) == -1){
					$DS_ORG3_RANK.addRow();
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG2_CD", org2_cd);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG2_NM", org2_nm);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG3_CD", org3_cd);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG3_NM", org3_nm);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "BAN_CNT", $DS_USER_RANK.sum('BAN_CNT',"[ORG3_CD=='"+org3_cd+"']"));
				}
				if(i== 0 || $DS_ORG2_RANK.indexOfRow("ORG2_CD" , org2_cd) == -1){
					$DS_ORG2_RANK.addRow();
					$DS_ORG2_RANK.setValue($DS_ORG2_RANK.size()-1, "ORG2_CD", org2_cd);
					$DS_ORG2_RANK.setValue($DS_ORG2_RANK.size()-1, "ORG2_NM", org2_nm);
					$DS_ORG2_RANK.setValue($DS_ORG2_RANK.size()-1, "BAN_CNT", $DS_USER_RANK.sum('BAN_CNT',"[ORG2_CD=='"+org2_cd+"']"));

				}
			}
			$DS_ORG3_RANK.sort("BAN_CNT", "desc");
			$DS_ORG2_RANK.sort("BAN_CNT", "desc");

			for(var i =0 ; i< $DS_ORG3_RANK.size();i++){
				$DS_ORG3_RANK.setValue(i, "RANK", (i+1));
			}
			
			for(var i =0 ; i< $DS_ORG2_RANK.size();i++){
				$DS_ORG2_RANK.setValue(i, "RANK", (i+1));
			}
			$DS_ORG3_RANK.setCursor(0);
			$DS_ORG2_RANK.setCursor(0);
			$DS_USER_RANK.setCursor(0);
			
			$edt_listCnt.setValue($DS_ORG2_RANK.size());
		break;
		
	}
}


function cbo_gubun_change(event) {
	var gubun = $cbo_gubun.getValue();
	
	if(gubun == "ORG2"){
		$grd_ban_list2.setVisible(true);
		$grd_ban_list3.setVisible(false);
		$grd_ban_list4.setVisible(false);
		$edt_listCnt.setValue($DS_ORG2_RANK.size());
	}else if(gubun == "ORG3"){
		$grd_ban_list2.setVisible(false);
		$grd_ban_list3.setVisible(true);
		$grd_ban_list4.setVisible(false);
		$edt_listCnt.setValue($DS_ORG3_RANK.size());
	}else{
		$grd_ban_list2.setVisible(false);
		$grd_ban_list3.setVisible(false);
		$grd_ban_list4.setVisible(true);
		$edt_listCnt.setValue($DS_USER_RANK.size());
	}
}

function btn_excel_click(event) {
	var dsName = "";
	var grdName = "";
	var dataName="";
	var gubun = $cbo_gubun.getValue();
	$DS_ORG_EXCEL.clear();
	
	if(gubun == "ORG2") {
		dsName = "DS_ORG2_RANK";
		grdName = "grd_excel_list2";
		
	}else if(gubun == "ORG3") {
		dsName = "DS_ORG3_RANK";
		grdName = "grd_excel_list3";
	}else if(gubun == "USER"){
		dsName = "DS_USER_RANK";
		grdName = "grd_excel_list4";
	}
	
	$DS_ORG_EXCEL.copyFrom(dsName);
	$DS_ORG_EXCEL.addColumn("BAN_NM");
	for(var i=0, len=Xwing.getDataset(dsName).size();i<len;i++){
		$DS_ORG_EXCEL.setValue(i,'BAN_NM',$lbl_ban_nm.getValue());
	}
	dataName=$DS_GUBUN.getData("[CODEID=='"+gubun+"']");
	dataName=dataName[0];
	dataName=dataName[1];
	if($DS_ORG_EXCEL.size() > 0) {		
		Xwing.getDataGrid(grdName).exportData('금칙어순위_소속기준('+dataName+')', '../jsp/export2.jsp', true); 
		
	} else {
		xwing.Dialog.alert("출력할 데이터가 없습니다.");
	}
}/*]]>*/</script>
