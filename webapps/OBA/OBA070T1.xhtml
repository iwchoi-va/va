//필수멘트 누락항목 분석결과 조회
function f_searchRes(){

	 var param	= {
			 type : type,
			 sdate : sdate + stime,
			 edate : edate + etime,
			 ced_no : ced_no,
			 grade : grade,
			 new_user : new_user,
			 clicked_dept : selected_dept,
			 anl_yn : anl_yn,
			 DS_VSS140 : $DS_VSS140
	 }

	 parent.g_orgToParam("", param);
	 parent.g_productToParam("", param);


	var opt = {
			reqId: 'f_searchRes',
			url: v_url,
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);

}

//필수멘트 누락항목 상세정보
function f_searchDetailRes(){

	 var param	= {
			 type : "DETAIL",
			 sdate : sdate + stime,
			 edate : edate + etime,
			 ced_no : ced_no,
			 grade : grade,
			 new_user : new_user,
			 selected_user : selected_user,
			 anl_yn : anl_yn,
			 DS_VSS140 : $DS_VSS140
	 }

	 parent.g_orgToParam("", param);
	 parent.g_productToParam("", param);


	var opt = {
			reqId: 'f_searchDetailRes',
			url: v_url,
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);

}



/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "f_searchRes" :

			if(type == "DEPT1"){
				$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
				$edit_rowcnt.setValue($DS_RES.size());
			}else if(type == "DEPT2"){
				$DS_RES2.setData(res.DS_RES.column, res.DS_RES.record);
				$edit_rowcnt.setValue($DS_RES2.size());
			}else if(type == "DEPT3"){
				$DS_RES3.setData(res.DS_RES.column, res.DS_RES.record);
				$edit_rowcnt.setValue($DS_RES3.size());
			}

			f_makeGrid();

		break;
		case "f_searchDetailRes" :
			$DS_RES_DETAIL.setData(res.DS_RES.column, res.DS_RES.record);
			f_makeDetailGrid();
		break;

	}
}

function f_makeDetailGrid(){
	var columns = $DS_RES_DETAIL.getColumnInfo();

	var f_column = "<xwing:datagrid-colgroup>"
					+  "<xwing:datagrid-column width='110'></xwing:datagrid-column>"
					+  "<xwing:datagrid-column width='135'></xwing:datagrid-column>";

	for(var i =4; i< columns.length;i++){
		f_column += "<xwing:datagrid-column width='120'></xwing:datagrid-column>";
	}

	f_column += "</xwing:datagrid-colgroup>";

	var f_head = "<xwing:datagrid-head>"
	   	   + "<xwing:datagrid-row height='30'>"
	   	   + "<xwing:datagrid-cell text='설계번호'></xwing:datagrid-cell>"
	   	   + "<xwing:datagrid-cell text='설계일시'></xwing:datagrid-cell>";

	for(var i =0; i< $DS_VSS140.size();i++){
		f_head += "<xwing:datagrid-cell text='"+$DS_VSS140.getValue(i, "CODENAME")+"'></xwing:datagrid-cell>";
	}

	//alert($DS_VSS140.size());
	//alert(columns.length-2);

	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";


	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>";

	for(var i = 2; i< columns.length; i++){

		if(i==3) f_body += "<xwing:datagrid-cell bindcolumn='"+columns[i]+"' halign='center' mask='datetime'></xwing:datagrid-cell>";
		else f_body += "<xwing:datagrid-cell bindcolumn='"+columns[i]+"' halign='center'></xwing:datagrid-cell>";
	}

	f_body += "</xwing:datagrid-row>"
 	   +"</xwing:datagrid-body>";

	var f_context = f_column + f_head + f_body ;

	$grd_detail_list.addContent(f_context, true);
}


function f_makeGrid(){

	var f_column = "<xwing:datagrid-colgroup>"
		 + "<xwing:datagrid-column width='80'></xwing:datagrid-column>";

	if(type.charAt(type.length - 1) >= 1) f_column += "<xwing:datagrid-column width='120'></xwing:datagrid-column>";
	if(type.charAt(type.length - 1) >= 2) f_column += "<xwing:datagrid-column width='120'></xwing:datagrid-column>";
	if(type.charAt(type.length - 1) >= 3) f_column += "<xwing:datagrid-column width='120'></xwing:datagrid-column>";

	f_column +=  "<xwing:datagrid-column width='80'></xwing:datagrid-column>";

	for(var i =0; i< $DS_VSS140.size(); i++){
		f_column += "<xwing:datagrid-column width='150'></xwing:datagrid-column>";
	}

	f_column += "</xwing:datagrid-colgroup>";

	var f_head = "<xwing:datagrid-head>"
		   	   + "<xwing:datagrid-row height='30'>"
		   	   + "<xwing:datagrid-cell text='본부'></xwing:datagrid-cell>";

	if(type.charAt(type.length - 1) >= 1) f_head += "<xwing:datagrid-cell text='센터'></xwing:datagrid-cell>";
	if(type.charAt(type.length - 1) >= 2) f_head += "<xwing:datagrid-cell text='팀'></xwing:datagrid-cell>";
	if(type.charAt(type.length - 1) >= 3) f_head += "<xwing:datagrid-cell text='상담사'></xwing:datagrid-cell>";

	f_head += "<xwing:datagrid-cell text='설계건수'></xwing:datagrid-cell>";

	for(var i =0; i< $DS_VSS140.size(); i++){
		f_head += "<xwing:datagrid-cell text='"+$DS_VSS140.getValue(i, "CODENAME")+"'></xwing:datagrid-cell>";
		//f_head += "<xwing:datagrid-cell text='필수멘트누락항목"+(i+1)+"'></xwing:datagrid-cell>";
	}

	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";

	var f_body = "";
	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>";

	var col_cnt = "";

	if(type == "DEPT1"){
		col_cnt = $DS_RES.getColumnInfo();
		for(var i = 2; i< col_cnt.length; i++){
			if(i < 4) f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='center'></xwing:datagrid-cell>";
			else f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='right'></xwing:datagrid-cell>";
		}
	}else if(type == "DEPT2"){
		col_cnt = $DS_RES2.getColumnInfo();
		for(var i = 3; i< col_cnt.length; i++){
			if(i < 6) f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='center'></xwing:datagrid-cell>";
			else f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='right'></xwing:datagrid-cell>";
		}
	}else if(type == "DEPT3"){
		col_cnt = $DS_RES3.getColumnInfo();

		for(var i = 4; i< col_cnt.length; i++){
			if(i < 8) f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='center'></xwing:datagrid-cell>";
			else f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='right'></xwing:datagrid-cell>";
		}
	}

	f_body += "</xwing:datagrid-row>"
    	   +"</xwing:datagrid-body>";

	var f_context = f_column + f_head + f_body ;

	if(type == "DEPT1") $grd_dept1_list.addContent(f_context, true);
	else if(type == "DEPT2") $grd_dept2_list.addContent(f_context, true);
	else if(type == "DEPT3") $grd_dept3_list.addContent(f_context, true);

}

function grd_dept1_list_dblclick(event) {

	type = "DEPT2";

function grd_dept3_list_dblclick(event) {
