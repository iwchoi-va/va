/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {

	case 'f_codebook_sel' :
		$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
		$DS_VSS140.setData(res.VSS140.column, res.VSS140.record);
		$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);

		setTimeout(function(){
			btn_search_click();
		}, 500);

		break;

	}
}

function btn_search_click(event) {

	ced_no = $edt_ced_no.getValue();
	grade = $cmb_grade.getValue();
	new_user = $chk_new_user.getValue();
	anl_yn = $cmb_anl_stat.getValue();


	$lbl_sub1.setValue("센터별");
	type = "DEPT1";
	$pan_tab1.setUrl("./OBA070T1.xhtml");

	lbl_sub1_click();

}
