function reciever(param){
	init_search();
	setTimeout(function(){
		param = param.gubun == undefined? parent._parameter: param;
		var ced_no=param.ced_no != undefined? param.ced_no:'';
		var p_gubun = param.gubun != undefined? param.gubun:'';
		var user_id = param.user_id != undefined? param.user_id:'';
		var org1_cd = param.org1_cd != undefined? param.org1_cd:$cmb_org1.getValue();
		var org2_cd =param.org2_cd != undefined? param.org2_cd:'';
		var org3_cd =param.org3_cd != undefined? param.org3_cd:'';
		var sdate =param.sdate != undefined? param.sdate:'';
		var edate =param.edate != undefined? param.edate:'';
		var stime =param.stime != undefined? param.stime:'';
		var etime =param.etime != undefined? param.etime:'';

		if(p_gubun == 'A')$edt_ced_no.setValue(ced_no);
		if(p_gubun == 'C')g_setOrg(org1_cd,org2_cd);
		if(p_gubun == 'T')g_setOrg(org1_cd,org2_cd,org3_cd,user_id);
		if(sdate != "") $dpk_sdate.setValue(sdate);
		if(edate != "") $dpk_edate.setValue(edate)
		if(stime != "") $edt_stime.setValue(stime)
		if(edate != "") $edt_etime.setValue(etime);

		setTimeout(function(){btn_search_click();},400); //원래 코드유틸이었는데... 왜 때문이었지.
	},300);
}

//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "f_init_codebook_sel" :
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
			$ds_time.copyFrom($DS_RPT200);
			init_search();
		break;
		case "f_codebook_sel" :
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
			$ds_time.copyFrom($DS_RPT200);
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);
			$DS_SYS105.setData(res.SYS105.column, res.SYS105.record);
//			var help="※계피구분코드 :";
//			for(var i=0, len = $DS_SYS105.size(); i<len; i++){
//				help += ' '+$DS_SYS105.getValue(i,"CODEID")+":"+$DS_SYS105.getValue(i,"CODENAME");
//			}
//			$lbl_help.setValue(help);
//			$lbl_help.setWidth(50+$lbl_help.getValue().length*8);
//			$lbl_help.setLeft($lbl_help.getLeft()+80-$lbl_help.getWidth());
			if(!parent._load_val){
				setTimeout(function(){
					init_search();
					setTimeout(function(){btn_search_click();},500);
				},400);
			}
			break;

		case 'btn_search_click' :
			if($cmb_type.getValue() == 'D') {
				$DS_LIST1.setData(res.DS_LIST1.column, res.DS_LIST1.record);
			}else if($cmb_type.getValue() == 'S') {
				$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
			}else{
				$DS_LIST2.setData(res.DS_LIST2.column, res.DS_LIST2.record);
			}

			c_totalPage	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize);
			Xwing.getEdit("edit_rowcnt").setValue(res.DS_CNT_LIST.record[0]);
			detail_paging = false;
			setPaging();


			break;
		case 'getDetailRes' :
			$DS_DETAIL.setData(res.DS_LIST.column, res.DS_LIST.record);
			c_totalPage2	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize2);
			Xwing.getEdit("edit_rowcnt2").setValue(res.DS_CNT_LIST.record[0]);

			if($cmb_type.getValue() == 'D'){
				if($grd_org_list.getHeight()>$pnl_detail.getHeight()+20){
					$grd_org_list.setHeight($grd_org_list.getHeight()-$pnl_detail.getHeight()-20);
				}
			}else if($cmb_type.getValue() == 'P'){
				if($grd_prod_list.getHeight()>$pnl_detail.getHeight()+20){
					$grd_prod_list.setHeight($grd_prod_list.getHeight()-$pnl_detail.getHeight()-20);
				}
			}
			$edit_rowcnt2.setVisible(true);
			$btn_excel2.setVisible(true);
			$splitbar.setVisible(true);
			$lbl_subtitle2.setVisible(true);
			$grd_detail_list.setVisible(true);

			detail_paging = true;
			setPaging();


			break;

	}

}

function btn_excel_click(event){
	if($edit_rowcnt.getValue() > 8000){
		xwing.Dialog.alert("출력건수는 8,000건 이하만 가능합니다.");
		return;
	}else if($edit_rowcnt.getValue() == 0){
		xwing.Dialog.alert("출력할 데이터가 없습니다.");
		return;
	} 
	
	var dsName = "DS_EXCEL";
	var grdName = "";
	var dataName="";
	var type_gubun = $cmb_type.getValue();

	$DS_EXCEL.clearData();

	var sdate = "", edate = "", type = "";
	type = $cmb_type.getValue();

	//if (g_checkDate(sdate,edate)== false)	return;

	//parameters
	var v_sql = "oba.oba010.vrsScoreResult.cedno.all.sel";
	if(type == 'D') {
		v_sql = "oba.oba010.vrsScoreResult.org.all.sel";
	}else if(type == 'P') {
		v_sql = "oba.oba010.vrsScoreResult.product.all.sel";
	}

	var sdate = $dpk_sdate.getValue()+$edt_stime.getValue();
	var edate = $dpk_edate.getValue()+$edt_etime.getValue();
	var ced_no = $edt_ced_no.getValue();
	var grade = $cmb_grade.getValue();
	var new_user_id = $chk_new_user.getValue()=="true"?$chk_new_user.getValue():"";
	//var new_user_id = $chk_new_user.getValue()=="true"?"AND S.USER_ID IN (SELECT USER_ID FROM ms_usermaster WHERE WORK_MONTH <= (SELECT ETC1 FROM ms_codebook where code_type='SYS103' and code_id != 00))":"";

	var param	= {
			_sqlName: v_sql,
			SDATE:sdate,
			EDATE:edate,
			CED_NO:ced_no,
			GRADE:grade,
			NEW_USER_ID : new_user_id
	};

	g_orgToParam("", param);
	g_productToParam("",param);
	g_analStatToParam("",param);

	var opt 	= {
			reqId: "btn_search_click",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, function(sReqId, oRes, oErr, oXhr) {
		if(type_gubun == 'D') {
			$DS_EXCEL.setData(oRes.DS_LIST1.column, oRes.DS_LIST1.record);
		}else if(type_gubun == 'S') {
			$DS_EXCEL.setData(oRes.DS_LIST.column, oRes.DS_LIST.record);
		}else{
			$DS_EXCEL.setData(oRes.DS_LIST2.column, oRes.DS_LIST2.record);
		}
	
		if(type_gubun == 'S') {
			grdName = "grd_dgnno_list_excel";
	
		}else if(type_gubun == 'D') {
			grdName = "grd_org_list_excel";
		}else if(type_gubun == 'P'){
			grdName = "grd_prod_list_excel";
		}

		dataName=$DS_GUBUN.getData("[CODEID=='"+type_gubun+"']");
		dataName=dataName[0];
		dataName=dataName[1];
		
		Xwing.getDataGrid(grdName).setBinddataset(dsName);
		Xwing.getDataGrid(grdName).exportData('VRS준수결과('+dataName+')','../jsp/export2.jsp', true);
		Xwing.getDataGrid(grdName).setBinddataset('');
	});
}

function expr_excel_duration(cellObj,rowIdx) {
	var opt = {};
	var dsName="DS_EXCEL";

	var totalSeconds = eval("$"+dsName+".getValue(rowIdx,'RECODE_TIME')");
	//var score = $DS_RES.getValue(rowIdx, "SCORE");

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();
	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}

function setPaging(){

	if(!detail_paging){
		Xwing.getButton("btn_page_last").setEnabled(true);
		Xwing.getButton("btn_page_next").setEnabled(true);
		Xwing.getButton("btn_page_pre").setEnabled(true);
		Xwing.getButton("btn_page_first").setEnabled(true);

		if(c_totalPage > 0){
			$edt_curPage.setValue(c_page);
			$edt_totalPage.setValue(c_totalPage);
		}else{
			$edt_curPage.setValue("");
			$edt_totalPage.setValue("");
		}
		
		//페이징버튼세팅
		if( c_page == 1 || c_totalPage == 0 )
		{
			Xwing.getButton("btn_page_first").setEnabled(false);
			Xwing.getButton("btn_page_pre").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_first").setEnabled(true);
			Xwing.getButton("btn_page_pre").setEnabled(true);
		}

		if( c_page == c_totalPage || c_totalPage == 0 )
		{
			Xwing.getButton("btn_page_last").setEnabled(false);
			Xwing.getButton("btn_page_next").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_last").setEnabled(true);
			Xwing.getButton("btn_page_next").setEnabled(true);
		}
		if(c_totalPage > 1){
			$edt_curPage.setEnabled(true);
		}
	}else{
		Xwing.getButton("btn_page_last2").setEnabled(true);
		Xwing.getButton("btn_page_next2").setEnabled(true);
		Xwing.getButton("btn_page_pre2").setEnabled(true);
		Xwing.getButton("btn_page_first2").setEnabled(true);

		if(c_totalPage2 > 0){
			$edt_curPage2.setValue(c_page2);
			$edt_totalPage2.setValue(c_totalPage2);
		}else{
			$edt_curPage2.setValue("");
			$edt_totalPage2.setValue("");
		}
		
		//페이징버튼세팅
		if( c_page2 == 1 || c_totalPage2 == 0 )
		{
			Xwing.getButton("btn_page_first2").setEnabled(false);
			Xwing.getButton("btn_page_pre2").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_first2").setEnabled(true);
			Xwing.getButton("btn_page_pre2").setEnabled(true);
		}

		if( c_page2 == c_totalPage2 || c_totalPage2 == 0 )
		{
			Xwing.getButton("btn_page_last2").setEnabled(false);
			Xwing.getButton("btn_page_next2").setEnabled(false);
		}else{
			Xwing.getButton("btn_page_last2").setEnabled(true);
			Xwing.getButton("btn_page_next2").setEnabled(true);
		}
		if(c_totalPage2 > 1){
			$edt_curPage2.setEnabled(true);
		}
	}
}

	if(event.event.keyCode == '13') {

			return;

		c_start = (c_page-1)*c_pageSize;
		btn_search_click();
