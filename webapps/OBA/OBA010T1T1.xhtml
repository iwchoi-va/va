function getInsuPlan(){
	var opt = {
			reqId: "getInsuPlan",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t1t1.getInsuPlan.sel,oba.oba010t1t1.isMaskYn.sel,oba.oba010t1t1.getGradeInfo.sel,oba.oba010t1t1.getUserGrade.sel', 
				CED_NO : ced_no,
				USER_ID : parent.parent.user_id
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}


/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getInsuPlan": 
			$DS_INFO.setData(res.DS_LIST.column, res.DS_LIST.record);
			$DS_MASK.setData(res.DS_MASK.column, res.DS_MASK.record);
			$DS_GRADE_INFO.setData(res.DS_GRADE_INFO.column, res.DS_GRADE_INFO.record);
			$DS_USER_GRADE.setData(res.DS_USER_GRADE.column, res.DS_USER_GRADE.record);
			
			var opt = {qmYn : $DS_MASK.getValue(0,"QM_YN") 
					,usergroupcd : $DS_MASK.getValue(0,"USERGROUPCD") 
					,conPolNo :$DS_MASK.getValue(0,"CON_POL_NO")
					,gradeinfo : $DS_USER_GRADE.getValue(0,"USER_GRADE") 
					, grade : user_grade};
			
			//alert($DS_INFO.getValue(0,"CON_P_PSN_NO"));
			$conPPsnNo.setValue(setMask($DS_INFO.getValue(0,"CON_P_PSN_NO"),'j',opt)); //계약자 주민번호
			$conPAddr2.setValue(setMask($DS_INFO.getValue(0,"CON_P_ADDR_2"),'a',opt)); //계약자 주소2
			$conPHomeTel.setValue(setMask($DS_INFO.getValue(0,"CON_P_HOME_TEL"),'e',opt)); //계약자 자택번호
			$conPHp.setValue(setMask($DS_INFO.getValue(0,"CON_P_HP"),'p',opt)); //계약자 휴대번호
			$conPOffTel.setValue(setMask($DS_INFO.getValue(0,"CON_P_OFF_TEL"),'e',opt)); //계약자 직장번호
			$conPEtcTel.setValue(setMask($DS_INFO.getValue(0,"CON_P_ETC_TEL"),'e',opt)); //계약자 기타번호
			$conIpPsnNo.setValue(setMask($DS_INFO.getValue(0,"CON_IP_PSN_NO"),'j',opt)); //피보험자주민번호
			$conIpAddr2.setValue(setMask($DS_INFO.getValue(0,"CON_IP_ADDR_2"),'a',opt)); //피보험자주소2
			$conIpTel.setValue(setMask($DS_INFO.getValue(0,"CON_IP_TEL"),'e',opt)); //피보험자 자택번호
			$conIpHp.setValue(setMask($DS_INFO.getValue(0,"CON_IP_HP"),'p',opt)); //피보험자 휴대번호
			$conIpOffTel.setValue(setMask($DS_INFO.getValue(0,"CON_IP_OFF_TEL"),'e',opt)); //피보험자 직장번호
			$conIpEtcTel.setValue(setMask($DS_INFO.getValue(0,"CON_IP_ETC_TEL"),'e',opt)); //피보험자 기타번호
			$conFstOltBAcntNo.setValue(setMask($DS_INFO.getValue(0,"CON_FST_OLT_B_ACNT_NO"),'c',opt)); //초회카드번호
			$conConOltBAcntNo.setValue(setMask($DS_INFO.getValue(0,"CON_CON_OLT_B_ACNT_NO"),'c',opt)); //자동이체카드번호
			$conPEmail.setValue(setMask($DS_INFO.getValue(0,"CON_P_E_MAIL"),'m',opt)); // 계약자 이메일 주소
			$conIpEmail.setValue(setMask($DS_INFO.getValue(0,"CON_IP_EMAIL"),'m',opt)); // 피보험자 이메일 주소
			
			var bankBrhCd = $DS_INFO.getValue(0,"CON_FST_OLT_BANK_BRH_CD");
			var bankBrhCd1 = g_isEmpty(bankBrhCd) ? "" : bankBrhCd.substring(0,4);
			var bankBrhCd2 = g_isEmpty(bankBrhCd) ? "" : bankBrhCd.substring(4);
			$bankBrhCd1.setValue(bankBrhCd1);
			$bankBrhCd2.setValue(bankBrhCd2);
			
			var bankOltCd = $DS_INFO.getValue(0,"CON_CON_OLT_BANK_BRH_CD");
			var bankOltCd1 = g_isEmpty(bankOltCd) ? "" : bankOltCd.substring(0,4);
			var bankOltCd2 = g_isEmpty(bankOltCd) ? "" : bankOltCd.substring(4);
			$bankOltCd1.setValue(bankOltCd1);
			$bankOltCd2.setValue(bankOltCd2);
			
			//만나이 CON_APP_DATE 
			$insurAge.setValue(f_getInsurAge(1,$DS_INFO.getValue(0,"CON_APP_DATE") ,$DS_INFO.getValue(0,"CON_P_PSN_NO")));
			//console.log($DS_INFO);
			//console.log($DS_MASK);
		//	console.log(user_grade);
			//$edt_user_id.setValue("11111");
			
			var totalSeconds = $DS_GRADE_INFO.getValue(0,'DURATION');
			
			totalSeconds = Math.floor(totalSeconds / 100);
			var h = (Math.floor(totalSeconds / 3600)).toString();
			totalSeconds %= 3600;
			var m = (Math.floor(totalSeconds / 60)).toString();
			var s = (Math.floor(totalSeconds % 60)).toString();
			opt = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
			$DS_GRADE_INFO.setValue(0,"DURATION",opt);
			
			$DS_GRADE_INFO.setValue("CALL_CNT","대상콜: "+$DS_GRADE_INFO.getValue(0,"CALL_CNT")+" / 총콜수: "+parent.parent.$DS_UCID.size()+"");
			$DS_GRADE_INFO.setValue("DURATION",""+$DS_GRADE_INFO.getValue(0,"DURATION")+" / "+parent.parent.$DS_DURA.getValue(0,"SUM_DURA"));
			
			if($DS_GRADE_INFO.getValue(0,"GRD_FLAG") == "E"){
				var value = $lbl_help.getValue();
				$lbl_help.setValue(value+" (사유:"+$DS_GRADE_INFO.getValue(0,"REASON")+")");
				$lbl_help.setVisible(true);
			}else{ $lbl_help.setVisible(false)};
			
			$conPAddr1.setTooltiptext($conPAddr1.getValue());
			$conPAddr2.setTooltiptext($conPAddr2.getValue());
			
			$conIpAddr1.setTooltiptext($conIpAddr1.getValue());
			$conIpAddr2.setTooltiptext($conIpAddr2.getValue());
			
			break;
		default: break;	
	}
}

	var url = getWebServiceURL();

	window.open(url+data, "_blank", "width=724, height=780, left=100, top=10, location=no,resizable=no, scrollbars=no");

function getWebServiceURL(){
	
	var hostname = window.location.hostname.split(".");
	
	var url ="";
	if(hostname[0] == "vadev"){
		url = "http://corecmdev.aig.co.kr/jsp/connect_channel.jsp";
	}else if(hostname[0] == "vauat"){
		url = "http://corecmuat.aig.co.kr/jsp/connect_channel.jsp";
	}else if(hostname[0] == "va"){
		url = "http://corecm.aig.co.kr/jsp/connect_channel.jsp";
	}else{//로컬도 개발url로.
		//url = "http://corecmdev.aig.co.kr/jsp/connect_channel.jsp";
		url = "http://corecmuat.aig.co.kr/jsp/connect_channel.jsp";
	}
	
	return url;
}
