function page_load(event) {
	XwingObject();
	
	tm_no = parent.tm_no;
	con_ent_dgn_no =  parent.ced_no;
	
	// 테스트용 
	//con_ent_dgn_no = "941906050368";

	// aigen 코드북내에서 동의구분 콤보 정보 조회
	f_aigen_codebook_sel();
}

function f_codebook_sel() { 

	var param = {
		cmd : "getCodes",
		codeType : "SYS020",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}


function f_aigen_codebook_sel(){
	var opt = {
			reqId: "f_aigen_codebook_sel",
			url: v_url,
			param: {
				_sqlName  : 'msens.est.hansol.getTMCodes.sel', 
				CODETYPE : "CRS110"
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}

function f_schChangeContract(){
	
	var url = getWebServiceIFURL();	
	var serviceName ="LTTMINFR0079";
	
	var reqJson = '{"planNumber":"'+con_ent_dgn_no+'","jobCls":"srhChangeContract"}';
	
	var opt = {
			reqId: "getChangeContract",
			url: "service::oba.oba010t1t9.getChangeContract.sel.do",
			param: {
				serviceUrl: url,
				serviceName : serviceName ,
				serviceResult : "comparedTwistingPolicyList",
				reqJson :reqJson,
				DS_RES : $DS_RES
				
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
	
}

//승환계약 체크 조회
function f_schDupAgree(){
	var opt = {
			reqId: "getAgreeDupInfo",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t1t9.getAgreeDupInfo.sel,oba.oba010t1t9.getInsuplanmast.sel',
				TM_NO : tm_no
				
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}

//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "f_codebook_sel" :
			$DS_SYS020.setData(res.SYS020.column, res.SYS020.record);
		
		break;
		
		case "f_aigen_codebook_sel" :
			$DS_AGREE_GB.setData(res.DS_TM_CODE.column, res.DS_TM_CODE.record);
			
			//승환계약조회
			f_schChangeContract();
			//승환체크조회
			f_schDupAgree();
		break;
		
		case "getChangeContract" :
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			
			$DS_NEW_CONTRACT.setData($DS_RES.getColumnInfo(), $DS_RES.getData("[dsgnYn=='Y']"));
			$DS_BEF_CONTRACT.setData($DS_RES.getColumnInfo(), $DS_RES.getData("[dsgnYn=='N']"));
		
		break;
		
		case "getAgreeDupInfo" :
			$DS_AGREE_INFO.setData(res.DS_AGREE_INFO.column, res.DS_AGREE_INFO.record);
			$DS_DUP_YN.setData(res.DS_DUP_YN.column, res.DS_DUP_YN.record);
			
		break;
		

	}

}

function getWebServiceIFURL(){
	var hostname = window.location.hostname.split(".");
	var url ="";
	var server_gb = "";
	
	server_gb = hostname[0];
	
	if(hostname[0] == "127") server_gb = "vauat"; // 로컬에서 개발시, uat 서버 붙어서 작업할 수 있도록
	
	url = $DS_SYS020.getValue($DS_SYS020.indexOfRow("ETC4", server_gb),"ETC3");
	
	url += "tmMciService.do";
	
	return url;
}

function getWebServiceCoreURL(){
	var hostname = window.location.hostname.split(".");
	var url ="";
	
	server_gb = hostname[0];
	
	if(hostname[0] == "127") server_gb = "vauat"; // 로컬에서 개발시, uat 서버 붙어서 작업할 수 있도록
	
	url = $DS_SYS020.getValue($DS_SYS020.indexOfRow("ETC4", server_gb),"ETC5");
	
	url += "jsp/connect_channel.jsp";
	
	return url;
}


function btn_chngCont_click(event) {
	var url = getWebServiceCoreURL();
	
	var con_ent_dgn_no = $DS_DUP_YN.getValue(0,"CON_ENT_DGN_NO");
	
	var param		= 'channelCls:TM|planNo:' + con_ent_dgn_no;
	
	var data =   '?groupId=AG.QT'
	+'&menuId=AGQTP087'
	+'&menunm='+encodeURI("승환비교")
	+'&delimiter='+'|'
	+'&param='+encodeURI(param)
	+'&paramDst='+''
	+'&callback='+'fn_dupCallback'
	+'&iWidth='+'1262'
	+'&iHeight='+'800';
	
	window.open(url+data, "_blank", "width=1262, height=800, left=100, top=10, location=no,resizable=no, scrollbars=no");

}

function expr_intRate(cellObj,rowIdx) {
	var opt = {};

function expr_pymtCnt(cellObj,rowIdx) {

function expr_joinAge(cellObj,rowIdx) {

function expr_maskPsnNo(cellObj,rowIdx) {
	var opt = {};
