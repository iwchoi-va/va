function page_load(event) {
		XwingObject();
		
		var query = location.search.substring(1);
		
		var parameters = {};
		var keyValues = query.split(/&/);
		for (var prop in keyValues) {
		    var keyValuePairs = keyValues[prop].split(/=/);
		    var key = keyValuePairs[0];
		    var value = keyValuePairs[1];
		    parameters[key] = value;
		}
		
		//하위탭에서 사용하는 전역변수들
		self_popup= g_isEmpty(parameters['self_popup'])? false:parameters['self_popup'];
		ced_no= g_isEmpty(parameters['ced_no'])? parent.ced_no:parameters['ced_no'];
		user_id	= g_isEmpty(parameters['user_id'])? parent.user_id:parameters['user_id'];
		
		//QC 평가표 VISIBLE 여부		
		if(!self_popup){
			$tmpDs.setData(parent.$DS_GROUPAUTH.getColumnInfo(),parent.$DS_GROUPAUTH.getData('[ETC4 == "Y"]'));
			for ( var i = 0 ; i < $tmpDs.size(); i++) {
				if($tmpDs.getValue(i, "CODEID") != ""){
					estimateAuth.push($tmpDs.getValue(i, "CODEID"));
				}
			}
			estimateAuth=estimateAuth.toString();
			if(estimateAuth.indexOf(parent.user_group_cd) > -1){
				$btn_estimate.setVisible(true);
			}else{
				$btn_estimate.setVisible(false);
			}
		}else{
			$btn_popup.setVisible(false);
			estimateAuth = parameters['estimateAuth'];
			if(estimateAuth.indexOf(parameters['user_group_cd']) > -1){
				$btn_estimate.setVisible(true);
			}else{
				$btn_estimate.setVisible(false);
			}
		}
		
		getInfo();
		lbl_tab1_click();
		//엑셀다운권한정의
		excelDownAuth($btn_excel,false,false);
}

function getInfo(){
	var opt = {
			reqId: "getInfo",
			url: v_url,
			param: {
				_sqlName  : 'oba.oba010t1.getInfo.sel', 
				CED_NO : ced_no
			},
			indicator: null,
			showError: true
	};
	
	Xwing.request(opt, callback);
}

//---엑셀버튼클릭
function btn_excel_click(event){
	
	$DS_EXCEL.clear();
	$DS_EXCEL.copyFrom($DS_INFO);
	
	for(var i =0 ; i<$DS_DMBO.size(); i++){
		$DS_EXCEL.setValue(i,'DMBO_NM',$DS_DMBO.getValue(i,'DMBO_NM'));
		$DS_EXCEL.setValue(i,'DMBO_GB',$DS_DMBO.getValue(i,'DMBO_GB'));
		$DS_EXCEL.setValue(i,'INSUR_AMT',$DS_DMBO.getValue(i,'INSUR_AMT'));
		$DS_EXCEL.setValue(i,'BASIC_PREM',$DS_DMBO.getValue(i,'BASIC_PREM'));
		$DS_EXCEL.addRow();
	}
	
	if(Xwing.getDataset('DS_EXCEL').size() > 0) {
		Xwing.getDataGrid('grd_excel').exportData('가입설계번호_상세정보', '../jsp/export2.jsp', true); 
	} else {
		xwing.Dialog.alert("출력할 데이터가 없습니다.");
	}
	
}


/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getInfo":
			$DS_INFO.setData(res.DS_LIST.column, res.DS_LIST.record);
			
			tm_no = $DS_INFO.getValue(0,"TM_NO");
			
		/*	
			if($DS_INFO.getValue(0,"RE_ANL_YN") == "TRUE"){

			}
			
			//expr duration
			var opt="",opt2="";
			dsName="DS_INFO";
			var totalSeconds = $DS_INFO.getValue(0,'DURATION');
			//var score = $DS_RES.getValue(rowIdx, "SCORE");
			
			totalSeconds = Math.floor(totalSeconds / 100);
			var h = (Math.floor(totalSeconds / 3600)).toString();
			totalSeconds %= 3600;
			var m = (Math.floor(totalSeconds / 60)).toString();
			var s = (Math.floor(totalSeconds % 60)).toString();
			opt = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
			$DS_INFO.setValue(0,"DURATION",opt);*/
			
			
			//피보험자 나이
			//$DS_INFO.setValue(0,"P_AGE",f_getInsurAge(2,$DS_INFO.getValue(0,"CON_ENT_DGN_DATE"),$DS_INFO.getValue(0,"P_ISD_CD")));
			//담보
			var dmbo_no = $DS_INFO.getValue(0, "DMBO_NM").split("&");
			var insur_amt = $DS_INFO.getValue(0, "INSUR_AMT").split("&");
			var dmbo_gb = $DS_INFO.getValue(0, "DMBO_GB").split("&");
			var basic_prem = $DS_INFO.getValue(0, "BASIC_PREM").split("&");
			for(var i = 0, len = dmbo_no.length; i<len; i++){
				$DS_DMBO.addRow();
				$DS_DMBO.setValue(i,"DMBO_NM",dmbo_no[i]);
				$DS_DMBO.setValue(i,"DMBO_GB",dmbo_gb[i]);

			break;
		default: break;	
	}

function lbl_tab_action(lbl,page){
	for(var i = 1; i<10;i++){
		if('lbl_tab'+i != lbl){
			Xwing.getLabel('lbl_tab'+i).setFontweight('normal');
			Xwing.getLabel('lbl_tab'+i).setBgcolor('');
			Xwing.getLabel('lbl_tab'+i).setFontcolor('');
		}else{
			Xwing.getLabel(lbl).setFontweight('bold');
			Xwing.getLabel(lbl).setBgcolor('#58728d');
			Xwing.getLabel(lbl).setFontcolor('#fff');
		}
	}
	
	if(lbl == "lbl_tab8" || lbl == "lbl_tab2"){//팝업 URL 연동시 빈페이지 안뜨게.  
		$pan_tab_content2.setUrl(page);	
	}else	$pan_tab_content.setUrl(page);	
}
