<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var gubun="",sdate="",edate="";
var stime='000000',etime='235959';
var keyword='';
var v_url = "service::oba.oba040.getBankeywordRank.sel.do";

var TOP_DEFAULT = 10;    //기본으로 보여줄 탑키워드 추이 갯수
var num = 0;            //추이 호출시, 증가변수
var idx = 0;
var start="", end="";
var new_user_id = "";
/* ***********************************************************
 * 	화면 로드 함수
 *************************************************************/
function page_load(event) {
	XwingObject();

	init();

	page_resize();

}

function page_resize(){

	$btn_apply.setLeft(($grd_top_keyword.getWidth())/2 - 50);
}

function init(){
	g_createDate("pnl_date","Y","Y","Y", "설계일시","Y"); //기간 샛성
	g_createOrg("pan_dept", 3, "Y", "Y", "Y", "", "전체", false, true);
	g_createproduct("pnl_product", 2, "", "", "전체", "N");

	//권한정의
	setTimeout(function(){
		authLevel = top.$DS_GRADEAUTH.getValue(top.$DS_GRADEAUTH.indexOfRow("CODEID",global("G_USER_GRADE")),"ETC1");
		authExcept = top.$DS_GRADEAUTH.getValue(top.$DS_GRADEAUTH.indexOfRow("CODEID",global("G_USER_GRADE")),"ETC2");
		g_setAuthObj(authLevel, authExcept, global("G_ORG1_CD"),global("G_ORG2_CD"),global("G_ORG3_CD"),global("G_USER_ID"));
	});

	//temp
	$cmb_gubun.setValue('D');
	_gubun_change();
	
	$sdate.setValue(g_addDate("m", -1, g_toDate(), ""));
	$edate.setValue(g_toDate());

	setTimeout(function(){btn_search_click();},700);
}

function btn_search_click(){
	if(getSrcParam()) getTopList();
}

/* ***********************************************************
 * 	조회 조건 파라미터 셋팅함수(기간구분되는 콤보박스사용)
 *************************************************************/
function getSrcParam(){
	if(g_dateToParam()){
		gubun = g_dateToParam().gubun;
		sdate = g_dateToParam().sdate;
		edate = g_dateToParam().edate;
		if(gubun == 'H') { stime=g_dateToParam().stime+'0000';  etime=g_dateToParam().etime+'5959'; }
		start = gubun=="H"?sdate+stime:sdate;
		end = gubun=="H"?edate+etime:edate;
		return true;
	}
}

function getTopList(){
	$DS_SERIES.clearData();
	$DS_DATE_CNT.clearData();
	$DS_TOP_LIST.clearData();
	TOP_DEFAULT = 10;
	num = 0;
	idx = 0;


	var param = {};
	var sqlName="oba.oba040.getBannedKeywordRank.sel";
	var new_user_id = $chk_new_user.getValue()=="true"? $chk_new_user.getValue():"";


	param= {
			_sqlName: sqlName,
			new_user_id : new_user_id,
			SDATE: start,
			EDATE: end
	};

	g_orgToParam("", param);
	g_productToParam("",param);

	var opt 	= {
			reqId: "getTopList",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}

function getDaily(){
	$DS_SERIES.clearData();
	$DS_CHK_BAN.clearData();
	$DS_DATE_CNT.clearData();

	$DS_TOT_COUNT.clearData();
	$DS_BAN_RATE.clearData();

	num = 0;	//체크한 개수

	TOP_DEFAULT = Xwing.getDataGrid("grd_top_keyword").getCheckedCnt();
	var a_chk = Xwing.getDataGrid("grd_top_keyword").getCheckedIdx();
	for(var i=0; i< Xwing.getDataGrid("grd_top_keyword").getCheckedCnt(); i++){
		$DS_SERIES.addRow();
		$DS_CHK_BAN.addRow();
		$DS_SERIES.setValue( i, 'SERIES', $DS_TOP_LIST.getValue(a_chk[i], "BAN_KEYWORD") );
		$DS_CHK_BAN.setValue(i, 'BAN_CD', $DS_TOP_LIST.getValue(a_chk[i], "BAN_CD") );
		$DS_CHK_BAN.setValue(i, 'BAN_KEYWORD', $DS_TOP_LIST.getValue(a_chk[i], "BAN_KEYWORD") );
		$DS_CHK_BAN.setValue(i, 'BAN_CNT', $DS_TOP_LIST.getValue(a_chk[i], "BAN_CNT") );
	}

	getDailyTop(num++);
}
function getDailyTop(num){
	
	var a_chk = Xwing.getDataGrid("grd_top_keyword").getCheckedIdx();
	var v_sql = "oba.oba040.getDailyBanKeyword.sel";
	var new_user_id = $chk_new_user.getValue()=="true"?"true":"";

	var param	= {
			_sqlName: v_sql,
			BAN_CD : $DS_TOP_LIST.getValue(a_chk[num], "BAN_CD"),
			new_user_id : new_user_id,
			SDATE: start,
			EDATE: end,
			dateLen : gubun
	};

	g_orgToParam("", param);
	g_productToParam("",param);

	var opt 	= {
			reqId: "getDailyTop",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);
}

function getBanProgress(){
	var a_chk = Xwing.getDataGrid("grd_top_keyword").getCheckedIdx();
	var ban_cd = "";

	for(var i =0; i< a_chk.length; i++){
		ban_cd += $DS_TOP_LIST.getValue(a_chk[i], "BAN_CD") + ",";
	}

	var new_user_id = $chk_new_user.getValue()=="true"?$chk_new_user.getValue():"";
	var param	= {
			_sqlName: "oba.oba040.getAllCallCount.sel",
			BAN_CD : ban_cd.slice(0,-1),
			new_user_id : new_user_id,
			SDATE: start,
			EDATE: end
	};

	g_orgToParam("", param);
	g_productToParam("",param);

	var opt 	= {
			reqId: "getBanProgress",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}


function btn_apply_click(event) {
	var n_cnt = Xwing.getDataGrid("grd_top_keyword").getCheckedCnt();
	if(n_cnt == 0) new xwing.Dialog.alert("선택된 키워드가 없습니다.");
	else getDaily();
}



function grd_top_keyword_click(event) {


	var nCell = event.cell._getColIndex();
	var ban_keyword = $DS_TOP_LIST.getValue(event.rowIdx, "BAN_KEYWORD");
	var ban_cd = $DS_TOP_LIST.getValue(event.rowIdx, "BAN_CD");

	if(nCell == 3){
		var opt = {
				modal: false,
				resizable: true,
				id : 'OBA040P1',
				url : '../OBA/OBA040P1.xhtml',
				width : 565,
				height : 525,
				title : "소속별 금칙어랭킹",
				draggable:true,
				param:{
					ban_keyword : ban_keyword,
					ban_cd : ban_cd
				}
			};

		var dialog = new xwing.Dialog(opt);
		dialog.open();
	}
}
/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "getTopList" :
			$DS_TOP_LIST.setData(res.DS_BAN_KEYWORDS.column, res.DS_BAN_KEYWORDS.record);
			for(var j=0; j<TOP_DEFAULT; j++) Xwing.getDataGrid('grd_top_keyword').setChecking(j);
			getDaily();
		break;


		case "getDailyTop":
			
			$DS_RES.setData(res.DS_BAN_DAILY.column, res.DS_BAN_DAILY.record);
			
			var start = gubun=="H"?sdate+stime:sdate;
			var end = gubun=="H"?edate+etime:edate;

		if(gubun != "W"){
			 
			if( setDate('DS_RES', gubun, start, end) ) {
				$DS_RES.sort('DATE');
				$DS_DATE_CNT.appendDataset('DS_RES');
				
				//console.log($DS_RES);
			}
		}else{
			setDate('DS_RES', gubun,start, end);
			 var tmp_obj = Xwing.createDataset('DS_TMP');
			 tmp_obj.setColumnInfo($DS_RES.getColumnInfo());
			 var date = "", week = "", date_nm=[];

			 for(var i = 0, len=$DS_RES.size(); i< len; i++){
				 var tmp_nm = $DS_RES.getValue(i,"DATE_NM");
				 if(date_nm.indexOf(tmp_nm) == -1) date_nm.push(tmp_nm);
			 }


			 var keyword = $DS_RES.getValue(0,"BAN_KEYWORD");
			 var ban_cd = $DS_RES.getValue(0,"BAN_CD");

			 //현재 존재하는 데이터들로 통계 데이터 합산하여 계산.
			 for(var i =0, len = date_nm.length; i<len ; i++){

				 tmp_obj.addRow();
				 tmp_obj.setValue(tmp_obj.size()-1,"DATE",date_nm[i]); //일부로 DATE컬럼에 넣음. 나중에 차트그리기위해.
				 tmp_obj.setValue(tmp_obj.size()-1,"DATE_NM",date_nm[i]);
				 tmp_obj.setValue(tmp_obj.size()-1,"BAN_KEYWORD",keyword);
				 tmp_obj.setValue(tmp_obj.size()-1,"BAN_CD",ban_cd);
				 tmp_obj.setValue(tmp_obj.size()-1,"BAN_CNT",$DS_RES.sum("BAN_CNT","[DATE_NM == '"+date_nm[i]+"']"));
			}
			 
			 noDataWeekInsert(tmp_obj,$DS_RES);
			 $DS_RES.sort('SORT_KEY');
			$DS_DATE_CNT.appendDataset('DS_RES');
		}

			if(num < TOP_DEFAULT) {
				getDailyTop(num++);
			} else {
				$pan_multi_line.setUrl("../chart/multi-line-OBA040.html"); //데이터 다 담은 후 차트 생성

				//var a_chk = Xwing.getDataGrid("grd_top_keyword").getCheckedIdx();

				getBanProgress();
			}


		break;

		case "getBanProgress":
			$DS_TOT_COUNT.setData(res.DS_ALL_CNT.column, res.DS_ALL_CNT.record);

			for(var i =0; i< $DS_CHK_BAN.size();i++){ //체크한 애들 개수

				$DS_BAN_RATE.addRow();
				$DS_BAN_RATE.setValue($DS_BAN_RATE.size()-1, "BAN_CD", $DS_CHK_BAN.getValue(i,"BAN_CD"));
				$DS_BAN_RATE.setValue($DS_BAN_RATE.size()-1, "BAN_KEYWORD", $DS_CHK_BAN.getValue(i,"BAN_KEYWORD"));

				var rate =  (parseInt($DS_CHK_BAN.getValue(i,"BAN_CNT"))/parseInt($DS_TOT_COUNT.getValue(0,"TOT_CNT")))*100;
				$DS_BAN_RATE.setValue($DS_BAN_RATE.size()-1, "RATE",rate.toFixed(2));
			}

			$pan_bar_horizon.setUrl('../chart/bar-horizon-OBA040.html');

			break;
	}
}

/*]]>*/</script>
