function init_search(){

		$edt_stime.setValue($ds_time.getValue($ds_time.indexOfRow('CODEID',$DS_SYS101.getValue(0,'ETC3')), 'ETC1') + '00');
		$edt_etime.setValue($ds_time.getValue($ds_time.indexOfRow('CODEID',$DS_SYS101.getValue(0,'ETC4')), 'ETC2') + '59');
		$edt_ced_no.setValue("");
		/*var authLevel = top.$DS_GRADEAUTH.getValue(top.$DS_GRADEAUTH.indexOfRow("CODEID",global("G_USER_GRADE")),"ETC1");

	}
	$cmb_grade.setValue('');
	$cmb_anl_stat.setValue('');
	$cmb_istp_cd.setValue('');
	$cmb_prod_cd.setValue('');
	$chk_new_user.setValue(false);
}

function reciever(param){
	init_search();
	setTimeout(function(){
		param = param.gubun == undefined? parent._parameter: param;
		var ced_no=param.ced_no != undefined? param.ced_no:'';
		var p_gubun = param.gubun != undefined? param.gubun:'';
		var user_id = param.user_id != undefined? param.user_id:'';
		var org1_cd = param.org1_cd != undefined? param.org1_cd:$cmb_org1.getValue();
		var org2_cd =param.org2_cd != undefined? param.org2_cd:'';
		var org3_cd =param.org3_cd != undefined? param.org3_cd:'';
		var sdate =param.sdate != undefined? param.sdate:'';
		var edate =param.edate != undefined? param.edate:'';
		var stime =param.stime != undefined? param.stime:'';
		var etime =param.etime != undefined? param.etime:'';
		if(p_gubun == 'A')$edt_ced_no.setValue(ced_no);
		if(p_gubun == 'C')g_setOrg(org1_cd,org2_cd);
		if(p_gubun == 'T')g_setOrg(org1_cd,org2_cd,org3_cd,user_id);
		if(sdate != "") $dpk_sdate.setValue(sdate);
		if(edate != "") $dpk_edate.setValue(edate)
		if(stime != "") $edt_stime.setValue(stime)
		if(edate != "") $edt_etime.setValue(etime);

		setTimeout(function(){btn_search_click();},500);
	},300);
}

function btn_search_click(event) {
	if(checkDate($dpk_sdate,$dpk_edate,$edt_stime,$edt_etime)) return;
	if(event != undefined){
		c_page = 1;
		c_start = 0;
	}
	
	$DS_GRADE_RES.clearData();
	var v_sql = "oba.oba060.getGradeResult.cnt.sel,oba.oba060.getGradeResult.sel";

	var sdate = $dpk_sdate.getValue()+$edt_stime.getValue();
	var edate = $dpk_edate.getValue()+$edt_etime.getValue();
	var ced_no = $edt_ced_no.getValue();
	var grade = $cmb_grade.getValue();
	//var new_user_id = $chk_new_user.getValue()=="true"?"AND A.USER_ID IN (SELECT USER_ID FROM ms_usermaster WHERE WORK_MONTH <= (SELECT ETC1 FROM ms_codebook where code_type='SYS103' and code_id != 00))":"";
	var new_user_id = $chk_new_user.getValue()=="true"?"true":"";

	var param	= {
			_sqlName: v_sql,
			SDATE:sdate,
			EDATE:edate,
			CED_NO:ced_no,
			GRADE:grade,
			NEW_USER_ID : new_user_id
			, _START : c_start
			, _PAGESIZE : c_pageSize
	};

	g_orgToParam("", param);
	g_productToParam("",param);
	g_analStatToParam("",param);

	var opt 	= {
			reqId: "btn_search_click",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);
}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "f_codebook_sel":
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
			$ds_time.copyFrom($DS_RPT200);
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);
			$DS_VSS170.setData(res.VSS170.column, res.VSS170.record);
			getGradeinfo();
			if(!parent._load_val){
				setTimeout(function(){
					init_search();
					setTimeout(function(){btn_search_click();},400);
				},400);
			}

		break;
		case "getGradeinfo":
			$DS_WEIGHT.setData(res.DS_RES_WEIGHT.column, res.DS_RES_WEIGHT.record);
			var help="※Grade가중치:";
			for(var i=0, len = $DS_WEIGHT.size(); i<len; i++){
				help += ' '+$DS_WEIGHT.getValue(i,"CODE_NM")+":"+$DS_WEIGHT.getValue(i,"WEIGHT");
			}
			$lbl_help.setValue(help);
			$lbl_help.setWidth(50+$lbl_help.getValue().length*7);
			//$lbl_help.setLeft($lbl_help.getLeft()+70-$lbl_help.getWidth());
			//btn_search_click();
			break;
		case 'btn_search_click' :
			$DS_GRADE_RES.setData(res.DS_LIST.column, res.DS_LIST.record);
			c_totalPage	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize);
			Xwing.getEdit("edit_rowcnt").setValue(res.DS_CNT_LIST.record[0]);
			setPaging();

			f_makeGrid();
			break;
	}
}

function expr_dateTime(cellObj,rowIdx) {
	var opt = {};
	var dsName="";


	dsName = "DS_GRADE_RES";

	var datetime = eval("$"+dsName+".getValue(rowIdx,'CED_DATE')");
	var yyyy = datetime.substr(0,4);
	var MM = datetime.substr(4,2);
	var dd = datetime.substr(6,2);
	var hh =datetime.substr(8,2);
	var mm =datetime.substr(10,2);
	var ss =datetime.substr(12,2);

	opt=yyyy+"-"+MM+"-"+dd+" "+hh+":"+mm+":"+ss;
	//var score = $DS_RES.getValue(rowIdx, "SCORE");
	return opt;
}

/*****************************************************
*페이징 처리
******************************************************/
function setPaging(){
	Xwing.getButton("btn_page_last").setEnabled(true);
	Xwing.getButton("btn_page_next").setEnabled(true);
	Xwing.getButton("btn_page_pre").setEnabled(true);
	Xwing.getButton("btn_page_first").setEnabled(true);

	/*Xwing.getDataset("DS_PAGE_CNT").clearData();
	for( var j=1; j<=c_totalPage; j++){
		Xwing.getDataset("DS_PAGE_CNT").addRow();
		Xwing.getDataset("DS_PAGE_CNT").setValue("TOTAL_PAGE", j+"/"+c_totalPage);
		Xwing.getDataset("DS_PAGE_CNT").setValue("PAGE", j);
	}

	Xwing.getCombo("cmb_page").setValue(c_page);*/
	if(c_totalPage > 0){
		$edt_curPage.setValue(c_page);
		$edt_totalPage.setValue(c_totalPage);
	}else{
		$edt_curPage.setValue("");
		$edt_totalPage.setValue("");
	}
	
	
	//페이징버튼세팅
	if( c_page == 1 || c_totalPage == 0 )
	{
		Xwing.getButton("btn_page_first").setEnabled(false);
		Xwing.getButton("btn_page_pre").setEnabled(false);
	}else{
		Xwing.getButton("btn_page_first").setEnabled(true);
		Xwing.getButton("btn_page_pre").setEnabled(true);
	}

	if( c_page == c_totalPage || c_totalPage == 0 )
	{
		Xwing.getButton("btn_page_last").setEnabled(false);
		Xwing.getButton("btn_page_next").setEnabled(false);
	}else{
		Xwing.getButton("btn_page_last").setEnabled(true);
		Xwing.getButton("btn_page_next").setEnabled(true);
	}

	if(c_totalPage > 1){
		$edt_curPage.setEnabled(true);
	}
}

function btn_page_first_click(event) {
	c_page = 1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_pre_click(event) {
	c_page = c_page-1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_next_click(event) {
	c_page = c_page+1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_last_click(event) {
	c_page = c_totalPage;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}
function edt_curPage_keydown(event) {
	
	
	if(event.event.keyCode == '13') {
		if(parseInt($edt_curPage.getValue()) > c_totalPage){
			xwing.Dialog.alert("전체 페이지 수를 초과합니다.");
			$edt_curPage.setValue(c_page);
			return;
		}
		if(parseInt($edt_curPage.getValue()) < 1){
			xwing.Dialog.alert("0보다 큰 숫자를 입력해주세요.");
			$edt_curPage.setValue(c_page);
			return;
		}
		c_page = parseInt($edt_curPage.getValue());
		c_start = (c_page-1)*c_pageSize;
		btn_search_click();
}
