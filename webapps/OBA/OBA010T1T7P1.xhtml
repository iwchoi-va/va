function page_load(event) {
	try{
		XwingObject();
		
	}catch(e){
		xwing.Dialog.alert(e);
	}
	
	polno = Xwing.param.polno;
	var strCheck = polno.substr(0, 1);
	if(strCheck == "4"){ //장기
		getDmboList("coverageVoList");
	}else{ //일반
		getDmboList2();
	}
	
	
}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		
		case "coverageVoList":
			
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			$DS_LIST.appendDataset($DS_RES);
			
			for(var i = 0 ; i < $DS_LIST.size() ; i++){
				$DS_LIST.setValue(i, "causeCls", $DS_LIST.getValue(i,"causeCls") == "1" ? "기본" : "선택"); //기본/선택 구분
			}
			
			getDmboList("premiumVoList");
		break;
		case "premiumVoList":
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			$DS_PRE_LIST.appendDataset($DS_RES);
			
		break;
		case "mntnCtrCvrInfoList":
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			//$DS_LIST.appendDataset($DS_RES);
			 if($DS_RES.size() > 0){
				var nPremiumAmtTotal = 0;
				//$DS_LIST2.clearData();
				for(var i = 0 ; i < $DS_RES.size() ; i++){
					
					$DS_LIST.addRow();
					$DS_LIST.setValue(i, "causeCls"			, ""); //기본/선택 구분
					$DS_LIST.setValue(i, "puCodeName"		, $DS_RES.getValue(i, "coverageName"));
					$DS_LIST.setValue(i, "joinAmount"		, $DS_RES.getValue(i, "secuAmt"));
					$DS_LIST.setValue(i, "basePremiumAmount"	, $DS_RES.getValue(i, "premiumAmount"));

					//nPremiumAmtTotal += parseInt($DS_RES.getValue(i, "premiumAmount"), 10);
					nPremiumAmtTotal += Number($DS_RES.getValue(i, "premiumAmount"));
				}
				//console.log($DS_LIST);
				$DS_PRE_LIST.clearData();
				$DS_PRE_LIST.addRow();
				$DS_PRE_LIST.setValue(0, "guarantyPremiumAmount", "0"); //보장보험료
				$DS_PRE_LIST.setValue(0, "accumPremiumAmount"	, "0"); //적립보험료
				$DS_PRE_LIST.setValue(0, "basicPremium"			, nPremiumAmtTotal); //합계보험료
			}
			
			
			//$DS_PRE_LIST.appendDataset($DS_RES);
			
		break;
		default: break;	
	}
}



function getDmboList(str){
	//https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0022&_reqJson={"TBMA003_PSN_NO":"주민번호","searchCondition4":"0","CHAR_10":"0","CHAR_11":"5","clerkNo":"51160050","chnlCls":"TM"}
	var url = getWebServiceURL();
	var serviceName ="LTTMINFR0028";
	
	//var psnNo = $DS_PSN.getValue(0,"CON_P_PSN_NO"); 
	//var clerkNo = $DS_USERINFO.getValue(0,"TREATYCD");
	/*
	var polno		= opener.ds_CSB10106S_detail.getColumn(0, "TBMA003_POL_NO");
	var currdate	= gfn_getSysDate();
	var treatycd	= gds_userinfo.getColumn(0,"TREATYCD");
	var loginClerk	= gds_userinfo.getColumn(0,"USERID");

	ds_salePolicySummaryList.addRow();
	ds_salePolicySummaryList.setColumn(0,"policyNumber"	, polno);
	ds_salePolicySummaryList.setColumn(0,"eventBaseDate", currdate);
	ds_salePolicySummaryList.setColumn(0,"loginClerk"	, loginClerk);
	ds_salePolicySummaryList.setColumn(0,"eventNo"		, "");
	*/
	var currdate= g_toDate();
	var clerkNo = Xwing.param.user_id;
	var reqJson ='{"salePolicySummaryListNormal":[{"policyNumber":"'+ polno+'","loginClerk":"'+clerkNo+'","eventBaseDate":"'+currdate+'","eventNo":""}]}';
	
	var dsObj = (str == "coverageVoList") ? $DS_LIST : $DS_PRE_LIST;
	
	var opt = {
			reqId: str,
			url: "service::oba.oba010t1t7.getContractInfoVoList.sel.do",
			param: {
				serviceUrl: url,
				serviceName : serviceName ,
				serviceResult : str,
				reqJson :reqJson,
				DS_RES: dsObj
			},
			indicator: null,
			showError: true
	};

	Xwing.request(opt, callback);	
}

function getWebServiceURL(){
	
	var hostname = window.location.hostname.split(".");
	
	var url ="";
	if(hostname[0] == "vadev"){
		url = "https://tsdev.aig.co.kr/tmMciService.do";
	}else if(hostname[0] == "vauat"){
		url = "https://tsuat.aig.co.kr/tmMciService.do";
	}else if(hostname[0] == "va"){
		url = "https://ts.aig.co.kr/tmMciService.do";
	}else{//로컬도 개발url로.
		url = "https://tsuat.aig.co.kr/tmMciService.do";
		//url = "https://tsdev.aig.co.kr/tmMciService.do";
	}
	
	return url;
}
