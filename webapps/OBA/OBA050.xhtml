/* ***********************************************************
 * 	조회 조건 파라미터 셋팅함수(기간구분되는 콤보박스사용)
 *************************************************************/
function getSrcParam(){
	if(g_dateToParam()){
		gubun = g_dateToParam().gubun;
		sdate = g_dateToParam().sdate;
		edate = g_dateToParam().edate;
		stime = "000000";
		etime = "235959";
		if(gubun == 'H') { stime=g_dateToParam().stime+'0000';  etime=g_dateToParam().etime+'5959'; }

		return true;
	}
}
function search() {


	//var new_user_id = $chk_new_user.getValue()=="true"?"AND Y.USER_ID IN (SELECT USER_ID FROM ms_usermaster WHERE WORK_MONTH <= (SELECT ETC1 FROM ms_codebook where code_type='SYS103' and code_id != 00))":"";
	var new_user_id = $chk_new_user.getValue()=="true"?"true":"";
	var param = {};
	var sqlName="";
	if(vrs_gubun == "getVrsRank_SCLF"){
		sqlName="oba.oba050.getVrsRank.sclf.sel";
	}else{
		sqlName="oba.oba050.getVrsRank.qst.sel";
		var lclf_cd="", sclf_cd="",	qst_cd="";
		lclf_cd =$DS_SCLF_RANK.getValue($grd_sclf_list.getSelection(),"LCLF_CD");
		sclf_cd =$DS_SCLF_RANK.getValue($grd_sclf_list.getSelection(),"SCLF_CD");
	}

	param= {
			_sqlName : sqlName,
			new_user_id : new_user_id,
			lclf_cd:lclf_cd,
			sclf_cd : sclf_cd,
			SDATE: sdate+stime,
			EDATE: edate+etime
	};

	g_orgToParam("", param);
	g_productToParam("",param);
	g_analStatToParam("",param);

	var opt = {
			reqId: vrs_gubun,
			url: v_url,
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

	//sc_sno =$DS_SCLF_RANK.getValue($grd_sclf_list.getSelection(),"SC_SNO");
	lclf_cd =$DS_SCLF_RANK.getValue($grd_sclf_list.getSelection(),"LCLF_CD");

			};

function cbo_gubun_change(event) {
	var gubun = $cbo_gubun.getValue();

	 if(gubun == "ORG2"){
		$grd_detail_list1.setVisible(true);
		$grd_detail_list2.setVisible(false);
		$grd_detail_list3.setVisible(false);
		$edit_rowcnt2.setValue($DS_ORG2_RANK.size());
	}else if(gubun == "ORG3"){
		$grd_detail_list1.setVisible(false);
		$grd_detail_list2.setVisible(true);
		$grd_detail_list3.setVisible(false);
		$edit_rowcnt2.setValue($DS_ORG3_RANK.size());
	}else{
		$grd_detail_list1.setVisible(false);
		$grd_detail_list2.setVisible(false);
		$grd_detail_list3.setVisible(true);
		$edit_rowcnt2.setValue($DS_USER_RANK.size());
	}

}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {

		case "getVrsRank_SCLF":
			$DS_SCLF_RANK.setData(res.DS_SCLF_RANK.column, res.DS_SCLF_RANK.record);
			$edit_sclf_rowcnt.setValue($DS_SCLF_RANK.size());
			//grd_list_dblclick();
			vrs_gubun="getVrsRank_QST";
			search();
			//$DS_VRS_RANK.sort("RANK");
		break;
		case "getVrsRank_QST":
			$DS_QST_RANK.setData(res.DS_QST_RANK.column, res.DS_QST_RANK.record);
			$edit_qst_rowcnt.setValue($DS_QST_RANK.size());
			//$DS_VRS_RANK.sort("RANK");
		break;
		case "getVrsDetailRank":
			$DS_ORG2_RANK.clearData();
			$DS_ORG3_RANK.clearData();
			$DS_USER_RANK.clearData();
			//$DS_ORG_RANK.setData(res.DS_ORG_RANK.column, res.DS_ORG_RANK.record);
			//$edit_rowcnt2.setValue($DS_ORG_RANK.size());

				$DS_USER_RANK.setData(res.DS_ORG_RANK.column, res.DS_ORG_RANK.record);
			//$DS_USER_RANK.setValue($DS_USER_RANK.size()-1, "AVG_SCORE", $DS_USER_RANK.avg('SCORE',"[ORG3_CD=='"+org3_cd+"']").toFixed(2));
			var org2_cd = "", org2_nm="", org3_cd="",org3_nm="", user_id="",user_name="";
			for(var i =0; i<$DS_USER_RANK.size();i++){
				 org2_cd = $DS_USER_RANK.getValue(i, "ORG2_CD");
				 org2_nm = $DS_USER_RANK.getValue(i, "ORG2_NM");
				 org3_cd = $DS_USER_RANK.getValue(i, "ORG3_CD");
				 org3_nm = $DS_USER_RANK.getValue(i, "ORG3_NM");
				 user_id = $DS_USER_RANK.getValue(i, "USER_ID");
				 user_name = $DS_USER_RANK.getValue(i, "USER_NAME");

				if(i== 0 || $DS_ORG3_RANK.indexOfRow("ORG3_CD" , org3_cd) == -1){
					$DS_ORG3_RANK.addRow();
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG2_CD", org2_cd);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG2_NM", org2_nm);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG3_CD", org3_cd);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "ORG3_NM", org3_nm);
					$DS_ORG3_RANK.setValue($DS_ORG3_RANK.size()-1, "AVG_SCORE", $DS_USER_RANK.avg('AVG_SCORE',"[ORG3_CD=='"+org3_cd+"']").toFixed(2));
				}
				if(i== 0 || $DS_ORG2_RANK.indexOfRow("ORG2_CD" , org2_cd) == -1){
					$DS_ORG2_RANK.addRow();
					$DS_ORG2_RANK.setValue($DS_ORG2_RANK.size()-1, "ORG2_CD", org2_cd);
					$DS_ORG2_RANK.setValue($DS_ORG2_RANK.size()-1, "ORG2_NM", org2_nm);
					$DS_ORG2_RANK.setValue($DS_ORG2_RANK.size()-1, "AVG_SCORE", $DS_USER_RANK.avg('AVG_SCORE',"[ORG2_CD=='"+org2_cd+"']").toFixed(2));

				}
			}

			$DS_ORG3_RANK.sort("AVG_SCORE", "desc");
			$DS_ORG2_RANK.sort("AVG_SCORE", "desc");


			for(var i =0 ; i< $DS_ORG3_RANK.size();i++){
				$DS_ORG3_RANK.setValue(i, "RANK", (i+1));
			}
			for(var i =0 ; i< $DS_ORG2_RANK.size();i++){
				$DS_ORG2_RANK.setValue(i, "RANK", (i+1));
			}

			$DS_ORG3_RANK.setCursor(0);
			$DS_ORG2_RANK.setCursor(0);
			$DS_USER_RANK.setCursor(0);

			cbo_gubun_change();


		break;
	}
}

function btn_excel2_click(event) {
	var dsName = "";
	var grdName = "";
	var dataName="";
	var gubun = $cbo_gubun.getValue();
	var keyIdx=0, keyTitle="";
	$DS_ORG_EXCEL.clear();

	if(gubun == "ORG2") {
		dsName = "DS_ORG2_RANK";
		grdName = "grd_excel_list1";
		keyIdx=2;

	}else if(gubun == "ORG3") {
		dsName = "DS_ORG3_RANK";
		grdName = "grd_excel_list2";
		keyIdx=3;
	}else if(gubun == "USER"){
		dsName = "DS_USER_RANK";
		grdName = "grd_excel_list3";
		keyIdx=4;
	}
	$DS_ORG_EXCEL.copyFrom(dsName);
	$DS_ORG_EXCEL.addColumn("KEYWORD");
	for(var i=0, len=Xwing.getDataset(dsName).size();i<len;i++){
		$DS_ORG_EXCEL.setValue(i,'KEYWORD',$lbl_qst_nm.getValue());
	}
	if(vrs_gubun == "getVrsRank_SCLF"){
		keyTitle="소분류명";
	}else if(vrs_gubun == "getVrsRank_QST"){
		keyTitle="질의유형명";
	}
	Xwing.getDataGrid(grdName).getCell('head',0,keyIdx).setText(keyTitle);

	dataName=$DS_GUBUN.getData("[CODEID=='"+gubun+"']");
	dataName=dataName[0];
	dataName=dataName[1];
	if(Xwing.getDataset(dsName).size() > 0) {
		Xwing.getDataGrid(grdName).exportData('VRS순위_소속기준('+dataName+')', '../jsp/export2.jsp', true);

	} else {
		xwing.Dialog.alert("출력할 데이터가 없습니다.");
	}
