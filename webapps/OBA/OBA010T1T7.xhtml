function getContractInfoVoList(){
	//https://tsdev.aig.co.kr/tmMciService.do?_serviceName=LTTMINFR0022&_reqJson={"TBMA003_PSN_NO":"주민번호","searchCondition4":"0","CHAR_10":"0","CHAR_11":"5","clerkNo":"51160050","chnlCls":"TM"}
	var url = getWebServiceURL();
	var serviceName ="LTTMINFR0022";
	
	var psnNo = $DS_PSN.getValue(0,"CON_P_PSN_NO"); 
	var clerkNo = $DS_USERINFO.getValue(0,"TREATYCD");
	//clerkNo = "23921376";
	var reqJson ='{"TBMA003_PSN_NO":"'+ psnNo+'","searchCondition4":"0","CHAR_10":"0","CHAR_11":"5","clerkNo":"'+clerkNo+'","chnlCls":"TM"}';
	
	
	var opt = {
			reqId: "getContractInfoVoList",
			url: "service::oba.oba010t1t7.getContractInfoVoList.sel.do",
			param: {
				serviceUrl: url,
				serviceName : serviceName ,
				serviceResult : "contractInfoVoList",
				reqJson :reqJson,
				DS_RES: $DS_RES
			},
			indicator: null,
			showError: true
	};

	Xwing.request(opt, callback);	
}

function getWebServiceURL(){
	
	var hostname = window.location.hostname.split(".");
	
	var url ="";
	if(hostname[0] == "vadev"){
		url = "https://tsdev.aig.co.kr/tmMciService.do";
	}else if(hostname[0] == "vauat"){
		url = "https://tsuat.aig.co.kr/tmMciService.do";
	}else if(hostname[0] == "va"){
		url = "https://ts.aig.co.kr/tmMciService.do";
	}else{//로컬도 개발url로.
		url = "https://tsuat.aig.co.kr/tmMciService.do";
		//url = "https://tsdev.aig.co.kr/tmMciService.do";
	}
	
	return url;
}
