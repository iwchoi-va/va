function page_load(event) {
	XwingObject();
	
	g_createDate("pnl_date","Y","Y","Y", "설계일시","Y"); //기간 샛성
	
	$cmb_gubun.setValue('D');
	_gubun_change();
	$sdate.setValue(g_addDate("m", -1, g_toDate(), ""));
	$edate.setValue(g_toDate());
	gubun = g_dateToParam().gubun;
	g_createOrg("pan_dept", 3, "Y", "Y", "Y", "", "전체",false,true);
	g_createAnlStat("pnl_anlstat");
	g_createproduct("pnl_product", 2, "", "", "전체", "N");
	f_codebook_sel();

}

function f_codebook_sel() {

	var param = {
		cmd : "getCodes",
		codeType : "VSS160",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}

function lbl_sub1_click(event) {
	org_cd = ['',''];

	Xwing.getLabel('lbl_sub2').setBgcolor('');
	Xwing.getLabel('lbl_sub2').setFontcolor('');
	
	Xwing.getLabel('lbl_sub3').setFontweight('normal');
	Xwing.getLabel('lbl_sub3').setBgcolor('');
	Xwing.getLabel('lbl_sub3').setFontcolor('');

	Xwing.getLabel('lbl_sub1').setFontweight('bold');
	Xwing.getLabel('lbl_sub1').setBgcolor('#58728d');
	Xwing.getLabel('lbl_sub1').setFontcolor('#fff');
	
	Xwing.getPanel('pan_tab1').setVisible(true);
	Xwing.getPanel('pan_tab2').setVisible(false);
	sel_org="ORG2";
	$pan_tab1.setUrl("./BIS040T1.xhtml");
	
}

	Xwing.getLabel('lbl_sub1').setFontweight('normal');
	Xwing.getLabel('lbl_sub1').setBgcolor('');

	Xwing.getLabel('lbl_sub3').setFontweight('normal');
	Xwing.getLabel('lbl_sub3').setBgcolor('');

	Xwing.getLabel('lbl_sub2').setFontweight('bold');

function lbl_sub3_click(event) {
	Xwing.getLabel('lbl_sub1').setFontweight('normal');
	Xwing.getLabel('lbl_sub1').setBgcolor('');
	Xwing.getLabel('lbl_sub1').setFontcolor('');
	
	Xwing.getLabel('lbl_sub2').setFontweight('normal');

	Xwing.getLabel('lbl_sub3').setFontweight('bold');

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {

	case 'f_codebook_sel' :
		$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
		$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);
		
		setTimeout(function(){btn_search_click();},500);
		break;	
	
	}
}

function btn_search_click(event) {
	
	if(getSrcParam()){
		ced_no = $edt_ced_no.getValue();
		grade = $cmb_grade.getValue();
		new_user_id = $chk_new_user.getValue();
		start = gubun=="H"?sdate+stime:sdate;
		end = gubun=="H"?edate+etime:edate;
		
		switch (g_orgLevel()) {
		case 1:
			lbl_sub1_click();
			break;
		case 2:
		
			lbl_sub2_click();
			break;
		case 3:
		case 4:
			lbl_sub3_click();
			break;
		default:
			break;
		}
	}
	
	
}

/* ***********************************************************
 * 	조회 조건 파라미터 셋팅함수(기간구분되는 콤보박스사용)
 *************************************************************/
function getSrcParam(){
	if(g_dateToParam()){
		gubun = g_dateToParam().gubun;
		sdate = g_dateToParam().sdate;
		edate = g_dateToParam().edate;
		if(gubun == 'H') { stime=g_dateToParam().stime+'0000';  etime=g_dateToParam().etime+'5959'; }
		return true;
	}
}

/* ***********************************************************
 * 키워드 엔터 이벤트 함수 
 *************************************************************/
function edt_sch_keyup(event) {
	if(event.event.keyCode == '13') {
		btn_search_click();
	}
}
