	$cmb_prod_cd.setValue('');

function reciever(param){
	init_search();
	setTimeout(function(){
		param = param.gubun == undefined? parent._parameter: param;
		ced_no=param.ced_no != undefined? param.ced_no:'';
		var p_gubun = param.gubun != undefined? param.gubun:'';
		var user_id = param.user_id != undefined? param.user_id:'';
		var org1_cd = param.org1_cd != undefined? param.org1_cd:$cmb_org1.getValue();
		var org2_cd =param.org2_cd != undefined? param.org2_cd:'';
		var org3_cd =param.org3_cd != undefined? param.org3_cd:'';
		sdate =param.sdate != undefined? param.sdate:'';
		edate =param.edate != undefined? param.edate:'';
		stime =param.stime != undefined? param.stime:'';
		etime =param.etime != undefined? param.etime:'';

		if(p_gubun == 'A'){
			$edt_ced_no.setValue(ced_no);
			g_setOrg(org1_cd,org2_cd,org3_cd,user_id);
		}
		if(p_gubun == 'C')g_setOrg(org1_cd,org2_cd);
		if(p_gubun == 'T')g_setOrg(org1_cd,org2_cd,org3_cd,user_id);
		if(sdate != "") $dpk_sdate.setValue(sdate);
		if(edate != "") $dpk_edate.setValue(edate)
		if(stime != "") $edt_stime.setValue(stime)
		if(edate != "") $edt_etime.setValue(etime);

		setTimeout(function(){btn_search_click();},400); //원래 코드유틸이었는데... 왜 때문이었지.
	},300);
}

function f_codebook_sel() {

	var param = {
		cmd : "getCodes",
		codeType : "RPT200,SYS101,VSS160",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
	case 'f_codebook_sel' :
		$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
		$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
		$ds_time.copyFrom($DS_RPT200);
		$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
		$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);


		if(!parent._load_val){
			setTimeout(function(){
				init_search();
				setTimeout(function(){
					btn_search_click();
				}, 500);
			},400);
		}
		break;

	}
}

function btn_search_click(event) {
	if(checkDate($dpk_sdate,$dpk_edate,$edt_stime,$edt_etime)) return;
	sdate = $dpk_sdate.getValue();
	edate = $dpk_edate.getValue();
	stime = $edt_stime.getValue();
	etime = $edt_etime.getValue();
	ced_no = $edt_ced_no.getValue();
	grade = $cmb_grade.getValue();
	new_user = $chk_new_user.getValue();
	anl_yn = $cmb_anl_stat.getValue();

	$lbl_sub1.setValue("센터별");
	$lbl_sub2.setVisible(true);
	$lbl_sub3.setVisible(true);

	if($cmb_user.getValue() == ""){
		type = "DEPT1";
		$pan_tab1.setUrl("./BIS020T1.xhtml");
		lbl_sub1_click();
	}else{
		type = "USER";
		$pan_tab1.setUrl("./BIS020T1.xhtml");
		lbl_sub3_click();
	}





}

function edt_sch_keyup(event) {
	if(event.event.keyCode == '13') {

function page_unload(event) {
	top._load_val = false; // child load 완료여부
	top._menuId = ""; // child ID
	top._parameter = null; // 검색할 키워드
	top._hidden_val = false; // 숨김화면 여부
	top._label = ""; // 숨김화면 타이틀
}
