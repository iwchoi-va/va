function f_searchRes(){
	
	 var param	= {		
			 type : type,
			 sdate : sdate + stime,
			 edate : edate + etime,
			 ced_no : ced_no,
			 grade : grade,
			 new_user : new_user,
			 clicked_dept : selected_dept,
			 anl_yn : anl_yn,
			 DS_PARAM: $DS_PARAM
	 }
	 
	 parent.g_orgToParam("", param);
	 parent.g_productToParam("", param);
	 
	 
	var opt = {
			reqId: 'f_searchRes',
			url: "service::bis.bis030t1.getOmitScript.sel.do", 
			param: param,
			indicator: null,
			showError: true					
	};
	Xwing.request(opt, callback);
	
}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "f_searchRes" :

			if(type == "DEPT1"){
				$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
				$edit_rowcnt.setValue($DS_RES.size());
			}else if(type =="DEPT2"){
				$DS_RES2.setData(res.DS_RES.column, res.DS_RES.record);
				$edit_rowcnt.setValue($DS_RES2.size());
			}else if(type == "USER"){
				$DS_RES3.setData(res.DS_RES.column, res.DS_RES.record);
				$edit_rowcnt.setValue($DS_RES3.size());
			}
			
			f_makeGrid();
			
		break;
		case "getUser" :
			$DS_PARAM.setData(res.DS_USER.column,res.DS_USER.record);
			
			if($DS_PARAM.size() == 0){
				new xwing.Dialog.alert("해당 레벨의 상담사가 존재하지 않습니다.");
				return;
			}
			
			f_searchRes();
			
		break;
		
		case "f_searchDetailRes" :
			$DS_DETAIL_RES.setData(res.DS_DETAIL_RES.column,res.DS_DETAIL_RES.record);
			
		break;	
		
	}
}

function f_makeGrid(){
	var col_cnt = [];
	
	if(type == "DEPT1"){
		col_cnt = $DS_RES.getColumnInfo();
	}else if(type == "DEPT2"){ 
		col_cnt = $DS_RES2.getColumnInfo();
	}else{
		col_cnt = $DS_RES3.getColumnInfo();
	}
	var f_column = "<xwing:datagrid-colgroup>"
		 + "<xwing:datagrid-column width='200'></xwing:datagrid-column>"
	+ "<xwing:datagrid-column width='70'></xwing:datagrid-column>";

	for(var i =1; i< col_cnt.length-1;i++){
		
		f_column += "<xwing:datagrid-column width='85'></xwing:datagrid-column>";
	}
	
	f_column += "</xwing:datagrid-colgroup>";
	
	var f_head = "<xwing:datagrid-head>"
	   	   + "<xwing:datagrid-row height='30'>"
	   	   + "<xwing:datagrid-cell text='소분류명'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell text='설계건수'></xwing:datagrid-cell>";
	
	
	for(var i =2; i< col_cnt.length;i++){
		var dept = col_cnt[i].split("_")[1];
		var idx = -1;
		
		if(type == "USER")  idx = $DS_PARAM.indexOfRow(type+"_ID", dept);
		else idx = $DS_PARAM.indexOfRow(type+"_CD", dept);
		
		var dept_nm = $DS_PARAM.getValue(idx, type+"_NAME");

		f_head += "<xwing:datagrid-cell text='"+dept_nm+"'></xwing:datagrid-cell>";
		
	}
	
	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";
	
	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>";
	
	for(var i =0; i< col_cnt.length; i++){
		if(i == 0) f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='left' expr='expr_sclf_cd' suppress='false'></xwing:datagrid-cell>";
		else if(i == 1) f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='right'></xwing:datagrid-cell>";
		else f_body += "<xwing:datagrid-cell bindcolumn='"+col_cnt[i]+"' halign='center'  expr='setColor'></xwing:datagrid-cell>";
		
	}
	
	f_body += "</xwing:datagrid-row>"
 	   +"</xwing:datagrid-body>";
	
	var f_context = f_column + f_head + f_body ;
	
	if(type == "DEPT1") $grd_dept1_list.addContent(f_context, true);
	else if(type == "DEPT2") $grd_dept2_list.addContent(f_context, true);
	else $grd_dept3_list.addContent(f_context, true);
	
	
}

function expr_sclf_cd(cellObj,rowIdx) {
	
	var opt = {};
	var dataset = "";
	if(type == "DEPT1"){
		dataset = Xwing.getDataset("DS_RES");
	}else if(type == "DEPT2"){
		dataset = Xwing.getDataset("DS_RES2");
	}else{
		dataset = Xwing.getDataset("DS_RES3	");
	}
	
	if(dataset.getValue(rowIdx,'SC_SCLF_CD') != ''){
		opt['value'] = dataset.getValue(rowIdx,'SC_SCLF_NM')+" ("+dataset.getValue(rowIdx,'SC_SCLF_CD')+")";
	}
	
	return opt;
}

function setColor(cellObj,rowIdx) {
	var val={};
	var dataset = "";
	if(type == "DEPT1"){
		dataset = Xwing.getDataset("DS_RES");
	}else if(type == "DEPT2"){
		dataset = Xwing.getDataset("DS_RES2");
	}else{
		dataset = Xwing.getDataset("DS_RES3");
	}
	var bindcolumn = cellObj.getBindcolumn();
	
	if(bindcolumn.indexOf("COL_") != -1 )
		val["bgcolor"] = ( dataset.getValue(rowIdx, bindcolumn) != "0/0" ? "#FFC19E" : "" ) ; //#FFFFE4 //lightsalmon//FAE0D4
	
	if (val)
		return val;
}
