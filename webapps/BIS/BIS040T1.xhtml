function getOrgList() {
	$DS_ORG.clearData();

	//if (g_checkDate(sdate,edate)== false)	return;

	//parameters
	var param = {};
	var sqlName="", grpby="",join="", orderby="";

	sqlName="bis.bis040.getOrgStats.org.sel";
	/*if(sel_org == "ORG2"){
		
		//grpby="ORG2_CD, ORG2_NM";
		//join = "T.ORG2_CD = BEF.ORG2_CD";
		//orderby ="T.ORG2_CD,T.ORG2_NM";
	}else{
		sqlName="bis.bis040.getOrgStats.org2.sel";
		//grpby="ORG2_CD, ORG2_NM, ORG3_CD, ORG3_NM";
		//join = "T.ORG2_CD = BEF.ORG2_CD AND T.ORG3_CD=BEF.ORG3_CD";
		//orderby ="T.ORG2_CD,T.ORG2_NM, T.ORG3_CD, T.ORG3_NM";
	}*/
	grpby = sel_org;
	join = sel_org;
	orderby = sel_org;
	
	var new_user_id = parent.new_user_id=="true"?"true":"";

	param= {
			_sqlName: sqlName,
			new_user_id : new_user_id,
			CED_NO : parent.ced_no,
			GRADE : parent.grade,
			SDATE: start,
			EDATE: end,
			GROUPBY : grpby,
			JOIN : join,
			ORDERBY: orderby
	};

	parent.g_orgToParam("", param);
	if(sel_org == "ORG3"){
		if(param.ORG2_CD == ""){
			param.ORG2_CD = parent.org_cd[0];
		}
	}
	parent.g_productToParam("",param);
	parent.g_analStatToParam("",param);
	var opt 	= {
			reqId: "getOrgList",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {

		case 'getOrgList' :
			$DS_ORG.setData(res.DS_LIST.column, res.DS_LIST.record);

			if($DS_ORG.size()>0){
				grd_org_list_click();
			}
			break;
		case 'getCedDateList' :
				$DS_MULTI_RES.setData(res.DS_DATE_LIST.column, res.DS_DATE_LIST.record);

				drawTotalChart();
			break;
	}
}


function grd_statics_list_dblclick(event) {
	var nCell = event.cell._getColIndex();


	if(nCell == 13) parent.lbl_sub3_click();

}

function grd_org_list_click(event) {

	var idx = $DS_ORG.getCursor();

	var org_cd ="";
	$lbl_subtitle2.setValue($DS_ORG.getValue(idx, sel_org+"_NM") + "의 상세통계");
	if(event != undefined){
		var nCell = event.cell._getColIndex();

		switch (nCell) {
		case 1:
			if(sel_org=="ORG2"){

				parent.org_cd[0] = $DS_ORG.getValue(idx, "ORG2_CD");
				parent.lbl_sub2_click();
				return;
			}
			break;
		case 2:

			if(sel_org == "ORG3"){
				 parent.org_cd[0] =$DS_ORG.getValue(idx, "ORG2_CD");
				 parent.org_cd[1] =$DS_ORG.getValue(idx, "ORG3_CD");
				 parent.lbl_sub3_click();
				return;
			 }
			break;
		default:
			drawPieChart(idx);
			getCedDateList(idx);
			break;
		}

	}else{
		drawPieChart(idx);
		getCedDateList(idx);
	}
}

function drawPieChart(idx){
	$DS_GRADE.clearData();
	for(var i=0, len = $DS_COL.size(); i<len ; i++){
	 $DS_GRADE.addRow();
	 $DS_GRADE.setValue(i,"GRADE",$DS_COL.getValue(i,"CODENAME"));
	 $DS_GRADE.setValue(i,"COUNT",$DS_ORG.getValue(idx,"GRADE"+(i+1)+"_CNT"));
	}
	//setTimeout(function(){$pnl_pie_chart.setUrl("../chart/pie-chart-BIS050.html");},500);
	$pnl_pie_chart.setUrl("../chart/pie-chart-BIS040.html");

}

function getCedDateList(idx){
	$DS_MULTI_RES.clearData();
	var param = {};
	var sqlName="";
	var org2_cd = "", org3_cd="" ;

	org2_cd = $DS_ORG.getValue(idx,"ORG2_CD");
	org3_cd = $DS_ORG.getValue(idx,"ORG3_CD");

	sqlName="bis.bis040.getOrgStats.cedDate.sel";

	var new_user_id = parent.new_user_id=="true"?"true":"";

	param= {
			_sqlName: sqlName,
			new_user_id : new_user_id,
			CED_NO : parent.ced_no,
			GRADE : parent.grade,
			SDATE: start,
			EDATE: end,
			dateLen : gubun
	};

	parent.g_orgToParam("", param);
	param.ORG2_CD = org2_cd;
	param.ORG3_CD = org3_cd;
	parent.g_productToParam("",param);
	parent.g_analStatToParam("",param);

	var opt 	= {
			reqId: "getCedDateList",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}

function drawTotalChart(idx){
	setDate('DS_MULTI_RES', gubun,start, end);
	if(gubun == "W"){
		 var tmp_obj = Xwing.createDataset('DS_TMP');
		 tmp_obj.setColumnInfo($DS_MULTI_RES.getColumnInfo());
		 var date = "", week = "", date_nm=[];

		 for(var i = 0, len=$DS_MULTI_RES.size(); i< len; i++){
			 var tmp_nm = $DS_MULTI_RES.getValue(i,"DATE_NM");
			 if(date_nm.indexOf(tmp_nm) == -1) date_nm.push(tmp_nm);
		 }
		 //현재 존재하는 데이터들로 통계 데이터 합산하여 계산.
		 for(var i =0, len = date_nm.length; i<len ; i++){

			 tmp_obj.addRow();
			 tmp_obj.setValue(tmp_obj.size()-1,"DATE",date_nm[i]); //일부로 DATE컬럼에 넣음. 나중에 차트그리기위해.
			 tmp_obj.setValue(tmp_obj.size()-1,"DATE_NM",date_nm[i]);
			 tmp_obj.setValue(tmp_obj.size()-1,"CED_CNT",$DS_MULTI_RES.sum("CED_CNT","[DATE_NM == '"+date_nm[i]+"']"));
			 tmp_obj.setValue(tmp_obj.size()-1,"VRS_SCORE",($DS_MULTI_RES.avg("VRS_SCORE","[DATE_NM == '"+date_nm[i]+"']")).toFixed(2));
			 tmp_obj.setValue(tmp_obj.size()-1,"AVG_BAN_CNT",$DS_MULTI_RES.sum("AVG_BAN_CNT","[DATE_NM == '"+date_nm[i]+"']"));
			 tmp_obj.setValue(tmp_obj.size()-1,"BEF_SCORE",($DS_MULTI_RES.avg("BEF_SCORE","[DATE_NM == '"+date_nm[i]+"']")).toFixed(2));
	//		 tmp_obj.setValue(tmp_obj.size()-1,"FOC_SCORE",($DS_MULTI_RES.avg("FOC_SCORE","[DATE_NM == '"+date_nm[i]+"']")).toFixed(2));
			 tmp_obj.setValue(tmp_obj.size()-1,"SEC_SCORE",($DS_MULTI_RES.avg("SEC_SCORE","[DATE_NM == '"+date_nm[i]+"']")).toFixed(2));
	//		 tmp_obj.setValue(tmp_obj.size()-1,"AVG_MEN_CNT",$DS_MULTI_RES.sum("AVG_MEN_CNT","[DATE_NM == '"+date_nm[i]+"']"));
			 tmp_obj.setValue(tmp_obj.size()-1,"GRADE_SCORE",($DS_MULTI_RES.avg("GRADE_SCORE","[DATE_NM == '"+date_nm[i]+"']")).toFixed(2));
		}
		 noDataWeekInsert(tmp_obj,$DS_MULTI_RES);

		}
	$pnl_multi_chart.setUrl("../chart/line-bar-BIS040.html");
