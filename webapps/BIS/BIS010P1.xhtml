<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var _url = "service::bis.bis020p1.getSentlist.sel.do";
var ced_no = "";
var ced_info = "";
var ucid_date_max = "", ucid_dat_min;
function page_load(event) {

	XwingObject();

	ced_no = Xwing.param.ced_no;


	getSentList();
}

function getSentList(){
	var param	= {
			 _sqlName: "bis.bis010p1.getSentlist.sel, bis.bis030p1.getCedinfo.sel",
			 ced_no : ced_no
	 }

	var opt = {
			reqId: 'f_getSentList',
			url: _url,
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);

}

function getSttList(){
	var param	= {
			 _sqlName: "bis.bis010p1.getSttsent.sel",
			 CED_NO : ced_no,
			 type : "D"
	 }

	var opt = {
			reqId: 'f_getSttList',
			url: "service::msens.xcron.hansol.sttEncryptWebaction.do",
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "f_getSentList" :
			$DS_FOC_LIST.setData(res.DS_FOC_LIST.column, res.DS_FOC_LIST.record);
			//$DS_STT_LIST.setData(res.DS_STT_LIST.column, res.DS_STT_LIST.record);
			$DS_CED_INFO.setData(res.DS_CED_INFO.column, res.DS_CED_INFO.record);

			getSttList();
		break;

		case "f_getSttList" :
			$DS_STT_LIST.setData(res.DS_RES.column, res.DS_RES.record);
		break;

	}
}


function grd_script_sent_click(event) {
	var qst_cd = $DS_FOC_LIST.getValue(event.rowIdx, "QST_CD");
	var script_id = $DS_FOC_LIST.getValue(event.rowIdx, "SCRIPT_SENT_ID");
	var idx = [];

	for(var i =0; i< $DS_STT_LIST.size(); i++){
		if($DS_STT_LIST.getValue(i, "QST_CD") == qst_cd && $DS_STT_LIST.getValue(i, "SCRIPT_SENT_ID") == script_id){
			$("#grd_stt_sent .xw-datagrid-area-body table tbody tr[cy='"+i+"']").addClass("select");
			idx.push(i);
		}else{
			$("#grd_stt_sent .xw-datagrid-area-body table tbody tr[cy='"+i+"']").removeClass("select");
		}
	}

	$DS_STT_LIST.setCursor(idx[0]);
}

function btn_move_click(event) {

	var date =  $edt_ced_date.getValue();

	ucid_date_max = $DS_CED_INFO.getValue(0, "MAX_DATE");
	ucid_date_min = $DS_CED_INFO.getValue(0, "MIN_DATE");

	var paramSet={
		gubun : 1,
		ced_no : ced_no,
		s_date : ucid_date_max.substring(0,8),
		e_date : ucid_date_min.substring(0,8),
		s_time : '000000',
		e_time : '235959'
	};



	//top.movePage('REC/REC010.xhtml', paramSet, false, '녹취리스트');
	parent.parent.parent.movePage('REC/REC010.xhtml', paramSet, true, '녹취리스트');

	parent.Xwing.getDialog("BIS010P1").close();


}

function expr_qst_cd(cellObj,rowIdx) {
	var opt = {};
	if($DS_FOC_LIST.getValue(rowIdx,'QST_CD') != '')
		opt['value'] = $DS_FOC_LIST.getValue(rowIdx,'QST_CDNM')+" ("+$DS_FOC_LIST.getValue(rowIdx,'QST_CD')+")";
	return opt;
}


/*]]>*/</script>
