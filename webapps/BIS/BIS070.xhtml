function getWorkMonthStats() {

	//if (g_checkDate(sdate,edate)== false)	return;

	//parameters

	var sqlName="", grpby="";

	sqlName="bis.bis070.getWorkMonthStats.sel";
	new_user_id= new_user_id=="true"?"true":"";
	//new_user_id= new_user_id=="true"?"AND Z.USER_ID IN (SELECT USER_ID FROM ms_usermaster WHERE WORK_MONTH <= (SELECT ETC1 FROM ms_codebook where code_type='SYS103' and code_id != 00))":"";

	param= {
			_sqlName: sqlName,

			CED_NO : ced_no,
			GRADE : grade,
			SDATE: start,
			EDATE: end

	};
	g_orgToParam("", param);
	g_productToParam("",param);
	g_analStatToParam("",param);

	var opt 	= {
			reqId: "getWorkMonthStats",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {

		case 'f_codebook_sel' :
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_COL.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);
			setTimeout(function(){f_makeGrid();},500);
			break;
		case 'getWorkMonthStats' :
			$DS_LIST.clear();
			$DS_TMP.clear();
			$DS_CAL.clear();
			$DS_RES.setData(res.DS_LIST.column, res.DS_LIST.record);
			$DS_RES_TMP.copyFrom($DS_RES);

			$DS_LIST.setColumnInfo($DS_RES.getColumnInfo());
			$DS_TMP.setColumnInfo($DS_RES.getColumnInfo());
			$DS_CAL.setColumnInfo($DS_RES.getColumnInfo());

			getGrpMonth();
			drawTotalChart();
			break;
		case 'getCedDateList' :
				$DS_MULTI_RES.setData(res.DS_DATE_LIST.column, res.DS_DATE_LIST.record);

				drawTotalChart();
			break;

		}
	}

function getGrpMonth(){
	var work_month="", work_month_nm="", work_month2="";

	for(var i=0, len=$DS_RES.size(); i<len; i++){
		work_month=parseInt($DS_RES.getValue(i,"WORK_MONTH"));
		work_month_nm=$DS_RES.getValue(i,"WORK_MONTH_NM");

		if(work_month < 5000){
			if(work_month_nm != '5년 이상'){ // work_month 순으로 오고있음.
				$DS_LIST.addRow($DS_RES.getRow(i));
				$DS_LIST.setValue(i,"WORK_MONTH",work_month*12);


			}else{
				if($DS_LIST.getData("[WORK_MONTH_NM == '5년 이상']").length == 0){
					$DS_LIST.addRow();
					$DS_LIST.setValue($DS_LIST.size()-1,"WORK_MONTH_NM",work_month_nm);
					$DS_LIST.setValue($DS_LIST.size()-1,"WORK_MONTH",5*12);

					$DS_LIST.setValue($DS_LIST.size()-1,"GRADE2_CNT",$DS_RES.sum("GRADE2_CNT","[WORK_MONTH_NM == '5년 이상']"));
					$DS_LIST.setValue($DS_LIST.size()-1,"GRADE3_CNT",$DS_RES.sum("GRADE3_CNT","[WORK_MONTH_NM == '5년 이상']"));

					$DS_LIST.setValue($DS_LIST.size()-1,"SEC_SCORE",($DS_RES.avg("SEC_SCORE","[WORK_MONTH_NM == '5년 이상']")).toFixed(0));
		//			$DS_LIST.setValue($DS_LIST.size()-1,"AVG_MEN_CNT",$DS_RES.avg("AVG_MEN_CNT","[WORK_MONTH_NM == '5년 이상']"));
					$DS_LIST.setValue($DS_LIST.size()-1,"GRADE_SCORE",($DS_RES.avg("GRADE_SCORE","[WORK_MONTH_NM == '5년 이상']")).toFixed(0));
				}
			}
	}else{ //1년차 미만 (그룹으로 자우롭게 묶을 수 있게 $DS_CAL에 쌓음)
		$DS_CAL.addRow($DS_RES.getRow(i));
		work_month2=parseInt($DS_RES.getValue(i,"WORK_MONTH"))-5000;
		$DS_CAL.setValue($DS_CAL.size()-1,"WORK_MONTH",work_month2);
	}
}
