function getQCStatsList() {

	//if (g_checkDate(sdate,edate)== false)	return;

	//parameters
	var param = {};
	var sqlName="", grpby="";

	sqlName="bis.bis080.getQCStats.sel";

	//new_user_id = new_user_id=="true"?"AND Z.USER_ID IN (SELECT USER_ID FROM ms_usermaster WHERE WORK_MONTH <= (SELECT ETC1 FROM ms_codebook where code_type='SYS103' and code_id != 00))":"";
	new_user_id = new_user_id=="true"?"true":"";

	param= {
			_sqlName: sqlName,
			new_user_id : new_user_id,
			CED_NO : ced_no,
			GRADE : grade,
			SDATE: start,
			EDATE: end

	};
	g_orgToParam("", param);
	g_productToParam("",param);
	g_analStatToParam("",param);

	var opt 	= {
			reqId: "getQCStatsList",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {

		case 'f_codebook_sel' :
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS160.insertRow(0,["VSS160", "", "전체", "", "", "", "", "", "", "", "", ""]);
			setTimeout(function(){f_makeGrid();},500);
			break;
		case 'getQCStatsList' :
			$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
			break;

	}

}

//*********************************************************************************************************
//* EXPR
//*********************************************************************************************************/
function expr_duration(cellObj,rowIdx) {
	var opt = {};
	var dsName="DS_LIST";


	var totalSeconds = $DS_LIST.getValue(rowIdx,'RECODE_TIME');
	//var score = $DS_RES.getValue(rowIdx, "SCORE");

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();
	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}
