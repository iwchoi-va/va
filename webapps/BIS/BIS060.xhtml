<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/
var v_url               = "service::bis.bis060.sel.do";

function page_load(event) {
	XwingObject();

	//$dpk_from_date.setValue("20180102");
	$dpk_from_date.setValue(g_addDate("d", -1, g_toDate(), ""));
	$dpk_to_date.setValue(g_toDate());
	$edt_stime.setValue("090000");
	$edt_etime.setValue("235959");

	g_createOrg("pan_org", 2, "Y", "N", "Y", "", "전체",false,true);

	f_selCodeBook();
}


function btn_search_click(event) {
	if(checkDate($dpk_from_date,$dpk_to_date,$edt_stime,$edt_etime)) return;
	f_selCodeBook();
}

function f_selCodeBook() {
	var sdate = $dpk_from_date.getValue()+$edt_stime.getValue();
	var edate = $dpk_to_date.getValue()+$edt_etime.getValue();
	var param	= {
			_sqlName: "cs.bis.bis060.total_process_status.sel",
			SDATE:sdate,
			EDATE:edate
	};
	g_orgToParam("", param);

	var opt 	= {
			reqId: "total_status",
			url: v_url,
			param: param
	};



	Xwing.request(opt, callback);
}


function btn_detail_search_click(event) {
	var sdate = $dpk_from_date.getValue()+$edt_stime.getValue();
	var edate = $dpk_to_date.getValue()+$edt_etime.getValue();
	var ced_no = $edt_ced_no.getValue();
	var param	= {
			_sqlName: "cs.bis.bis060.ced_detail.sel",
			SDATE:sdate,
			EDATE:edate,
			CED_NO : ced_no
	};
	g_orgToParam("", param);
	var opt 	= {
			reqId: "ced_status",
			url: v_url,
			param: param
	};

	Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {
	switch(reqId) {

	case "total_status":

		$DS_LIST.clear();
		$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);

		break;

	case "ced_status":

		$DS_DETAIL_LIST.clear();
		$DS_DETAIL_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);

		break;


	}


}



function expr_duration(cellObj,rowIdx) {
	var opt = {};
	var dsName="";

		dsName = "DS_LIST";

	var totalSeconds = $DS_LIST.getValue(rowIdx,'DURATION');
	//var score = $DS_RES.getValue(rowIdx, "SCORE");

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();
	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}

function expr_duration2(cellObj,rowIdx) {
	var opt = {};
	var dsName="";

		dsName = "DS_DETAIL_LIST";

	var totalSeconds = $DS_DETAIL_LIST.getValue(rowIdx,'DURATION');
	//var score = $DS_RES.getValue(rowIdx, "SCORE");

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();
	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}

/* ***********************************************************

function edt_sch_keyup(event) {
	if(event.event.keyCode == '13') {
		btn_search_click();
	}
}

function edt_sch2_keyup(event) {
	if(event.event.keyCode == '13') {
		btn_detail_search_click();
	}
}
