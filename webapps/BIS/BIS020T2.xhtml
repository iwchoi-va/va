function f_daily_makeGrid(){

	var f_column = "<xwing:datagrid-colgroup>"
		 + "<xwing:datagrid-column width='80'></xwing:datagrid-column>"
		 + "<xwing:datagrid-column width='100'></xwing:datagrid-column>"

		 + "<xwing:datagrid-column width='120'></xwing:datagrid-column>";
	
	
	for(var i =0; i< $DS_VSS160.size(); i++){
		f_column += "<xwing:datagrid-column width='150'></xwing:datagrid-column>";
	}
		
	f_column += "</xwing:datagrid-colgroup>";
	
	var f_head = "<xwing:datagrid-head>"
		   	   + "<xwing:datagrid-row>"
		   	   + "<xwing:datagrid-cell text='가입설계번호'></xwing:datagrid-cell>"
		   	   + "<xwing:datagrid-cell text='센터'></xwing:datagrid-cell>"

		   	   + "<xwing:datagrid-cell text='상담사'></xwing:datagrid-cell>";
	
	
	for(var i =0; i< $DS_VSS160.size(); i++){
		f_head += "<xwing:datagrid-cell text='"+$DS_VSS160.getValue(i, "CODENAME")+"'></xwing:datagrid-cell>";
	}
	
	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";
	
	
	var f_body = "";
	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>"
		   + "<xwing:datagrid-cell bindcolumn='STOCK_NUM' suppress='true' halign='center'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell bindcolumn='ORG1_CD' suppress='true' halign='center'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell bindcolumn='ORG2_CD' suppress='true' halign='center'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell bindcolumn='USER_ID' suppress='true' halign='center'></xwing:datagrid-cell>";;
	
	for(var i =0; i< $DS_VSS160.size(); i++){
		f_body += "<xwing:datagrid-cell bindcolumn='ITEM_"+(i+1)+"' suppress='true' halign='center'  expr='setColor'></xwing:datagrid-cell>";
	}
	
	f_body += "</xwing:datagrid-row>"
    	   +"</xwing:datagrid-body>";

	var f_context = f_column + f_head + f_body ;

	
	$grd_daily_list.addContent(f_context, true);

}

		   + "<xwing:datagrid-cell bindcolumn='USER_ID' suppress='true' halign='center'></xwing:datagrid-cell>";;

		f_body += "<xwing:datagrid-cell bindcolumn='ITEM_"+(i+1)+"' suppress='true' halign='center'  expr='setColor'></xwing:datagrid-cell>";

    	   +"</xwing:datagrid-body>";

	$grd_monthly_list.addContent(f_context, true);

}
