<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var type = "";

function page_load(event) {
	try{
		XwingObject();

		type = Xwing.param.type;
		g_createproduct("pan_product", 2, "msa070p2", "", "전체");
	}catch(e){
		alert(e);
	}

}


function btn_search_click(event) {

	var param = {
			_sqlName	: "com.getProductList_sel",
			prod_nm : $edt_product.getValue(),
			product1_cd : $cmb_product1.getValue(),
			product2_cd : $cmb_product2.getValue(),
		};

	var opt = {
		reqId : 'getproduct',
		url : 'service::msa.msa060.product.sel.do',
		param : param
	};

	Xwing.request(opt, callback);
}

//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case 'getproduct' :
			$DS_PRODUCT_LIST.setData(res.DS_PRODUCT_LIST.column, res.DS_PRODUCT_LIST.record);

			break;


	}

}

function grd_list_dblclick(event) {
	var idx = event.rowIdx;

	if(type == "S"){
		parent.$edt_prod_nm.setValue($DS_PRODUCT_LIST.getValue(idx,"PROD_NAME"));
		parent.$cmb_product1.setValue($DS_PRODUCT_LIST.getValue(idx, "PROD_CD1"));
		parent._product_change0();
		parent.$cmb_product2.setValue($DS_PRODUCT_LIST.getValue(idx, "PROD_CD2"));
	}else{
		parent.$edt_prod_nm_ins.setValue($DS_PRODUCT_LIST.getValue(idx,"PROD_NAME"));
		parent.prod_id_ins = $DS_PRODUCT_LIST.getValue(idx,"PROD_ID");
		parent.$cmb_product1_ins.setValue($DS_PRODUCT_LIST.getValue(idx, "PROD_CD1"));
		parent.cmb_product1_ins_change();

		setTimeout(function(){
			parent.$cmb_product2_ins.setValue($DS_PRODUCT_LIST.getValue(idx, "PROD_CD2"));
		}, 50);
		//
	}


	parent.Xwing.getDialog("MSA070P2").close();


}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="DS_PRODUCT_LIST">
		<xwing:dataset-column id="PROD_NM1"></xwing:dataset-column>
		<xwing:dataset-column id="PROD_CD1"></xwing:dataset-column>
		<xwing:dataset-column id="PROD_CD2"></xwing:dataset-column>
		<xwing:dataset-column id="PROD_NM2"></xwing:dataset-column>
		<xwing:dataset-column id="PROD_NAME"></xwing:dataset-column>
		<xwing:dataset-column id="PROD_ID"></xwing:dataset-column>
	</xwing:dataset>
</xwing:data>
</head>
<body>
	<xwing:page id="page" title="상담유형업로드" width="640" height="465" scroll="false" load="page_load" left="24" top="24">

			<xwing:panel id="pan_product" left="70" top="10" width="205" height="25" visible="true">

		</xwing:datagrid>

		<xwing:edit id="edit_rowcnt_all" left="588" top="55" width="45" height="25" halign="right" anchor="top right" readonly="true" fontsize="12"></xwing:edit>
	</xwing:page>
</body>
