<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/
function page_load(event) {
	try{
		XwingObject();
		f_codebook_sel();
	}catch(e){
		xwing.Dialog.alert(e);
	}
}

function f_codebook_sel() {

	var param = {
		cmd : "getCodes",
		codeType : "VSS160,VSS170", //VSS160 : Grade등급, VSS170 : Grade평가항목
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}

//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {
	
	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "f_codebook_sel" : 
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			$DS_VSS170.setData(res.VSS170.column, res.VSS170.record);
			$cmb_grade_gubun.setValue(1);
			f_make_gradeInfo();
			break;
	}	
}

function f_make_gradeInfo(){
	var lbl_top = 25, txt_top=15;
	
	for(var i =0; i< $DS_VSS160.size(); i++){
		if(i != 0 ){
			lbl_top += 65;
			txt_top += 65;
		}
		
		var lbl_grade1 = Xwing.createLabel({
			id : 'lbl_grade'+(i+1),
			width : 50,
			height : 28,
			top : lbl_top, 
			left : 20,
			styles : 'label_subtitle',
			valign : 'middle',
			halign : 'right',
			value : 'Grade '+ (i+1)
		});
		
		$grp_grade_info.appendChild(lbl_grade1);
		
		var txt_grade1 = Xwing.createTextArea({
			id : 'txt_grade'+(i+1),
			width : 910,
			height : 50,
			top : txt_top, 
			left : 80,
			styles : 'edit_readonly',
			valign : 'middle',
			halign : 'right',
			readonly : true,
			value : ''
		});
		
		$grp_grade_info.appendChild(txt_grade1);
	}
	
}


function btn_history_click(event) {
	
	//var doc_id = $DS_BANNED_DETAIL.getValue(event.rowIdx, "REC_KEY");
	//var start_time = $DS_BANNED_DETAIL.getValue(event.rowIdx, "START_TIME");
	
	//window.open('../MSA/MSA020P1.xhtml', "loadText", "width=800, height=400, left=170, top=50");
	
	var opt = {
			modal: false,
			resizable: true,
			id : 'MSA020P1',
			url : '../MSA/MSA020P1.xhtml',		
			width : 800,
			height : 425,
			title : "Grade저장이력",
			draggable:true,
			param:{
			}
		};
	
	var dialog = new xwing.Dialog(opt);
	dialog.open();
	
}

var columns = [];
function btn_save_script_click(event) {
	var targetId =  event.source._attr.id;
	var res = $edt_res.getValue();
	
	if(targetId.indexOf("script") > -1){	
		res += " VRS준수율 " + $edt_script.getValue() +  " % " + $DS_GUBUN.getValue($DS_GUBUN.indexOfRow("CODEID", $cmb_gubun_script.getValue()), "CODENAME");
		$edt_script.setValue("");
	}else if(targetId.indexOf("ban") > -1){
		res += " 금칙어 " + $edt_ban.getValue() +  " % " + $DS_GUBUN.getValue($DS_GUBUN.indexOfRow("CODEID", $cmb_gubun_ban.getValue()), "CODENAME");
		$edt_ban.setValue("");
	}else if(targetId.indexOf("cond1") > -1){
		res += " 전월평가점수 " + $edt_ban.getValue() +  " % " + $DS_GUBUN.getValue($DS_GUBUN.indexOfRow("CODEID", $cmb_gubun_ban.getValue()), "CODENAME");
		$edt_cond1.setValue("");
	}else if(targetId.indexOf("and") > -1){
		res += " AND ";
	}else if(targetId.indexOf("or") > -1){
		res += " OR ";
	}else if(targetId.indexOf("open") > -1){
		res += " ( ";
	}else if(targetId.indexOf("close") > -1){
		res += " ) ";
	}
	
	$edt_res.setValue(res);
}

function btn_reset_click(event) {
	$edt_res.setValue("");
}

function btn_register_click(event) {
	
	Xwing.getTextArea("txt_grade"+$cmb_grade_gubun.getValue()).setValue($edt_res.getValue());
	$edt_res.setValue("");
}/*]]>*/</script>

</xwing:data>
