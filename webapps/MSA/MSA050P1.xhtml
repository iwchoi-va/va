<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var type = "";

function page_load(event) {
		XwingObject();
		$DS_PRODUCT2.copyFrom(parent.$DS_PRODUCT);
		$DS_DMBO_TEMP2.copyFrom(parent.$DS_DMBO_TEMP);
		$DS_DMBO.copyFrom(parent.$DS_DMBO_TEMP);
}


function btn_search_click(event) {
	if($cmb_prod.getValue()=='' || $cmb_dmbo.getValue()==''){
		xwing.Dialog.alert('상품과 담보를 선택해 주세요.');
		return;
	}
	
	 var param	= {
			 _sqlName: "msa.msa050.getMentList.sel",
			 prod_cd : $cmb_prod.getValue(),
			 dmbo_cd : $cmb_dmbo.getValue()
	 }

	var opt = {
			reqId: 'f_getMentList',
			url: parent.v_url,
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
	
}

//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case 'f_getMentList' :
			$DS_MENT_LIST2.setData(res.DS_MENT_LIST.column, res.DS_MENT_LIST.record);

			break;


	}

}

function btn_copy_click(event) {
	parent.$DS_MENT_LIST.copyFrom($DS_MENT_LIST2);
	
	parent.Xwing.getDialog("copy_ment").close();
}


/*
 * 조회 영역에서 상품 변경시 담보 코드 change 함수
 * */
function cmb_prod_change(event) {
	
	var v_prod_cd = $cmb_prod.getValue();
	
	if(v_prod_cd == ""){ 
		$DS_DMBO2.copyFrom($DS_DMBO_TEMP2);
		$cmb_dmbo.setValue("");
	}
	else{ 
		$DS_DMBO2.clearData();
		$DS_DMBO2.setData($DS_DMBO_TEMP2.getData("[PROD_CD=='"+v_prod_cd+"']"))};
	
	$DS_DMBO2.insertRow(0, [ "", "","선택" ]);
	
}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="DS_MENT_LIST2">
		<xwing:dataset-column id="MENT_SENT"></xwing:dataset-column>
		<xwing:dataset-column id="MENT_KEYWORD"></xwing:dataset-column>
		<xwing:dataset-column id="USE_YN"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset description="담보코드_조회조건" id="DS_DMBO2">
		<xwing:dataset-column id="PROD_CD"></xwing:dataset-column>
		<xwing:dataset-column id="DMBO_CD"></xwing:dataset-column>
		<xwing:dataset-column id="DMBO_NM"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset description="상품코드_조회조건" id="DS_PRODUCT2">
		<xwing:dataset-column id="PROD_CD"></xwing:dataset-column>
		<xwing:dataset-column id="PROD_NM"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset description="담보코드_조회조건_TEMP" id="DS_DMBO_TEMP2"></xwing:dataset>
</xwing:data>
</head>
<body>
	<xwing:page id="page" title="상담유형업로드" width="670" height="465" scroll="false" load="page_load" left="24" top="24">

			<xwing:label id="lbl_dmbo" value="담보" left="280" top="10" height="25" halign="right" width="60" styles="label_subtitle" visible="true"></xwing:label>

		</xwing:panel>
		<xwing:datagrid id="grd_list" left="3" top="51" width="657" height="359" autofit="true" anchor="all" binddataset="DS_MENT_LIST2" borderwidth="1" borderstyle="solid" emptymessage="조회된 데이터가 없습니다." editsuppress="false" rownum="true" virtual="true" checkbox="false" sortable="true" resizable="true" pageable="false" dblclick="grd_list_dblclick">

			</xwing:datagrid-colgroup>
			<xwing:datagrid-head>
				<xwing:datagrid-row height="30">
					<xwing:datagrid-cell text="필수멘트"></xwing:datagrid-cell>
					<xwing:datagrid-cell text="추출키워드"></xwing:datagrid-cell>
					<xwing:datagrid-cell text="사용여부"></xwing:datagrid-cell>
				</xwing:datagrid-row>
			</xwing:datagrid-head>
			<xwing:datagrid-body>

			<xwing:datagrid-summary>

		</xwing:datagrid>
		<xwing:button id="btn_copy" value="복 사" left="600" top="428" anchor="right bottom" styles="btn_action" width="60" tabindex="4" height="25" iconalign="left" borderwidth="0" shadow="0 0 0 " borderstyle="none" click="btn_copy_click"></xwing:button>
	</xwing:page>
