function btn_vrs_do_click(event) {
	xwing.Dialog.confirm("동일한 작업(2번)은 기존 작업이 모두 완료된 후 실행해 주십시오. 실행 하시겠습니까?", $page.getTitle(), function(e){
	if(!e) return;	
	var sdate = $dpk_sdate2.getValue()+$edt_stime2.getValue();
	var edate = $dpk_edate2.getValue()+$edt_etime2.getValue();
	//var sdate = $dpk_sdate2.getValue();
	//var edate = $dpk_edate2.getValue();
	
	if(sdate == '' || edate == ''){
		xwing.Dialog.alert('1번을 먼저 실행해 주세요.');
		return;
	}
	
	
	var ds = Xwing.createDataset('ds',[],[[]]);
	ds.setData(parent.$DS_SYS020.getColumnInfo(), parent.$DS_SYS020.getData('[CODEID^="03"]'));
	var v_ip = ds.getValue(0, "ETC1"); //첫번째 서버에만 전송
	
	
	$DS_REQUEST_PARAM.setValue(0,"FROM_DATE",sdate);
	$DS_REQUEST_PARAM.setValue(0,"TO_DATE",edate);
	//test
	//v_ip = "127.0.0.1";
	
	
	
	var param = {
			cmd	: "exec"
			,service : 'SVC_COM_007' //vrs parser , split작업
			,SERVER_IP	: v_ip
			,SERVER_PORT	: '5292'
			,SERVER_TIMEOUT	: '300000'
			,XCRON_REQUEST : Xwing.getDataset("DS_REQUEST_PARAM")
			
		};
		
	
	
		var opt = {
			reqId		: "btn_exe_click"
			,url		: "service::cs.xcron.control.exe.do"
			,param		: param
			,indicator	: null
			,showError	: true
		};
		nowDate();
		Xwing.request(opt, callback);
	});
	
}


function nowDate() {
    var now = new Date();
    var nowTime = now.getFullYear() + "년 " + LPAD((now.getMonth()+1), "0", 2) + "월 " + LPAD(now.getDate(), "0", 2) + "일 " 
    			+ LPAD(now.getHours(), "0", 2) + ":" + LPAD(now.getMinutes(), "0", 2) + ":" + LPAD(now.getSeconds(), "0", 2);
    $lbl_time.setValue(nowTime);
}
// *********************************************************************************************************
// Call Back Action
// ********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n'
				+ 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		
		case 'getDelCnt':
			$edt_mng_cnt_0.setValue(res.DS_MNG_CNT.record[0]);
			$edt_sent_cnt_0.setValue(res.DS_SENT_CNT.record[0]);
			$edt_mng_cnt.setValue(res.DS_DEL_MNG_CNT.record[0]);
			$edt_sent_cnt.setValue(res.DS_DEL_SENT_CNT.record[0]);
			//grd_list_click();
			break;
			
		case 'delVRS' :
			xwing.Dialog.alert('삭제되었습니다.');
			btn_search_click();
			break;
		case 'btn_exe_click' :
			xwing.Dialog.alert('완료되었습니다.');
			break;
		case 'getResultCnt':
			$edt_result_cnt1.setValue(res.DS_REM_CNT.record[0]);
			$edt_result_cnt2.setValue(res.DS_TAG_CNT.record[0]);
			$edt_result_cnt3.setValue(res.DS_SPLIT_CNT.record[0]);
			break;
		case 'delSyncCntVRS':
			$edt_tm_mng_cnt.setValue(res.DS_DEL_TM_CNT.record[0]);
			$edt_va_mng_cnt.setValue(res.DS_DEL_VA_CNT.record[0]);
			break;
		case 'delSync' :
			xwing.Dialog.alert('완료되었습니다.');
			btn_del_search_click();
			break;
	}

}


function LPAD(s, c, n) {
	s = s + "";
    if (! s || ! c || s.length >= n) {
        return s;
    }
 
    var max = (n - s.length)/c.length;
    for (var i = 0; i < max; i++) {
        s = c + s;
    }
 
    return s;
}
