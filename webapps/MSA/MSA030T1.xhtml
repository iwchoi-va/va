<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var _url = "service::msa.msa030t1.grademng.do";

function page_load(event) {
	try{
		XwingObject();
		getGradeInfo();
		
		
		$DS_VSS160.copyFrom(parent.$DS_VSS160);
		$DS_VSS170.copyFrom(parent.$DS_VSS170);
		

	}catch(e){
		xwing.Dialog.alert(e);
	}
}

function getGradeInfo(){
	
	var v_param = {
			_sqlName : "msa.msa030p1.getWeight.sel, msa.msa030p1.getScore.sel, msa.msa030p1.getDetail.sel, msa.msa030p1.getExcept.sel",
		};

		var opt = {
			reqId : "getGradeinfo",
			url : _url,
			param : v_param,
			indicator : null,
			showError : true
		};

		Xwing.request(opt, callback);
	
}

//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {
	
	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "setGrade":
			xwing.Dialog.alert("등록이 완료되었습니다.");
			break;
		case "getMaxVersion":
			cur_version = res.DS_VERSION.record[0][0];
			ins_gradeInfo();
			
			break;
		case "getGradeinfo":
			f_weight_makeGrid();f_score_makeGrid();
			
			setTimeout(function(){
			
			var res_dataset = Xwing.createDataset("DS_SEL_RES");
			res_dataset.setData(res.DS_RES_WEIGHT.column, res.DS_RES_WEIGHT.record);
			
			var col_w = $DS_WEIGHT.getColumnInfo();
			for(var i =0; i< col_w.length;i++){
				var idx = res_dataset.indexOfRow("ITEM_CD", col_w[i].split("_")[0]);
				
				if(idx > -1){
					$DS_WEIGHT.setValue(0,col_w[i], res_dataset.getValue(idx,"WEIGHT"));
				}else{
					$DS_WEIGHT.setValue(0,col_w[i], "");
				}
			}
			
			res_dataset.setData(res.DS_RES_SCORE.column, res.DS_RES_SCORE.record);
			var col_s = $DS_SCORE.getColumnInfo();
			
			for(var i =0; i< col_s.length-1;i++){
				var idx = res_dataset.indexOfRow("GRADE", col_s[i].split("_")[1]);
				
				if(idx > -1){
					$DS_SCORE.setValue(0,col_s[i], res_dataset.getValue(idx,"GRADE_SCORE"));
				}else{
					$DS_SCORE.setValue(0,col_s[i], "");
				}
			}
			
			res_dataset.setData(res.DS_RES_DETAIL.column, res.DS_RES_DETAIL.record);
			
			$DS_BAN_COND.clearData();
			$DS_MEN_COND.clearData();
			$DS_TSR_WORK.clearData();
			
			for(var i =0; i< res_dataset.size();i++){
				
				switch(res_dataset.getValue(i,"ITEM_CD")){
					case "02" :
						
						$DS_BAN_COND.addRow();
						$DS_BAN_COND.setValue($DS_BAN_COND.size()-1, "GB_FROM", res_dataset.getValue(i,"ITEM_CNT1"));
						$DS_BAN_COND.setValue($DS_BAN_COND.size()-1, "GB_TO", res_dataset.getValue(i,"ITEM_CNT2"));
						$DS_BAN_COND.setValue($DS_BAN_COND.size()-1, "SCORE", res_dataset.getValue(i,"ITEM_SCORE"));
						break;
					case "06":
						
						$DS_MEN_COND.addRow();
						$DS_MEN_COND.setValue($DS_MEN_COND.size()-1, "GB_FROM", res_dataset.getValue(i,"ITEM_CNT1"));
						$DS_MEN_COND.setValue($DS_MEN_COND.size()-1, "GB_TO", res_dataset.getValue(i,"ITEM_CNT2"));
						$DS_MEN_COND.setValue($DS_MEN_COND.size()-1, "SCORE", res_dataset.getValue(i,"ITEM_SCORE"));
						break;
					case "07" :

						$DS_TSR_WORK.addRow();
						$DS_TSR_WORK.setValue($DS_TSR_WORK.size()-1, "WORK_MONTH", res_dataset.getValue(i,"ITEM_CNT1"));
						$DS_TSR_WORK.setValue($DS_TSR_WORK.size()-1, "GRADE", res_dataset.getValue(i,"ITEM_SCORE"));
						$DS_TSR_WORK.setValue($DS_TSR_WORK.size()-1, "CHG_COMMENT", res_dataset.getValue(i,"REG_COMMENT"));
						break;
				}
			}
			
			$DS_USER.setData(res.DS_RES_USER.column, res.DS_RES_USER.record);
			},300);
			break;
		
	}	
}

function f_weight_makeGrid(){
	
	$DS_WEIGHT.clear();
	var f_column = "<xwing:datagrid-colgroup>";
	var dataGrid_column = "";
	

	for(var i =0; i< $DS_VSS170.size(); i++){
		
		f_column += "<xwing:datagrid-column width='120'></xwing:datagrid-column>";
		var val = $DS_VSS170.getValue(i, "CODEID").split("_");
		dataGrid_column = val[0]+"_WEIGHT";
		$DS_WEIGHT.addColumn(dataGrid_column);
	}
	$DS_WEIGHT.addRow();
	Xwing.getDataGrid('grd_weight_list').setBinddataset('DS_WEIGHT');
		
	f_column += "</xwing:datagrid-colgroup>";
	
	var f_head = "<xwing:datagrid-head>"
	   	   + "<xwing:datagrid-row height='30'>";
	
	for(var i =0; i< $DS_VSS170.size(); i++){
		f_head += "<xwing:datagrid-cell text='"+$DS_VSS170.getValue(i,"CODENAME")+"'></xwing:datagrid-cell>";
	}	   
	
	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";
	
	var f_body = "";
	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>";
	
	for(var i =0; i< $DS_VSS170.size(); i++){
		var val = $DS_VSS170.getValue(i, "CODEID").split("_");
		f_body += "<xwing:datagrid-cell bindcolumn='"+val[0]+"_WEIGHT' suppress='true' halign='center' edittype='edit' mask='score'></xwing:datagrid-cell>";
	}
	
	f_body += "</xwing:datagrid-row>"
    	   +"</xwing:datagrid-body>";
	
	var f_context = f_column + f_head + f_body ;
	
	$grd_weight_list.addContent(f_context, true);

	
}

function f_score_makeGrid(){
	$DS_SCORE.clear();
	var f_column = "<xwing:datagrid-colgroup>";
	var dataGrid_column = "";
		
		for(var i =0; i< $DS_VSS160.size(); i++){
			f_column += "<xwing:datagrid-column width='92'></xwing:datagrid-column>";
			dataGrid_column = "SCORE_"+$DS_VSS160.getValue(i, "CODEID");
			$DS_SCORE.addColumn(dataGrid_column);
		}
		
		$DS_SCORE.addRow();
		$DS_SCORE.setValue(0, "SCORE_"+$DS_VSS160.getValue($DS_VSS160.size()-1, "CODEID"), "그외");
		Xwing.getDataGrid('grd_score_list').setBinddataset('DS_SCORE');
		
		f_column += "</xwing:datagrid-colgroup>";
		
		var f_head = "<xwing:datagrid-head>"
		   	   + "<xwing:datagrid-row height='30'>";
		
		for(var i =0; i< $DS_VSS160.size(); i++){
			f_head += "<xwing:datagrid-cell text='"+$DS_VSS160.getValue(i,"CODENAME")+"'></xwing:datagrid-cell>";
		}	   
		
		f_head += "</xwing:datagrid-row>"
			   + "</xwing:datagrid-head>";
		
		var f_body = "";
		var f_body = "<xwing:datagrid-body>"
			   + "<xwing:datagrid-row>";
		
		for(var i =0; i< $DS_VSS160.size(); i++){
			if(i == $DS_VSS160.size()-1){
				f_body += "<xwing:datagrid-cell bindcolumn='SCORE_"+$DS_VSS160.getValue(i, "CODEID")+"' suppress='true' halign='center'></xwing:datagrid-cell>";
			}else{
				f_body += "<xwing:datagrid-cell bindcolumn='SCORE_"+$DS_VSS160.getValue(i, "CODEID")+"' suppress='true' halign='center' edittype='edit'></xwing:datagrid-cell>";
			}
			
		}
		
		f_body += "</xwing:datagrid-row>"
	    	   +"</xwing:datagrid-body>";
		
		var f_context = f_column + f_head + f_body ;
		
		$grd_score_list.addContent(f_context, true);
		
}

	if(confirm("저장하시겠습니까?")){

		};

function ins_gradeInfo(){
	
	var v_sql = "";
	
	if($DS_RES_WEIGHT.size()>0){
		v_sql += "msa.msa030t1.gradeWeight.ins" + ",";
	}
	
	if($DS_RES_SCORE.size() > 0){
		v_sql += "msa.msa030t1.gradeScore.ins" + ",";
	}
	
	if($DS_RES_DETAIL.size() > 0){
		v_sql += "msa.msa030t1.gradeDetail.ins" + ",";
	}
	
	if($DS_RES_USER.size() > 0){
		v_sql += "msa.msa030t1.gradeUser.ins" + ",";
	}
	
	var v_param = {
			_sqlName : v_sql.slice(0,-1),
			DS_RES_WEIGHT : $DS_RES_WEIGHT,
			DS_RES_SCORE : $DS_RES_SCORE,
			DS_RES_DETAIL : $DS_RES_DETAIL,
			DS_RES_USER : $DS_RES_USER,
			REG_ID : global("G_USER_ID"),
			VERSION : cur_version
		};

		var opt = {
			reqId : "setGrade",
			url : _url,
			param : v_param,
			indicator : null,
			showError : true
		};

		Xwing.request(opt, callback);
}


function chg_insFormat(){
	$DS_RES_WEIGHT.clearData();
	$DS_RES_DETAIL.clearData();
	$DS_RES_SCORE.clearData();
	$DS_RES_USER.clearData();
	
	var col_w = $DS_WEIGHT.getColumnInfo();
	for(var i =0; i< col_w.length; i++){
		if($DS_WEIGHT.getValue(0,col_w[i]) != ''){
			$DS_RES_WEIGHT.addRow();
			$DS_RES_WEIGHT.setValue($DS_RES_WEIGHT.size()-1, "ITEM_CD", col_w[i].split("_")[0]);
			$DS_RES_WEIGHT.setValue($DS_RES_WEIGHT.size()-1, "WEIGHT", $DS_WEIGHT.getValue(0,col_w[i]));
					
			var cond_type = col_w[i].split("_")[0];
			var cond_dataset="";
			
			switch(cond_type){
				case "02":
					cond_dataset = Xwing.getDataset("DS_BAN_COND");
					break;
				case "06":
					cond_dataset = Xwing.getDataset("DS_MEN_COND");
					break;
				default : 
					cond_dataset = "";
					break;
			}
			
			if(cond_dataset != ''){
				for(var j =0; j< cond_dataset.size();j++){
					$DS_RES_DETAIL.addRow();
					$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_CD", cond_type);
					$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_CNT1", cond_dataset.getValue(j,"GB_FROM"));
					$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_CNT2", cond_dataset.getValue(j,"GB_TO"));
					$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_SCORE", cond_dataset.getValue(j,"SCORE"));
					$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "REG_COMMENT", "");
				}
			}	
		}
		
	}
	
	var col_g = $DS_SCORE.getColumnInfo();
	for(var i =0; i< col_g.length; i++){
		if($DS_SCORE.getValue(0,col_g[i]) != ''){
			$DS_RES_SCORE.addRow();
			$DS_RES_SCORE.setValue($DS_RES_SCORE.size()-1, "GRADE", col_g[i].split("_")[1]);
			
			if(i != col_g.length-1) $DS_RES_SCORE.setValue($DS_RES_SCORE.size()-1, "GRADE_SCORE", $DS_SCORE.getValue(0,col_g[i]));
			else $DS_RES_SCORE.setValue($DS_RES_SCORE.size()-1, "GRADE_SCORE", $DS_SCORE.getValue(0,""));
		}
	}

	//근속년수 상담사 기준도 세부항목관리테이블에 같이 들어감
	if($DS_TSR_WORK.size()>0){
		for(var i =0; i< $DS_TSR_WORK.size();i++){
			$DS_RES_DETAIL.addRow();
			$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_CD", "07");
			$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_CNT1", $DS_TSR_WORK.getValue(i,"WORK_MONTH"));
			$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_CNT2", "");
			$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "ITEM_SCORE", $DS_TSR_WORK.getValue(i,"GRADE"));
			$DS_RES_DETAIL.setValue($DS_RES_DETAIL.size()-1, "REG_COMMENT", $DS_TSR_WORK.getValue(i,"CHG_COMMENT"));
		}
	}
	
	//센터별 등급은 별도 테이블로 들어감
	if($DS_USER.size() > 0){
		for(var i =0;i< $DS_USER.size();i++){
			$DS_RES_USER.addRow();
			$DS_RES_USER.setValue($DS_RES_USER.size()-1, "USER_ID", $DS_USER.getValue(i,"USER_ID"));
			$DS_RES_USER.setValue($DS_RES_USER.size()-1, "USER_SCORE", $DS_USER.getValue(i,"GRADE"));
			$DS_RES_USER.setValue($DS_RES_USER.size()-1, "REG_COMMENT", $DS_USER.getValue(i,"CHG_COMMENT"));
		}
	}
	
}

function validation_check(){
	//가중치 설정 항목 합산 계산	
	var col = $DS_WEIGHT.getColumnInfo();
	
	var weight = sum = 0;
	for(var i =0; i< col.length;i++){
		if($DS_WEIGHT.getValue(0, col[i]) != '')
			weight += parseInt($DS_WEIGHT.getValue(0, col[i]));
	}
	
	if(weight != 100){
		xwing.Dialog.alert("항목별 가중치 오류: Grade 가중치 합산은 100이어야 합니다");
		return false;
	}
	
	//Grade별 기준점수 설정
	//특정 Grade의 기준점수를 입력안하면 해당 Grade는 안쓰는 걸로
	var score_flag = 0;
	var score_col = $DS_SCORE.getColumnInfo();
	for(var i =0; i< score_col.length;i++){
		if($DS_SCORE.getValue(0, score_col[i]).length == 0){
			xwing.Dialog.alert("Grade별 기준점수 설정 오류: 기준 점수를 입력해주세요");
			return;
		}
		if($DS_SCORE.getValue(0, score_col[i]) > 100){
			xwing.Dialog.alert("Grade별 기준점수 설정 오류: 기준 점수는 100 이하만 가능합니다");
			return;
		}
		if( 0 < i && i < score_col.length-1){
			if(parseInt($DS_SCORE.getValue(0, score_col[i])) >= parseInt($DS_SCORE.getValue(0, score_col[i-1]))){
				xwing.Dialog.alert("Grade별 기준점수 설정 오류: 각 Grade는 앞선 Grade보다 미만의 점수로 설정해야합니다");
				return;
			}
		}
	}
	
	//세부항목 누락된 부분 검사
	
	//금칙어
	var codeid = $DS_VSS170.getValue($DS_VSS170.indexOfRow("CODEID","02"),"CODEID");
	if($DS_WEIGHT.getValue(0,codeid+"_WEIGHT") != '' || $DS_WEIGHT.getValue(0,codeid+"_WEIGHT") != 0){
		if($DS_BAN_COND.size() == 0){
			xwing.Dialog.alert("금칙어 관리 오류: 금칙어 항목의 세부기준을 설정해주세요.");
			return false;
		}
		
		for(var i =0; i< $DS_BAN_COND.size()-2;i++){
			if(parseInt($DS_BAN_COND.getValue(i, "GB_TO")) != parseInt($DS_BAN_COND.getValue(i+1, "GB_FROM"))){
				xwing.Dialog.alert("금칙어 관리 오류: 금칙어 관리 항목에서 누락된 기준건수가 존재합니다.");
				return false;
			}
		}
	}
	
	//필수멘트관리
	codeid = $DS_VSS170.getValue($DS_VSS170.indexOfRow("CODEID","06"),"CODEID");
	if($DS_WEIGHT.getValue(0,codeid+"_WEIGHT") != '' || $DS_WEIGHT.getValue(0,codeid+"_WEIGHT") != 0){
		if($DS_MEN_COND.size() == 0){
			xwing.Dialog.alert("필수멘트 항목의 세부기준을 설정해주세요.");
			return false;
		}
		
		for(var i =0; i< $DS_MEN_COND.size()-2;i++){
			if(parseInt($DS_MEN_COND.getValue(i, "GB_TO"))+1 != parseInt($DS_MEN_COND.getValue(i+1, "GB_FROM"))){
				xwing.Dialog.alert("필수멘트 관리 항목에서 누락된 기준건수가 존재합니다.");
				return false;
			}
		}
	}
	
	for(var i =0; i< $DS_TSR_WORK.size();i++){
		if($DS_TSR_WORK.getValue(i,"CHG_COMMENT").length == 0){
			xwing.Dialog.alert("TSR근속년수별 등급 오류: 예외 등급을 설정한 사유를 입력해주세요!");
			return false;
		}
	}
	
	for(var i =0; i< $DS_USER.size();i++){
		if($DS_USER.getValue(i,"CHG_COMMENT").length == 0){
			xwing.Dialog.alert("센터별 등급 오류 : 예외 등급을 설정한 사유를 입력해주세요!");
			return false;
		}
	}
	
	return true;

}

function btn_new_click(event) {
	var col_w = $DS_WEIGHT.getColumnInfo();
	for(var i =0; i< col_w.length;i++){
			$DS_WEIGHT.setValue(0,col_w[i], "");
	}
	col_w = $DS_SCORE.getColumnInfo();
	for(var i =0; i< col_w.length;i++){
		$DS_SCORE.setValue(0,col_w[i], "");
	}
	$DS_SCORE.setValue(0,col_w[col_w.length-1], "그외");
	$DS_BAN_COND.clearData();
