<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/// 사진은 hr/hrm130m.xml 에서 등록한 사진이 보임.

var _url = "service::msa.msa030p1.user.info.sel.do";

function page_load(event) {

	XwingObject();

//	$DS_USER.copyFrom(parent.$DS_USER);
	$DS_VSS160.copyFrom(parent.$DS_VSS160);
	$cmb_grade.setValue("1");

	$edit_rowcnt.setValue($DS_USER.size());
}

// ---조회버튼클릭.
function btn_sel_click(event) {

	if($cmb_org2.getValue() == ""){
		xwing.Dialog.alert("센터까지 조회해야합니다.");
		return;
	}
	/*
	if (g_orgValue(2) == "" && Xwing.getEdit("edt_user").getValue() == "") {
		alert("소속3 or 사원명/사번을 입력해 주십시오.");
		return;
	}
*/
	f_search_user();

}

function f_search_user() {
	var v_param = {
		_sqlName : "msa.msa030p1.getUser.sel",
	};

	g_orgToParam("", v_param);

	var opt = {
		reqId : "getList",
		url : _url,
		param : v_param,
		indicator : null,
		showError : true
	};

	Xwing.request(opt, callback);

}

// ---callback
function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : '
				+ res.ResultMessage);
		return;
	}
	switch (reqId) {

	case "getList":
		Xwing.getDataset("DS_LIST").setData(res.DS_USER.column,res.DS_USER.record);

		$edit_rowcnt_all.setValue($DS_LIST.size());


		break;

	}
}

function edt_user_keyup(event) {
	if(event.event.keyCode == '13') {
		btn_sel_click();
	}

}

function btn_save_click(event) {

	for(var i=0; i< $DS_USER.size();i++){
		if($DS_USER.getValue(i,"GRADE") == undefined || $DS_USER.getValue(i,"GRADE") == ""){
			xwing.Dialog.alert("모든 상담사에게 등급을 지정해야합니다.");
			return;
		}
	}

	parent.$DS_USER.appendDataset($DS_USER);
	parent.Xwing.getDialog("MSA030P1").close();
}

function rdo_useyn_change(event) {
	if($rdo_useyn.getValue() =="N"){
		$stc_date.setVisible(true);
		$cal_sdate.setVisible(true);
		$stc_wave.setVisible(true);
		$cal_edate.setVisible(true);
	}else{
		$stc_date.setVisible(false);
		$cal_sdate.setVisible(false);
		$stc_wave.setVisible(false);
		$cal_edate.setVisible(false);
	}
}

function btn_add_click(event) {

	var n_cnt = $grd_list.getCheckedCnt();
	var a_chk = $grd_list.getCheckedIdx();

	//항목추가
	var arrUSER =Xwing.getDataset('DS_USER').getData().concat([]);
	for(var i=0; i< n_cnt; i++){
		arrUSER.push($DS_LIST.getRow(a_chk[i]).concat([]));
		//아래처럼 하면 속도 느림.
		//$DS_USER.addRow();
		//Xwing.getDataset('DS_USER').copyRowFrom($DS_USER.size()-1, "DS_LIST", a_chk[i]);
	}
	$DS_USER.setData($DS_LIST.getColumnInfo(),arrUSER);
	//전체리스트에서 삭제
	for(var i=n_cnt; i> 0; i--){
		$DS_LIST.removeRow(a_chk[i-1]);
	}

	$edit_rowcnt.setValue($DS_USER.size());
	$edit_rowcnt_all.setValue($DS_LIST.size());

}

function btn_del_click(event) {

	var n_cnt = $grd_user.getCheckedCnt();
	var a_chk = $grd_user.getCheckedIdx();

	//전체리스트에항목추가
	var arrLIST =Xwing.getDataset('DS_LIST').getData().concat([]);
	for(var i=0; i< n_cnt; i++){
		arrLIST.push($DS_USER.getRow(a_chk[i]).concat([]));
		//아래처럼 하면 속도 느림.
		//$DS_LIST.addRow();
		//Xwing.getDataset('DS_LIST').copyRowFrom($DS_LIST.size()-1, "DS_USER", a_chk[i]);

	}
	$DS_LIST.setData(arrLIST);
	//항목 삭제
	for(var i=n_cnt; i> 0; i--){
		$DS_USER.removeRow(a_chk[i-1]);
	}

	$edit_rowcnt.setValue($DS_USER.size());
	$edit_rowcnt_all.setValue($DS_LIST.size());
}

function btn_apply_click(event) {
	var grade = $cmb_grade.getValue();
	var reason = $edt_reason.getValue();

	if(grade == null || grade == ""){
		xwing.Dialog.alert("일괄적용할 등급을 선택해주세요");
		return;
	}

	if(reason == null || reason == ""){
		xwing.Dialog.alert("예외등급 설정 사유를 입력해주세요");
		return;
	}

	//$DS_USER.addColumn("CHG_COMMENT");

	for(var i =0; i< $DS_USER.size(); i++){
		$DS_USER.setValue(i, "GRADE", grade);
		$DS_USER.setValue(i, "CHG_COMMENT", reason);
	}


}/*]]>*/</script>
