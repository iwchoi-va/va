<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var result = null;

	try {
		XwingObject();

		// g_createproduct("pan_product", 2, "msa070", "", "전체");

			$btn_save.setVisible(true);
		//}

	} catch (e) {
		xwing.Dialog.alert(e);
	}
}

function init(){
	//$edt_sentence.setValue('');
	$edt_qst_keyword.setValue('');
}

function combo_setting(){
	var param = {
			_sqlName	: "cs.msa.get.scmanage,cs.msa.get.cntr,cs.msa.get.product"
		};
	var opt = {
		reqId : 'getCombo',
		url : v_url,
		param : param
	};
	
	Xwing.request(opt, function(sReqId, oRes, oErr, oXhr) {

		$DS_SCMNG.setData(oRes.DS_SCMNG.column, oRes.DS_SCMNG.record);
		$DS_LCLF.setData($DS_SCMNG.getColumnInfo(),$DS_SCMNG.getData("[TYPE_CD=='L']"));
		//$DS_LCLF.insertRow(0,["","전체"]);
		$cmb_lclf.setValue($DS_LCLF.getValue(9,"CODE_ID")); 
		cmb_lclf_change();
		$DS_CNTR.setData(oRes.DS_CNTR.column, oRes.DS_CNTR.record);
		$DS_CNTR.insertRow(0,["","전체"]);
		$DS_CNTR.insertRow(1,["00000","공통"]);
		$cmb_cntr.setItemindex("0");

		$DS_PRODUCT.setData(oRes.DS_PRODUCT.column, oRes.DS_PRODUCT.record);
		$cmb_product.setItemindex("0");

		btn_search_click();


	});
}


function btn_search_click() {
	$DS_LIST.clearData();
	$DS_MANAGE_LIST.clearData();

	var lclf_cd,sclf_cd,cntr_cd,prod_cd,sentence;
	lclf_cd=$cmb_lclf.getValue();
	sclf_cd=$cmb_sclf.getValue()
	cntr_cd=$cmb_cntr.getValue();
	prod_cd=$cmb_product.getValue();
	sentence = $edt_sentence.getValue();
	
	if(lclf_cd == "" || sclf_cd == "" || prod_cd == ""){
		alert("대분류,소분류,상품값은 필수입니다.");
		return;
	}

	var param = {
		_sqlName : "msa.msa010T2.getVrsSentList.sel"
		,sc_lclf_cd:lclf_cd
		,sc_sclf_cd:sclf_cd
		,cntr_cd:cntr_cd
		,prod_cd:prod_cd
		,sentence:sentence
	};

	var opt = {
		reqId : "btn_search_click",
		url : v_url,
		param : param,
		indicator : null
	};
	Xwing.request(opt, callback);
}


function btn_save_click(event) {
	if ($DS_MANAGE_LIST.size() == 0){
		xwing.Dialog.alert("저장할 데이터가 없습니다.");
		return;
	}
	
	if(confirm("저장하시겠습니까?")){
		manage_list_upd();
	}else{
		return;
	}
}


function manage_list_upd(event) {
	var qst_cd="", qst_focus="", qst_secret="";
	
	
	//$ds_batch.setCoumnInfo($DS_MANAGE_LIST.getColumnInfo());
	//$ds_batch.setData($DS_MANAGE_LIST.getData());
	$ds_batch.copyFrom($DS_MANAGE_LIST);
	
	//chg_id set, suppress 된 체크박스 값 넣어주기.
	for (var i = 0; i < $ds_batch.size(); i++) {
			$ds_batch.setValue(i, "CHG_ID", global("G_USER_ID"));
		if($ds_batch.getValue(i,"QST_KEYWORD_YN") == 'Y'){
			$ds_batch.setValue(i,"QST_KEYWORD",$edt_qst_keyword.getValue());
		}
	}

	var param = {
		_sqlName : "msa.msa010T2.VrsSentList.upd",
		ds_batch : $ds_batch
	};

	var opt = {
		reqId : "manage_list_upd",
		url : v_url,
		param : param,
		indicator : null
	};
	Xwing.request(opt, callback);

}


// *********************************************************************************************************
// Call Back Action
// ********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n'
				+ 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
	case 'btn_search_click':

		$DS_MANAGE_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
		$edit_rowcnt.setValue($DS_MANAGE_LIST.size());
		//grd_list_click();
		break;
		
	case 'manage_list_upd' :
		btn_search_click();
		init();
		break;
	}

}

function cmb_lclf_change(event) {
	$DS_SCLF.clearData();
	var upper_cd = $cmb_lclf.getValue();
	$DS_SCLF.setData($DS_SCMNG.getColumnInfo(), $DS_SCMNG.getData("[UPR_SC_CD=='"+upper_cd+"']"));
	$cmb_sclf.setItemindex("0");
}


function edt_sentence_keyup(event) {
		if(event.event.keyCode == '13') {
			btn_search_click();
	}
}


function chk_keyword_click(event) {
	if($chk_keyword.isChecked()){
		for(var i = 0; i<$DS_MANAGE_LIST.size()-1; i++){
			$DS_MANAGE_LIST.setValue(i,"QST_KEYWORD_YN","Y");
		}
	}else{
		for(var i = 0; i<$DS_MANAGE_LIST.size()-1; i++){
			$DS_MANAGE_LIST.setValue(i,"QST_KEYWORD_YN","N");
		}
	}
}


function chk_except_click(event) {
	if($chk_except.isChecked()){
		for(var i = 0; i<$DS_MANAGE_LIST.size(); i++){
			$DS_MANAGE_LIST.setValue(i,"EXCEPT_YN","Y");
		}
	}else{
		for(var i = 0; i<$DS_MANAGE_LIST.size(); i++){
			$DS_MANAGE_LIST.setValue(i,"EXCEPT_YN","N");
		}
	}
}/*]]>*/</script>
