/* 
 * 우측 멘트리스트에서 하단에 상세로 볼 수 있도록 세팅 
 * */
function f_getMentDetail(row){
	v_mode = "U"; // mode를 update 로 수정함(신규버튼 클릭 시에만 insert 모드로 변경되도록)
	
	if($DS_MENT_INFO.size() > 0) $DS_MENT_INFO.clearData();
	
	$DS_MENT_INFO.setColumnInfo($DS_MENT_LIST.getColumnInfo());
	$DS_MENT_INFO.addRow();
	$DS_MENT_INFO.copyRowFrom(0, $DS_MENT_LIST, row);
}


/*
 * 저장 버튼 클릭 
 * */
function btn_save_click(event) {
	
	var sqlname = "";
	
	if ($DS_MENT_LIST.size() <= 0) {
		sqlname="msa.msa050.setMentList.del";
	}else{
		sqlname="msa.msa050.setMentList.del,msa.msa050.setMentList.ins";
	}
	
	xwing.Dialog.confirm("등록하시겠습니까?", $page.getTitle(),
			function(b) {
				if (!b)
					return false;
				
			 	for(var i = 0; i<$DS_MENT_LIST.size(); i++){
			 		$DS_MENT_LIST.setValue(i,"CHG_ID", global("G_USER_ID"));
			 		$DS_MENT_LIST.setValue(i,"REG_ID", global("G_USER_ID"));
			 		$DS_MENT_LIST.setValue(i,"PROD_CD",selectedProd);	//복사기능때문에 copyFrom 하면서 덮어써짐.
			 		$DS_MENT_LIST.setValue(i,"DMBO_CD",selectedDmbo);	//복사기능때문에
			 	}
			 		
				 var param	= {
							 _sqlName: sqlname,
							 DS_MENT_LIST : $DS_MENT_LIST
							 ,PROD_CD : selectedProd //delete 하기위해
							 ,DMBO_CD : selectedDmbo
				 }
				
				 
				 var opt = {
							reqId: 'f_setMentList',
							url: v_url,
							param: param,
							indicator: null,
							showError: true
				};
			Xwing.request(opt, callback);
	});

}

/*
 * 신규버튼 클릭

function btn_up_click(event) {	
	$DS_MENT_LIST.addRow();
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1, "PROD_CD", selectedProd);
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1, "DMBO_CD", selectedDmbo);
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1,"USE_YN", "Y");
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1,"REG_ID", global("G_USER_ID"));
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1,"REG_DATE", getNow());
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1,"CHG_ID", global("G_USER_NAME")+"("+global("G_USER_ID")+")");
	$DS_MENT_LIST.setValue($DS_MENT_LIST.size()-1,"CHG_DATE", getNow());
}

function btn_down_click(event) {
	var nRow = "";
		nRow = $DS_MENT_LIST.getCursor();
		$DS_MENT_LIST.removeRow(nRow);
}
/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
			alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "f_getDmbo" :
			$DS_PRODUCT.setData(res.DS_PRODUCT.column, res.DS_PRODUCT.record);
			$DS_PRODUCT.insertRow(0, [ "","","", "전체" ]);
			$DS_DMBO_TEMP.setData(res.DS_DMBO.column, res.DS_DMBO.record);
			$DS_DMBO.setData(res.DS_DMBO.column, res.DS_DMBO.record);
			$DS_DMBO.insertRow(0, [ "", "","전체" ]);
			
			
		break;
		case "f_getDmboList" :
			$DS_DMBO_LIST.setData(res.DS_DMBO_LIST.column, res.DS_DMBO_LIST.record);
			$DS_DMBO_LIST.setCursor(selectedRow);
			
			selectedProd = $DS_DMBO_LIST.getValue(selectedRow, "PROD_CD");
			selectedDmbo = $DS_DMBO_LIST.getValue(selectedRow, "DMBO_CD");
			$DS_MENT_INFO.clearData();
			$DS_MENT_INFO.addRow();
			$DS_MENT_INFO.setValue(0, "PROD_NM", $DS_DMBO_LIST.getValue(selectedRow, "PROD_NM"));
			$DS_MENT_INFO.setValue(0, "DMBO_NM", $DS_DMBO_LIST.getValue(selectedRow, "DMBO_NM"));
			
			f_getMentList();
		break;
		case "f_getMentList" :
			$DS_MENT_LIST.setData(res.DS_MENT_LIST.column, res.DS_MENT_LIST.record);
			
			//f_getMentDetail(0);
		break;
		case "f_setMentList" :
			xwing.Dialog.alert("등록되었습니다.");
			
			f_getDmboList();
			f_getMentList();
			break;
		case "f_setMentList_U" :
			xwing.Dialog.alert("수정되었습니다.");
			
			f_getDmboList();
			f_getMentList();
			break;
		case "f_setMentListDel" :
			xwing.Dialog.alert("삭제되었습니다.");
			f_getMentList();
			break;
	}
}

/*
 * 조회 영역에서 상품 변경시 담보 코드 change 함수
 * */
function cmb_prod_change(event) {
	
	var v_prod_cd = $cmb_prod.getValue();
	
	if(v_prod_cd == ""){ 
		$DS_DMBO.copyFrom($DS_DMBO_TEMP);
		$cmb_dmbo.setValue("");
	}
	else{ 
		$DS_DMBO.clearData();
		$DS_DMBO.setData($DS_DMBO_TEMP.getData("[PROD_CD=='"+v_prod_cd+"']"))};
	
	$DS_DMBO.insertRow(0, [ "", "","전체" ]);
	
}

/*
 * 좌측 담보리스트에서 클릭 함수
 * */
function grd_dmbo_list_click(event) {
	
	var p_dmbo_cd = $DS_DMBO_LIST.getValue(event.rowIdx, "DMBO_CD");
	var p_prod_cd = $DS_DMBO_LIST.getValue(event.rowIdx, "PROD_CD");
	
	$DS_MENT_INFO.clearData();
	$DS_MENT_INFO.addRow();
	$DS_MENT_INFO.setValue(0, "PROD_NM", $DS_DMBO_LIST.getValue(event.rowIdx, "PROD_NM"));
	$DS_MENT_INFO.setValue(0, "DMBO_NM", $DS_DMBO_LIST.getValue(event.rowIdx, "DMBO_NM"));
	
	
	
	selectedProd = p_prod_cd;
	selectedDmbo = p_dmbo_cd
	selectedRow = event.rowIdx;
	
	f_getMentList();
	
}

function btn_delete_click(event) {
	var idx = $DS_MENT_LIST.getCursor();
	if(idx == -1){ //선택한거 없을경우
		return;
	}
	
	var mentcd = $DS_MENT_LIST.getValue(idx,"MENT_CD");
	var prodcd = $DS_MENT_LIST.getValue(idx,"PROD_CD");
	var dmbocd = $DS_MENT_LIST.getValue(idx,"DMBO_CD");
	
	var param	= {
			 _sqlName: "msa.msa050.setMentList.one.del",
			 prod_cd : prodcd,
			 dmbo_cd : dmbocd,
			 ment_cd : mentcd
	 }

	var opt = {
			reqId: 'f_setMentListDel',
			url: v_url,
			param: param,
			indicator: null,
			showError: true
	};
	Xwing.request(opt, callback);
}

function btn_copy_popup_click(event) {
	var opt = {
			id : 'copy_ment',
			url : "./MSA050P1.xhtml",

		copy_ment.open();
}/*]]>*/</script>
