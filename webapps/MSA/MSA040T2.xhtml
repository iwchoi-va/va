function btn_refresh_click(event) {

function getRcmmDate(v_flag){
	
	if(typeof(v_flag) == "object"){ //화면에서 버튼 클릭
		v_flag = true; 
	}else{ 
		v_flag = g_isNull(v_flag);
	}
	
	var param = {
			_sqlName	: "msa.msa040T2.getProdMaxDate" //운영마지막변경일시
		};
	var opt = {
		reqId : 'getProdMaxDate',
		url : parent.v_url,
		param : param
	};
	Xwing.request(opt,  function(sReqId, oRes, oErr, oXhr) {
			var prod_max_date = oRes.DS_LIST.record[0]+"";
			$lbl_last_time.setValue(prod_max_date);
			
			if(v_flag){
				var param = {
						_sqlName	: "msa.msa040T2.getReccDate" //운영마지막변경일시 이후의 uat변경일시
						,prod_date : prod_max_date
					};
				var opt = {
					reqId : 'getReccDate',
					url : parent.v_url,
					param : param
				};
				Xwing.request(opt, callback);
			}
	});
	
}

// *********************************************************************************************************
// Call Back Action
// ********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n'
				+ 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case 'getDelCnt':
	
			$edt_mng_cnt.setValue(res.DS_DEL_MNG_CNT.record[0]);
			$edt_sent_cnt.setValue(res.DS_DEL_SENT_CNT.record[0]);
			//grd_list_click();
			break;
			
		case 'delVRS' :
			xwing.Dialog.alert('삭제되었습니다.');
			break;
		case 'getRemCnt' :
			$edt_mng_cnt.setValue(res.DS_MNG_CNT.record[0]);
			$edt_sent_cnt.setValue(res.DS_SENT_CNT.record[0]);
			$edt_rem_cnt1.setValue(res.DS_REM_MNG_CNT.record[0]);
			$edt_rem_cnt2.setValue(res.DS_REM_SENT_CNT.record[0]);
			break;
		case 'btn_exe_click' :
			xwing.Dialog.alert('완료되었습니다.');
			break;
		case 'UpdateUToP' :
			getRemainCount();
			getRcmmDate(false);
			xwing.Dialog.alert('완료되었습니다.');
			
			break;
		case 'getResultCnt':
			$edt_result_cnt1.setValue(res.DS_REM_CNT.record[0]);
			$edt_result_cnt2.setValue(res.DS_TAG_CNT.record[0]);
			$edt_result_cnt3.setValue(res.DS_SPLIT_CNT.record[0]);
			break;
		case 'btn_exe_click' :
			xwing.Dialog.alert('작업이 완료되었습니다. 반영을 확인해주세요.');
			break;
		case 'btn_exe_click2' :
			xwing.Dialog.alert('작업이 완료되었습니다. 반영을 확인해주세요.');
			break;
		case 'btn_exe_click3' :
			btn_refresh_click();
			break;
		/*case 'btn_refresh_click0' :
			xwing.Dialog.alert('코드북 반영이 완료되었습니다.');
			break;	*/
		case 'btn_refresh_click1' :
			xwing.Dialog.alert('작업이 완료되었습니다. 반영을 확인해주세요.');
			break;
		case 'delSyncCntVRS':
			$edt_uat_mng_cnt.setValue(res.DS_DEL_UAT_CNT_1.record[0]);
			$edt_uat_sent_cnt.setValue(res.DS_DEL_UAT_CNT_2.record[0]);
			$edt_va_mng_cnt.setValue(res.DS_DEL_PROD_CNT_1.record[0]);
			$edt_va_sent_cnt.setValue(res.DS_DEL_PROD_CNT_2.record[0]);
			break;
		case 'delSync' :
			xwing.Dialog.alert('완료되었습니다.');
			btn_del_search_click();
			break;	
		case 'getReccDate' :
			$dpk_sdate2.setValue((res.DS_LIST.record[0]+"").substring(0,8));
			$edt_stime2.setValue((res.DS_LIST.record[0]+"").substring(8));
			$dpk_edate2.setValue(g_toDate());
			
			$dpk_del_sdate.setValue((res.DS_LIST.record[0]+"").substring(0,8));
			$edt_del_stime.setValue((res.DS_LIST.record[0]+"").substring(8));
			$dpk_del_edate.setValue(g_toDate());
			
			break;
	}

}
