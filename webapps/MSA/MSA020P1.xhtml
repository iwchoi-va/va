	<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/
/* **********************************************************
 *  Page 로드 시 처음 호출되는 함수  
 *************************************************************/
function page_load(event) {
	
	XwingObject();
	getHistory();
}

/* ***********************************************************
 * 	grade history 가져오는 함수
 *************************************************************/
function getHistory(){
	
	var param = {
			_sqlName: "anl.gradeManagement.history.sel"
		};
	
	var opt = {
			reqId : 'getHistory',
			url : 'service::sqlservice.do',
			param : param,
			indicator : null,
			showError : true
		};
	Xwing.request(opt, callback);		
}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	
	switch (reqId) {
		case "getHistory" :
			$DS_HISTORY.clearData();
			$DS_HISTORY.setData(res.DS_LIST.column, res.DS_LIST.record);
		break;
		
	}
}

/* ***********************************************************
 * 	최근 키워드 정보 가져오는  함수 (from MindsLab DB)
 *************************************************************/
function getKeyword(exKeys){
	var opt = {
			reqId: "sch_keyword_data",
			url: "service::anl.anl100m.getKeywordData.do",
			param: {
				_sqlName:'msa.msa020.getRecomKey.sel',
				channel: 1,
				sdate: parent.$src_sdate.getValue(),
				edate: parent.$src_edate.getValue(),
				limit: 5,
				keyword : exKeys
			},
			indicator: null,
			showError: true
	};

	Xwing.request(opt, callback);	
}

/* **********************************************************
 *  키워드 더블클릭시 선택해주는 함수  
 *************************************************************/
function grd_list_dblclick(event) {
	var v_row_idx = $grd_list.getSelection();
	parent.setKeyword($DS_KEYWORDS.getValue(v_row_idx,"COL"));
	
	Xwing.parent.Xwing.getDialog('recomList').close();
}
/*]]>*/</script>
