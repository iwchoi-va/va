function btn_search_click(event) {
	//var sdate = $dpk_sdate2.getValue()+$edt_stime2.getValue();
	//var edate = $dpk_edate2.getValue()+$edt_etime2.getValue();
	var param = {
			_sqlName	: "msa.msa060T1.getUatMentCount.sel,msa.msa060T1.getProdMentCount.sel"
		};
	var opt = {
		reqId : 'getCnt',
		url : parent.v_url,
		param : param
	};
	Xwing.request(opt, callback);
}

//ment_mng delete, insert
//TEST시 XCRON DATASOURCE 변경
function btn_utp_do_click(event) {
	xwing.Dialog.confirm("필수멘트 반영작업을 실행하시겠습니까?", $page.getTitle(), function(e){
	if(!e) return;
	var v_ip = $ds.getValue(0, "ETC1"); //첫번째 서버에만 전송
	//v_ip = "127.0.0.1";
	var param = {
			cmd	: "exec"
			,service : 'SVC_COM_019' //[UAT -> PROD] 담보별필수멘트 운영이관
			,SERVER_IP	: v_ip
			,SERVER_PORT	: '5292'
			,SERVER_TIMEOUT	: '300000'
		};
		
	
	
		var opt = {
			reqId		: "btn_exe_click"
			,url		: "service::cs.xcron.control.exe.do"
			,param		: param
			,indicator	: null
			,showError	: true
		};

		Xwing.request(opt, callback);
	});
	
}

// *********************************************************************************************************
// Call Back Action
// ********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n'
				+ 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case 'getCnt':
			$edt_uat_cnt.setValue(res.DS_UAT_CNT.record[0]);
			$edt_prod_cnt.setValue(res.DS_PROD_CNT.record[0]);
			break;
		case 'btn_exe_click' :
			xwing.Dialog.alert("반영이 완료되었습니다.\n 다시 조회해서 건수를 확인하세요.");
			//btn_search_click();
			break;
	}

}
