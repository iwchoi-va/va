function getScriptItems(sc_sno,lclf_cd, sclf_cd,cntr_cd,prod_cd) {
	var param = {
		_sqlName : "msa.msa010T1.getVrsManageList.sel"
		,sc_sno:sc_sno
		,sc_lclf_cd:lclf_cd
		,sc_sclf_cd:sclf_cd
		,cntr_cd:cntr_cd
		,prod_cd:prod_cd
	};

	var opt = {
		reqId : "getScriptItems",
		url : v_url,
		param : param,
		indicator : null
	};
	Xwing.request(opt, callback);
}
// *********************************************************************************************************
// Call Back Action
// ********************************************************************************************************/
function callback(reqId, res, err, xhr) {

	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n'
				+ 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
	case 'btn_search_click':

		$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
		//grd_list_click();
		break;
	case 'getScriptItems':
		$DS_MANAGE_ALL_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
		if($cmb_qst.getValue()==''){
			$DS_MANAGE_LIST.copyFrom($DS_MANAGE_ALL_LIST);
		}else{
			$DS_MANAGE_LIST.setData($DS_MANAGE_ALL_LIST.getColumnInfo(), $DS_MANAGE_ALL_LIST.getData("[QST_CD=='"+$cmb_qst.getValue()+"']"));

		}
		cmb_qst_change();
		break;
	case 'getSeq':
		$DS_SEQ.setData(res.DS_LIST.column, res.DS_LIST.record);
		$DS_LIST_INS.clearData();
		$DS_LIST_INS.addRow();
		$DS_LIST_INS.setValue(0, 'CONCEPT_ID', $DS_SEQ.getValue(0, 'SEQ_VAL'));
		$DS_LIST_INS.setValue(0, 'USE_YN', 'Y');
		$DS_LIST_INS.setValue(0, 'REG_ID', global("G_USER_ID"));

		$rdo_use_yn.setValue('Y');

		break;
	case 'delete_all':
		alert("삭제 되었습니다.");
		btn_search_click();
		break;
	case 'delete_sent':
		update_sent();
		break;
	case 'insert_sent':
		alert("저장 되었습니다.");
		btn_search_click();
		break;
	case 'insert_script':

		for (var i = 0; i < $DS_MANAGE_LIST.size(); i++) {
			$DS_MANAGE_LIST.setValue(i, "SCRIPT_ID", $DS_LIST_INS.getValue(0,
					"SCRIPT_ID"));
			$DS_MANAGE_LIST.setValue(i, "CONCEPT_ID", $DS_LIST_INS.getValue(0,
					"CONCEPT_ID"));
			$DS_MANAGE_LIST.setValue(i, "REG_ID", global("G_USER_ID"));
			$DS_MANAGE_LIST.setValue(i, "CHG_ID", global("G_USER_ID"));
			$DS_MANAGE_LIST.setValue(i, "PROD_ID", prod_id_ins);
		}

		insert_sent();
		break;
	case 'update_sent':
		alert("저장 되었습니다.");
		btn_search_click();
		break;
	case 'update_script':
		delete_sent();
		break;
	case 'manage_list_upd':
		alert("저장 되었습니다.");
		btn_search_click();
		break;
	case 'manage_qst_rate_upd':
		alert("적용 되었습니다.");
		btn_search_click();
		break;
	}

}

function manage_list_upd(event) {
	if ($DS_MANAGE_LIST.size() == 0)
		return;

	var qst_cd="", qst_focus="", qst_secret="";
	//chg_id set, suppress 된 체크박스 값 넣어주기.
	for (var i = 0; i < $DS_MANAGE_LIST.size(); i++) {
		$DS_MANAGE_LIST.setValue(i, 'CHG_ID', global("G_USER_ID"));
		if(qst_cd != ""){
			if( qst_cd ==  $DS_MANAGE_LIST.getValue(i,'QST_CD')){
		//		$DS_MANAGE_LIST.setValue(i, 'QST_FOCUS', qst_focus);
				$DS_MANAGE_LIST.setValue(i, 'QST_SECRET', qst_secret);
			}
		}
		qst_cd = $DS_MANAGE_LIST.getValue(i,'QST_CD');
	//	qst_focus=$DS_MANAGE_LIST.getValue(i,'QST_FOCUS');
		qst_secret=$DS_MANAGE_LIST.getValue(i,'QST_SECRET');

	}

	var param = {
		_sqlName : "msa.msa010T1.VrsManageList.upd",
		DS_LIST : $DS_MANAGE_LIST
	};

	var opt = {
		reqId : "manage_list_upd",
		url : v_url,
		param : param,
		indicator : null
	};
	Xwing.request(opt, callback);

}

}

		$DS_MANAGE_LIST.setData($DS_MANAGE_ALL_LIST.getColumnInfo(), $DS_MANAGE_ALL_LIST.getData("[QST_CD=='"+$cmb_qst.getValue()+"']"));
	}
}

function btn_qst_rate_click(event) {
	var lclf = $cmb_lclf.getValue();
	var sclf = $cmb_sclf.getValue();
	var cntr = $cmb_cntr.getValue();
	var prod = $cmb_product.getValue();
	var qst_rate = $edt_qst_rate.getValue();

	if(lclf == ""){
		alert('대분류는 반드시 선택되어야 합니다.');
		return;
	}

	if(cntr == ""){
		alert('센터는 반드시 선택되어야 합니다.');
		return;
	}

	if(qst_rate == "") {
		alert('일괄 적용할 임계치가 없습니다.');
		return;
	}
	if(qst_rate > 100) {
		alert('임계치는 100 이하만 가능합니다.');
		return;
	}

	var param = {
		_sqlName : "msa.msa010T1.VrsManageQstRate.upd,msa.msa010T1.VrsMng.upd",
		LCLF_CD : lclf,
		SCLF_CD : sclf,
		CNTR_CD : cntr,
		PROD_CD : prod,
		CHG_ID : global("G_USER_ID"),
		QST_RATE : qst_rate
	};

	var opt = {
		reqId : "manage_qst_rate_upd",
		url : v_url,
		param : param,
		indicator : null
	};
	Xwing.request(opt, callback);
