<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var _url = "service::msa.msa030t1.grademng.do";
var version = 1;
var sdate = "", edate = "";
function page_load(event) {
	try{
		XwingObject();
		$DS_VSS160.copyFrom(parent.$DS_VSS160);
		$DS_VSS170.copyFrom(parent.$DS_VSS170);
		
		$cal_from_date.setValue(g_addDate("m", -1, g_toDate(), ""));
		$cal_to_date.setValue(g_toDate());
		
		sdate = $cal_from_date.getValue();
		edate = $cal_to_date.getValue();
		
		getGradeList();
		
	}catch(e){
		xwing.Dialog.alert(e);
	}
}

function getGradeList(){
	var v_param = {
			_sqlName : "msa.msa030p2.getGradeList.sel",
			sdate : sdate,
			edate : edate
		};

		var opt = {
			reqId : "getGradeList",
			url : _url,
			param : v_param,
			indicator : null,
			showError : true
		};

		Xwing.request(opt, callback);
}


function getGradeInfo(){

	var v_param = {
			_sqlName : "msa.msa030p1.getWeight.sel, msa.msa030p1.getScore.sel, msa.msa030p1.getDetail.sel, msa.msa030p1.getExcept.sel",
			VERSION : version
		};

		var opt = {
			reqId : "getGradeinfo",
			url : _url,
			param : v_param,
			indicator : null,
			showError : true
		};

		Xwing.request(opt, callback);
	
}


//*********************************************************************************************************
//Call Back Action
//********************************************************************************************************/
function callback(reqId, res, err, xhr) {
	
	if (res.Error != '0') {
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch(reqId) {
		case "getGradeList" : 
			$DS_VER_LIST.setData(res.DS_VER_LIST.column, res.DS_VER_LIST.record);
			
			$DS_VER_LIST.setCursor(0);
			version = $DS_VER_LIST.getValue($DS_VER_LIST.getCursor(), "VERSION");

			f_weight_makeGrid();
		
			
			getGradeInfo();
			
			break;
		case "getGradeinfo":

			$DS_HEAD.setData(res.DS_RES_SCORE.column, res.DS_RES_SCORE.record);
			f_score_makeGrid();
			
			
			var res_dataset = Xwing.createDataset("DS_SEL_RES");
			res_dataset.setData(res.DS_RES_WEIGHT.column, res.DS_RES_WEIGHT.record);
			
			var col_w = $DS_WEIGHT.getColumnInfo();
			for(var i =0; i< col_w.length;i++){
				var idx = res_dataset.indexOfRow("ITEM_CD", col_w[i].split("_")[0]);
				
				if(idx > -1){
					$DS_WEIGHT.setValue(0,col_w[i], res_dataset.getValue(idx,"WEIGHT"));
				}else{
					$DS_WEIGHT.setValue(0,col_w[i], "");
				}
			}
			
			
			res_dataset.setData(res.DS_RES_SCORE.column, res.DS_RES_SCORE.record);
			
			var col_s = $DS_SCORE.getColumnInfo();
			
			for(var i =0; i< col_s.length-1;i++){
				var idx = res_dataset.indexOfRow("GRADE", col_s[i].split("_")[1]);
				
				if(idx > -1){
					$DS_SCORE.setValue(0,col_s[i], res_dataset.getValue(idx,"GRADE_SCORE"));
				}else{
					$DS_SCORE.setValue(0,col_s[i], "");
				}
			}

			res_dataset.setData(res.DS_RES_DETAIL.column, res.DS_RES_DETAIL.record);
			
			$DS_BAN_COND.clearData();
			$DS_MEN_COND.clearData();
			$DS_TSR_WORK.clearData();
			
			for(var i =0; i< res_dataset.size();i++){
				
				switch(res_dataset.getValue(i,"ITEM_CD")){
					case "02" :
						
						$DS_BAN_COND.addRow();
						$DS_BAN_COND.setValue($DS_BAN_COND.size()-1, "GB_FROM", res_dataset.getValue(i,"ITEM_CNT1"));
						$DS_BAN_COND.setValue($DS_BAN_COND.size()-1, "GB_TO", res_dataset.getValue(i,"ITEM_CNT2"));
						$DS_BAN_COND.setValue($DS_BAN_COND.size()-1, "SCORE", res_dataset.getValue(i,"ITEM_SCORE"));
						break;
					case "06":
						
						$DS_MEN_COND.addRow();
						$DS_MEN_COND.setValue($DS_MEN_COND.size()-1, "GB_FROM", res_dataset.getValue(i,"ITEM_CNT1"));
						$DS_MEN_COND.setValue($DS_MEN_COND.size()-1, "GB_TO", res_dataset.getValue(i,"ITEM_CNT2"));
						$DS_MEN_COND.setValue($DS_MEN_COND.size()-1, "SCORE", res_dataset.getValue(i,"ITEM_SCORE"));
						break;
					case "07" :

						$DS_TSR_WORK.addRow();
						$DS_TSR_WORK.setValue($DS_TSR_WORK.size()-1, "WORK_MONTH", res_dataset.getValue(i,"ITEM_CNT1"));
						$DS_TSR_WORK.setValue($DS_TSR_WORK.size()-1, "GRADE", res_dataset.getValue(i,"ITEM_SCORE"));
						$DS_TSR_WORK.setValue($DS_TSR_WORK.size()-1, "CHG_COMMENT", res_dataset.getValue(i,"REG_COMMENT"));
						break;
				}
			}
			
			$DS_USER.setData(res.DS_RES_USER.column, res.DS_RES_USER.record);

			break;
	}	
}


function f_weight_makeGrid(){
	$DS_WEIGHT.clear();

	for(var i =0; i< $DS_VSS170.size(); i++){

		var val = $DS_VSS170.getValue(i, "CODEID").split("_");
		dataGrid_column = val[0]+"_WEIGHT";
		$DS_WEIGHT.addColumn(dataGrid_column);
	}
	$DS_WEIGHT.addRow();
	Xwing.getDataGrid('grd_weight_list').setBinddataset('DS_WEIGHT');
		
	f_column += "</xwing:datagrid-colgroup>";
	
	var f_head = "<xwing:datagrid-head>"
	   	   + "<xwing:datagrid-row height='30'>";
	
	for(var i =0; i< $DS_VSS170.size(); i++){
		f_head += "<xwing:datagrid-cell text='"+$DS_VSS170.getValue(i,"CODENAME")+"'></xwing:datagrid-cell>";
	}	   
	
	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";
	
	var f_body = "";
	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>";
	
	for(var i =0; i< $DS_VSS170.size(); i++){
		var val = $DS_VSS170.getValue(i, "CODEID").split("_");
		f_body += "<xwing:datagrid-cell bindcolumn='"+val[0]+"_WEIGHT' suppress='true' halign='center' edittype='edit'></xwing:datagrid-cell>";
	}
	
	f_body += "</xwing:datagrid-row>"

	$grd_weight_list.addContent(f_context, true);
	
	
}
