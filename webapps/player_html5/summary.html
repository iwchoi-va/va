<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<style>
		html {
			overflow:hidden;
			resize: both;
			height: 100%;
		}
		body {
			background: #434343;
			color: #fafafa;
			font-family: "NanumBarunGothic", Helvetica, Arial, sans-serif;
			font-size: 13px;
			overflow: hidden;
			height: 100%;
			width: 100%;
			margin: 0 auto;
		}
		#container {
			margin: 10px;
			height: 90%;
		}
		#summary{
			overflow: auto;
			height: 89%;
		}
		
		#container .title { display: inline-block;}
		
	
		#container .title  .btn_tuning2 { margin-left: 10px; float: right;}
		.btn_tuning2{cursor: pointer;}
    </style>
	<script type='text/javascript' src='../chart/lib/jquery-1.11.1.js'></script>
	<script type='text/javascript' src='../js/servicemanager.js'></script>
</head>

<body onLoad="calling()">

	<div id="container">
		<div id="title" class="title">
			<font size="3.5" color="#4cc8e9">[ 스크립트 메모 ]</font>
			<!-- 
		    <img class="btn_tuning2" src="../images/icon_typelist.png" onclick="parent.openTunning('04')" alt="tuning" />
		     -->
	    </div>
		<br>
		<div id="summary"></div>
	</div>
	
	
	<script>
		var xhr = new XMLHttpRequest();
	 	function calling(){
	 		//constContext(); //브라우저 우측 메뉴 막아.
			document.body.oncontextmenu = function(){return false;};
	 		
	 		var host = parent.host;
    		var contact_id = parent.contact_id;
    		
    		var url = serviceConfig.url;
    		var field = serviceConfig.sfield;
    		//var param = field.fn_sfield + "=" + field.sfield.replace("value","DOCID");
    		var param = field.fn_exquery + "=" + field.contact_id.replace("value",contact_id) + "&";
    		param += field.fn_rfield + "=SUMMARY,CATE_CD";
    		
    		xhr.onreadystatechange = loader;
    		xhr.open("GET",encodeURI(host + "player.getCall_Info.do?cmd=summary&service_url="+ url.voc+param ),false);  
    		xhr.send(null);
    		
    		var user_grade = parent.user_grade;   			
   			if(user_grade == 'Y'){
				var img = document.createElement('img');
				img.src = "../images/icon_typelist.png";
				img.className = "btn_tuning2";
				img.onclick = function() { parent.openTunning('04'); };
				img.alt="tuning";
				document.getElementById("title").appendChild(img);
			}
	 	}
	 	
	 	function loader(){
   			if(xhr.readyState == 4 && xhr.status == 200) {
	        	result = JSON.parse(xhr.responseText);
	        	var data = result.DATA;
	        	var thetext = data.record[0][0];
	        	var tmp = thetext.replace(/\\\\n/g, '<br \/>');
	        	document.getElementById("summary").innerHTML = tmp;
	        }   			
	   	}
    </script>
</body>
	
</html>
