    <body onLoad="calling()">
     
    
    <table border="0" cellspacing="0" cellpadding="0">
    <colgroup><col width="37%" /><col width="" /></colgroup>
      <tr>
        <td><span class="" aria-hidden="true"></span>고객명</td>
        <td id="regist_no"></td>
      </tr>
      <tr class='even'>
        <td><span class="" aria-hidden="true"></span>계약정보</td>
        <td id="ani"></td>
      </tr>
      <tr>
        <td><span class="" aria-hidden="true"></span>상품명</td>
        <td id="cate"></td>
      </tr>
       <tr>
        <td><span class="" aria-hidden="true"></span>담보</td>
        <td id="tacate"></td>
      </tr>
      <tr>
        <td><span class="" aria-hidden="true"></span>전체보험료</td>
        <td id="tacate"></td>
      </tr>  
      <tr>
        <td><span class="" aria-hidden="true"></span>통화일시</td>
        <td id="date"></td>
      </tr>
    </table>
    
    <script>
   		var xhr = new XMLHttpRequest();
	 	function calling(){
	 		//constContext(); //브라우저 우측 메뉴 막아.
			document.body.oncontextmenu = function(){return false;};
	 		
	 		var host = parent.host;
    		var contact_id = parent.contact_id;
    		var rec_key = parent.rec_key;
    		
    		var url = serviceConfig.url;
    		var field = serviceConfig.sfield;
    		//var param = field.fn_sfield + "=" + field.sfield.replace("value","DOCID");
    		//var param = field.fn_exquery + "=" + field.contact_id.replace("value",contact_id) + "&";
    		//param += field.fn_rfield + "=Date,CUST_NAME,INCALL_NO,OUTCALL_NO,CATE_NM,TACATE_NM";
    		
    		xhr.onreadystatechange = loader;
    		//xhr.open("GET",encodeURI(host + "player.getCall_Info.do?cmd=call_info&rec_key=" + rec_key),false);
    		xhr.open("GET",encodeURI(host + "player.getCall_Info.do?cmd=call_info&rec_key=" + rec_key + "&contact_id="+ contact_id),false);  
    		xhr.send(null);
	 	}
	 	
	 	function loader(){
   			if(xhr.readyState == 4 && xhr.status == 200) {
   				var result = JSON.parse(xhr.responseText);
   				var data = result.DATA;
   				//var column = data.column;
	        	
   				var regist_no =  data.record[0][0];
   				var incall = data.record[0][1];
   				var outcall = data.record[0][2];
   				var cate = data.record[0][3];
   				var date = data.record[0][4];
   				
   				var cate_nm='', tacate_nm='';
   				if(cate!=''){
   					//cate_nm = cate.substring(cate.lastIndexOf("^")+1);
   					var cate_arr1 = cate.split('#');
	   				var cate_arr2 = cate_arr1[0].split('^');
	   				cate_nm = cate_arr2[2];
   				}
   				/*if(tacate!=''){
   					//tacate_nm = tacate.substring(tacate.lastIndexOf("^")+1);
	   				var tacate_arr1 = tacate.split('#');
	   				var tacate_arr2 = tacate_arr1[0].split('^');
	   				tacate_nm = tacate_arr2[2];
   				}*/
	        	//document.getElementById("cust_name").innerHTML = cust_name;
   				document.getElementById("regist_no").innerHTML = regist_no;
	        	document.getElementById("ani").innerHTML = incall.length>0?incall:outcall;
	        	document.getElementById("cate").innerHTML = cate_nm;
	        	//document.getElementById("tacate").innerHTML = tacate_nm;
	        	document.getElementById("date").innerHTML = date.substring(0,4)+"-"+date.substring(4,6)+"-"+date.substring(6,8)+"  "+date.substring(8,10)+":"+date.substring(10,12)+":"+date.substring(12,14)
	        												+ " ("+parent.contact_id+") ";
	        	
	        	$("#cate").attr("title", (cate.replace(/\^/g, ' - ')).replace(/\#/g, '\n'));
	        	//$("#tacate").attr("title", (tacate.replace(/\^/g, ' - ')).replace(/\#/g, '\n'));
	        	//document.getElementById("cate").setAttribute("title", cate.replace(/\#/g, '\\n'));
	        	//document.getElementById("tacate").setAttribute("title", tacate);
   			}
	   	}
    </script>
