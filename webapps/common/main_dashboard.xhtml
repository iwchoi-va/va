/*

function page_load(event) {
	XwingObject();

	//getDashbord();
	page_resize();
	f_codebook_sel();

function f_codebook_sel() {

	var param = {
		cmd : "getCodes",
		codeType : "VSS160",
		useyn : "Y"
	};
	var opt = {
		reqId : "f_codebook_sel",
		url : "service::cs.com.codeutil.do",
		param : param
	};
	Xwing.request(opt, callback);
}

function getDashbord(){
	var dash_auth = top.$DS_GRADEAUTH.getValue(top.$DS_GRADEAUTH.indexOfRow("CODEID",global("G_USER_GRADE")),"ETC3");
	var org1_cd = "";
	var org2_cd = "";
	var org3_cd = "";
	var user_id = "";
	var sel_user_id = global("G_USER_ID");
	
	var v_title="※ 조회 기준 : ";

	switch (dash_auth) {
	case '1':
		org1_cd = '11002';// global("G_ORG1_CD");
		v_title += "TM본부";
		break; //모든 본부 조회
	case '2': //본부의 한 센터 조회
		org1_cd = '11002';// global("G_ORG1_CD");
		org2_cd = global("G_ORG2_CD");
		v_title += "TM"+" > "+global("G_ORG2_NM")+"센터";
		break;
	case '3': //본부 센터, 한팀 조회
		org1_cd = '11002';// global("G_ORG1_CD");
		org2_cd = global("G_ORG2_CD");
		org3_cd = global("G_ORG3_CD");
		v_title += "TM"+" > "+global("G_ORG2_NM")+">"+global("G_ORG3_NM");
		break;
	case '4'://해당 상담사 조회
		org1_cd = '11002';// global("G_ORG1_CD");
		org2_cd = global("G_ORG2_CD");
		org3_cd = global("G_ORG3_CD");
		user_id = global("G_USER_ID");
		v_title += "TM"+" > "+global("G_ORG2_NM")+" > "+global("G_ORG3_NM")+" > "+global("G_USER_NAME")+"("+global("G_USER_ID")+") 상담사";
		break;


	default:
		break;
	}
	$lbl_title.setValue(v_title);

	var param = {
			 analProcess : "DS_PROCESS"
			    , gradeScore : "DS_GRD_SCORE"
			    , scriptScore : "DS_VRS_SCORE"
			    , banScore : "DS_BAN_SCORE"
			    , secScore : "DS_SEC_SCORE"
			    , focScore : "DS_FOC_SCORE"
			    , menScore : "DS_MEN_SCORE"
			    , befScore : "DS_BEF_SCORE"
			    , ORG1_CD : org1_cd
			    , ORG2_CD : org2_cd
			    , ORG3_CD : org3_cd
			    , USER_ID : user_id
			    , SEL_USER_ID : sel_user_id
		};
	var opt = {
			reqId : "getDashbord",
			url : v_url,
			param : param
		};

	Xwing.request(opt, callback);
}

function callback(reqId, res, err, xhr) {
	if (res.Error != '0') { // * Response 시 에러 발생한 경우
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	switch(reqId) {
		case 'f_codebook_sel' :
			$DS_VSS160.setData(res.VSS160.column, res.VSS160.record);
			getDashbord();

		break;

		case "getDashbord":
			$DS_PROCESS.setData(res.DS_PROCESS.column, res.DS_PROCESS.record);
			$DS_GRD_SCORE.setData(res.DS_GRD_SCORE.column, res.DS_GRD_SCORE.record);
			$DS_VRS_SCORE.setData(res.DS_VRS_SCORE.column, res.DS_VRS_SCORE.record);
			$DS_BAN_SCORE.setData(res.DS_BAN_SCORE.column, res.DS_BAN_SCORE.record);
			$DS_SEC_SCORE.setData(res.DS_SEC_SCORE.column, res.DS_SEC_SCORE.record);
			//$DS_FOC_SCORE.setData(res.DS_FOC_SCORE.column, res.DS_FOC_SCORE.record);
			$DS_MEN_SCORE.setData(res.DS_MEN_SCORE.column, res.DS_MEN_SCORE.record);
			$DS_BEF_SCORE.setData(res.DS_BEF_SCORE.column, res.DS_BEF_SCORE.record);

			f_makeGrid();
			f_makeChart();
		break;

	}
}

function f_makeChart(){

function f_makeGrid(){
	var f_column = "<xwing:datagrid-colgroup>"
		 + "<xwing:datagrid-column width='80'></xwing:datagrid-column>"
		 + "<xwing:datagrid-column width='90'></xwing:datagrid-column>"
		 + "<xwing:datagrid-column width='90'></xwing:datagrid-column>"
		 + "<xwing:datagrid-column width='90'></xwing:datagrid-column>";

	//등급 최대개수 10개 가능
	var enableWidth = parseInt(($grd_grade_info.getWidth()-(80+90+90+90))/$DS_VSS160.size());
		 
	for(var i =0; i< $DS_VSS160.size();i++){
		f_column += "<xwing:datagrid-column width='"+enableWidth+"'></xwing:datagrid-column>";
	}

	f_column += "</xwing:datagrid-colgroup>";

	var f_head = "<xwing:datagrid-head>"
	   	   + "<xwing:datagrid-row height='30'>"
	   	   + "<xwing:datagrid-cell text='구분' rowspan='2'></xwing:datagrid-cell>"
	 	   + "<xwing:datagrid-cell text='제출건수' rowspan='2'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell text='미평가건수' rowspan='2'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell text='평가건수' rowspan='2'></xwing:datagrid-cell>"
		   + "<xwing:datagrid-cell text='Grade부여현황' colspan='"+$DS_VSS160.size()+"'></xwing:datagrid-cell>";

	f_head += "</xwing:datagrid-row>";

	f_head += "<xwing:datagrid-row height='30'>";

	for(var i =0; i< $DS_VSS160.size();i++){
		f_head += "<xwing:datagrid-cell text='"+$DS_VSS160.getValue(i, "CODENAME")+"' fontsize='8'></xwing:datagrid-cell>";
	}

	f_head += "</xwing:datagrid-row>"
		   + "</xwing:datagrid-head>";

	var f_body = "<xwing:datagrid-body>"
		   + "<xwing:datagrid-row>";

	var col_info = $DS_PROCESS.getColumnInfo();

	for(var i =1; i< col_info.length;i++){
		f_body += "<xwing:datagrid-cell bindcolumn='"+col_info[i]+"' halign='center'></xwing:datagrid-cell>";
	}


	f_body += "</xwing:datagrid-row>"
	   +"</xwing:datagrid-body>";

	var f_context = f_column + f_head + f_body ;

	$grd_grade_info.addContent(f_context, true);

}
