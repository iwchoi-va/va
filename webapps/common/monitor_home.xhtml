<head>
<meta http-equiv="X-UA-Compatible" content="IE=8;IE=9" />

<script src='../xwing/js/xwing.js' type="text/javascript" charset="UTF-8"></script>
<script src="../js/common.js" type="text/javascript" charset="UTF-8"></script>
<script src="../js/scriptutil.js" type="text/javascript" charset="UTF-8"></script>
<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/

function page_load(event) {
	XwingObject();
	
	f_getCpu();
}

function callback(reqId, res, err, xhr){
	//*------------------------ 이 부분은 공통으로 사용하세요 ----------------------------
//	Xwing.log("================ [ Callback ] ================");
//	Xwing.log("reqID : " + reqId);
//	Xwing.log("res : " + res);
//	Xwing.log("err : " + err);
//	Xwing.log("xhr : " + xhr);
	
	//* Response 시 에러 발생한 경우
	if(res.Error != '0'){
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	//*------------------------ 이 부분은 공통으로 사용하세요 ----------------------------

	switch(reqId) {
	case 'cpu' :
		$ds_cpuTemp.setData(res.CPU_LIST.column, res.CPU_LIST.record);

		f_arrangeCpu();

		break;

	}
}

function f_getCpu() {
	var param = '';
	
    var opt = {
			reqId: 'cpu',
			url: 'service::admin.xwing.host.do',
			param:{
					_serviceName:'SHOW-CPU-STAT',
					COMMAND:'SHOW-CPU-STAT',
					PARAMETER:param
				  },
			indicator: null,
			showError: true
		};
	
   Xwing.request(opt, callback);
   
}

function f_arrangeCpu() {
	var cpu = 0;
	var temp = 0;
	
	for(var i = 0; i < $ds_cpuTemp.size(); i++) {
		cpu += nToken($ds_cpuTemp.getValue(i, 'USE'), '%', 0) * 1;
		temp += $ds_cpuTemp.getValue(i, 'TEMP') * 1;
	}
	
	cpu = cpu / $ds_cpuTemp.size();
	temp = temp / $ds_cpuTemp.size();
	
	$ds_cpuInfo.addRow([cpu, temp]);
	
	
	// 차트 그리기
	f_makeChart();	
}

function f_makeChart() {
	var value0 = $ds_cpuInfo.getValue(0, 'USE');
	var value1 = 100;
	
	$ds_cpu.addRow(['사용률', value0]);
	$ds_cpu.addRow(['Idle',value1-value0]);

	var value2 = round(value0/value1*100, 1);

	Xwing.getWidget('lbl_rate1').setAttribute('value', (isNaN(value2)?0:value2)+'%');
	
	piechart = Xwing.getChart('chart1').draw({
		background : {
			color : ""
		},
		pointlabel : {
			visible : false,
			font : {
				size : 13,
				weight : 'normal'
			}
		},
		series :[{
			gallery :"pie",
			bindcolumn :'value',
			 style : {
                 color : '{0}',
                 width : 0
             }	
		}]
		,legend : {
			visible : false,
	       	  color : [
	       	           "#FF6783", ""
	    	       	  ]
	    	         } 
	});	
}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="ds_cpu">
		<xwing:dataset-column id="key"></xwing:dataset-column>
		<xwing:dataset-column id="value"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="ds_cpuTemp">
		<xwing:dataset-column id="CPU"></xwing:dataset-column>
		<xwing:dataset-column id="USE"></xwing:dataset-column>
		<xwing:dataset-column id="TEMP"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="ds_cpuInfo">
		<xwing:dataset-column id="USE"></xwing:dataset-column>
		<xwing:dataset-column id="TEMP"></xwing:dataset-column>
	</xwing:dataset>
</xwing:data>
</head>
<body>
	<xwing:page id="page" title="New Page" width="1050" height="780" load="page_load">
		<xwing:group id="bg_title" left="0" top="0" bgcolor="#2e3d5c" width="313" height="38" shadow="1 1 5 0 #ababab" opacity="1" borderwidth="0">
			<xwing:label id="label1" left="21" top="10" bgimage="../images/pin.png" width="20" height="20"></xwing:label>
			<xwing:label id="label0" value="센터" left="40" top="8" height="20" width="26" fontstyle="normal" fontweight="bold" fontcolor="#ffffff"></xwing:label>
			<xwing:panel id="pan_org" left="70" top="8" width="147" height="22"></xwing:panel>
			<xwing:button id="btn_sel" value="조회" left="235" top="8" height="20" width="60" styles="btn_search" click="btn_sel_click"></xwing:button>
		</xwing:group>
		<xwing:chart id="chart1" left="432" top="84" width="166" height="170" categorycolumn="key" chartgutter="0 0 0 0" galleryshadow="false" borderstyle="none" borderwidth="1" fontsize="14" fontcolor="#474747" titlefontsize="14" titlemargin="0 0 0 0" enabled="true" visible="true" pointlabel="false" gridbgopacity="0" gridlineopacity="0" legendbgcolor="0" binddataset="ds_cpu"></xwing:chart>
		<xwing:label id="lbl_rate1" value="0.0" styles="lbl_board_content" top="152" left="447" fontsize="34" fontweight="bold" fontcolor="#FF254D" width="137" height="33" halign="center" fontfamily="NanumGothic"></xwing:label>
	</xwing:page>
</body>
</html>
