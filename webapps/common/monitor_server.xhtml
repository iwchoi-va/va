function page_load(event) {
	XwingObject();
	f_getCpu();	// cpu, 온도 정보 가져오기
	f_getNetwork();	// 네트워크 패킷정보 가져오기
//	f_getTrunk();	// 트렁크 상태 가져오기
}

function callback(reqId, res, err, xhr){
	//*------------------------ 이 부분은 공통으로 사용하세요 ----------------------------
//	Xwing.log("================ [ Callback ] ================");
//	Xwing.log("reqID : " + reqId);
//	Xwing.log("res : " + res);
//	Xwing.log("err : " + err);
//	Xwing.log("xhr : " + xhr);
	
	//* Response 시 에러 발생한 경우
	if(res.Error != '0'){
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	//*------------------------ 이 부분은 공통으로 사용하세요 ----------------------------

	switch(reqId) {
	case 'cpu' :
		$ds_cpuTemp.setData(res.CPU_LIST.column, res.CPU_LIST.record);

		// cpu 평균, 온도 최대값 구하기
		f_arrangeCpu();

		break;
		
	case 'memory' :
		$ds_memoryInfo.setData(res.MEM_LIST.column, res.MEM_LIST.record);	

		var total = nToken($ds_memoryInfo.getValue(0, 'TOTAL'), 'Kb', 0);
		var used = nToken($ds_memoryInfo.getValue(0, 'USED'), 'Kb', 0);
		var free = nToken($ds_memoryInfo.getValue(0, 'FREE'), 'Kb', 0);
		
		
		$lbl_mem_total.setValue(f_kbToX(total, 'Mb') + 'Mb');
		$lbl_mem_used.setValue(f_kbToX(used, 'Mb') + 'Mb');
		$lbl_mem_free.setValue(f_kbToX(free, 'Mb') + 'Mb');
		
		// 디스크 사용량
		f_getDisk();

		break;
		
	case 'network' :
		$ds_network.setData(res.NET_LIST.column, res.NET_LIST.record);
		
		var receive = 0;
		var send = 0;

		for(var i = 0; i < $ds_network.size(); i++) {
			if($ds_network.getValue(i, 'IFACE') == 'eth0') {
				receive = $ds_network.getValue(i, 'RX').split('Kb/s')[0] * 1;
				send = $ds_network.getValue(i, 'TX').split('Kb/s')[0] * 1;
				break;
			}
		}

		$lbl_net_receive.setValue(round(receive, 2));
		$lbl_net_send.setValue(round(send, 2));	
		
		break;

	case 'disk' :
		$ds_disk.setData(res.DISK_LIST.column, res.DISK_LIST.record);	
		
		for(var i = 0; i < $ds_disk.size(); i++) {
			if($ds_disk.getValue(i, 'DISK') == '/data') {
				var total = nToken($ds_disk.getValue(i, 'TOTAL'), 'Kb', 0);
				var used = nToken($ds_disk.getValue(i, 'USED'), 'Kb', 0);
				var free = nToken($ds_disk.getValue(i, 'FREE'), 'Kb', 0);
				
				$lbl_disk_total_data.setValue(f_kbToX(total, 'Gb') + 'Gb');
				$lbl_disk_used_data.setValue(f_kbToX(used, 'Gb') + 'Gb');
				$lbl_disk_free_data.setValue(f_kbToX(free, 'Gb') + 'Gb');
				
			}
			
			if($ds_disk.getValue(i, 'DISK') == '/inticube') {
				var total = nToken($ds_disk.getValue(i, 'TOTAL'), 'Kb', 0);
				var used = nToken($ds_disk.getValue(i, 'USED'), 'Kb', 0);
				var free = nToken($ds_disk.getValue(i, 'FREE'), 'Kb', 0);
		
				$lbl_disk_total_data1.setValue(f_kbToX(total, 'Gb') + 'Gb');
				$lbl_disk_used_data1.setValue(f_kbToX(used, 'Gb') + 'Gb');
				$lbl_disk_free_data1.setValue(f_kbToX(free, 'Gb') + 'Gb');
				
			}
		}
		
		// 차트 그리기
		f_makeChart();	
		
		break;
		
		
	case 'trunk' : 
	
	break;
	
	}
}

function f_getCpu() {
	var param = '';

	var opt = {
			reqId: 'cpu',
			url: 'service::admin.xwing.host.do',
			param:{
					_serviceName:'SHOW-CPU-STAT',
					COMMAND:'SHOW-CPU-STAT',
					PARAMETER:param
				  },
			indicator: null,
			showError: true
		};
	
   Xwing.request(opt, callback);
   
}

/*
 * cpu 평균, 온도 최대값 
 */
function f_arrangeCpu() {
	var cpu = 0;
	var temp = 0;

	for(var i = 0; i < $ds_cpuTemp.size(); i++) {
		cpu += nToken($ds_cpuTemp.getValue(i, 'USE'), '%', 0) * 1;
		temp += nToken($ds_cpuTemp.getValue(i, 'TEMP'), '°C', 0) * 1;
	}
	
	temp = temp / $ds_cpuTemp.size();
	$lbl_temperature.setValue(round(temp, 0) + '°C');
	
	cpu = cpu / $ds_cpuTemp.size();
	$ds_cpuInfo.addRow([cpu]);

	// 메모리 정보 가져오기
	f_getMemory();

}

/*
 * 메모리 정보 가져오기
 */

}

/*
 * Kbyte 를 Mbyte 로 변환
 */
function f_kbToX(kbyte, unit) {
	var value = 0;
	var bytevalue = kbyte * 1024;

	if(unit == 'Mb') {
		value = round(bytevalue/1024/1024);
	} else if(unit == 'Gb') {
		value = round(bytevalue/1024/1024/1024, 1);
	}

	return value;
}/*]]>*/</script>
