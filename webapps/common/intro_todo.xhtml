function f_init() {

	var v_yyyymm = ispro.substr(ispro.toDate(), 0, 4) + "."
			+ ispro.substr(ispro.toDate(), 4, 2);
	$lbl_01.setValue(v_yyyymm);	// 해당 월로 라벨 값 변경

// 해당 월의 달력 보기
function f_month_todo_sel() {
	
	var v_yyyymm = $lbl_01.getValue().replace(".", "");	 //yyyy.mm을 yyyymm 형태로 가져옴
	
	Xwing.request({
		reqId : "f_month_todo_sel",
		url : v_url,
		param : {
			_sqlName : "wfm.info.intro_todo.month.sel,wfm.info.intro_todo.error_count.sel",
			p_yyyymm : v_yyyymm,
			p_yyyymm2 : v_yyyymm,
			p_user_id : user_id
		},
		indicator : false
	}, callback);
	
}

// 이전 버튼 클릭
function lbl_prev_click(event) {
	var v_currdate = $lbl_01.getValue().replace(".", "") + "01";
	var v_prevdate = ispro.addDate("m", -1, v_currdate);
	var v_yyyymm = ispro.substr(v_prevdate, 0, 4) + "."
			+ ispro.substr(v_prevdate, 4, 2);
	$lbl_01.setValue(v_yyyymm);
	f_month_todo_sel();
}

// 다음 버튼 클릭
function lbl_next_click(event) {
	var v_currdate = $lbl_01.getValue().replace(".", "") + "01";
	var v_nextdate = ispro.addDate("m", 1, v_currdate);
	var v_yyyymm = ispro.substr(v_nextdate, 0, 4) + "."
			+ ispro.substr(v_nextdate, 4, 2);

	f_month_todo_sel();

// * CallBack Event
// *〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓〓
function callback(reqId, res, err, xhr) {
	if (res.Error != '0') {
		
		xwing.Dialog.alert('ResultCode : ' + res.ResultCode + '\n\n'
				+ 'ResultMessage : ' + res.ResultMessage);
		return;
	}
	switch (reqId) {

	case "f_month_todo_sel":
		$DS_HOLIDAY_INFO.setData(res.DS_HOLIDAY_INFO.column, res.DS_HOLIDAY_INFO.record);
		
		$DS_ERROR_COUNT.setData(res.DS_ERROR_COUNT.column, res.DS_ERROR_COUNT.record);

		f_calender_init();
		break;
		
	case "common_lbl_cont_click":		
		$DS_TODO_LIST.setData(res.DS_TODO_LIST.column, res.DS_TODO_LIST.record);
	
		errorCount($DS_TODO_LIST);	//에러 개수 카운트 함수 호출
		
		break;
	}
}


//달력 초기화 함수
function f_calender_init() {
	
	//달력  초기화
	for ( var x = 0; x < 6; x++) {
		for ( var y = 0; y < 7; y++) {
			var v_obj = eval("$lbl_date_" + x + "" + y);
			var v_obj2 = eval("$lbl_cont_" + x + "" + y);
			var v_obj3 = eval("$lbl_cont_" + x + "" + y+"_1");
			
			v_obj.setFontcolor("");
			
			v_obj.setValue("");
			v_obj2.setValue("");
			v_obj3.setValue("");
			
			v_obj2.setBgimage("");
			v_obj3.setBgimage("");
	
		}
	}
	
	// 달력 그리기
	for ( var i = 0, x = 0, y = 0; i < $DS_HOLIDAY_INFO.size(); i++) {
		
		if ($DS_HOLIDAY_INFO.getValue(i, "WEEK1") == 0 && i > 0) {
			x++;
		}
		
		y = $DS_HOLIDAY_INFO.getValue(i, "WEEK1");
		var v_date = $DS_HOLIDAY_INFO.getValue(i, "SOLAR");
		var v_day = ispro.substr(v_date, 6, 2);
		var v_week1 = $DS_HOLIDAY_INFO.getValue(i, "WEEK1");
		var v_holiday1 = $DS_HOLIDAY_INFO.getValue(i, "HOLIDAY1");
		var v_holiday2 = $DS_HOLIDAY_INFO.getValue(i, "HOLIDAY2");
		var v_color = "";

		if (v_week1 == "0") {
			v_color = "#ff0000";	// 일요일이면 빨간색
		} else if (v_week1 == "6") {
			v_color = "#0000ff";	// 토요일이면 파란색
		} else {
			v_color = "";			// 평일이면 검은색
		}
		
		if (!ispro.isEmpty(v_holiday1) || !ispro.isEmpty(v_holiday2)) {
			v_color = "#ff0000";
		}

		var v_obj = eval("$lbl_date_" + x + "" + y);
		v_obj.setValue(v_day);
		v_obj.setFontcolor(v_color);
		
		var ds_error_count = $DS_ERROR_COUNT;	
		var v_filter 	= "[evt_date == '"+v_date+"']";
		var err_arr = ds_error_count.getData(v_filter);	// 해당 날짜를 가지고 있는 데이터 배열로 추출.
		var critical_err_cnt = 0;
		var warning_err_cnt = 0;
		
		if(err_arr.length > 0)
		{			
			for(var j=0; j < err_arr.length ; j++)
			{
				if(err_arr[j][2]== '1' || err_arr[j][2]== '2')	//장애 레벨이 critical 이나 major 인 경우
					critical_err_cnt += err_arr[j][1]*1;
				else if(err_arr[j][2] == '3' || err_arr[j][2] == '4' || err_arr[j][2] == '5')	//장애 레벨이 그 이외인 경우
					warning_err_cnt += err_arr[j][1]*1;
			}

			if(critical_err_cnt > 100)	// 중요 장애가 100건 이상이면 건수를 99+로 변경
				critical_err_cnt = '99+';

			else if (warning_err_cnt > 100) // 중요 장애가 100건 이상이면 건수를 99+로 변경
				warning_err_cnt = '99+';

			
			var v_obj2 = eval("$lbl_cont_" + x + "" + y);
			var v_obj3 = eval("$lbl_cont_" + x + "" + y+"_1");
			

			if(critical_err_cnt > 0 || critical_err_cnt == '99+')	//중요 장애 건수가 1건이상 있을때
			{
				v_obj2.setValue(critical_err_cnt);
				var imgUrl1="../images/icon_important.png";
				v_obj2.setBgimage(imgUrl1);
				v_obj2.setBgimagealign("center center");
				v_obj2.setFontcolor('#ffffff');
			}
			
			if(warning_err_cnt > 0 || warning_err_cnt == '99+')	// 일반 장애 건수가 1건이상 있을때
			{
				v_obj3.setValue(warning_err_cnt);
				var imgUrl2="../images/icon_alram.png";
				v_obj3.setBgimage(imgUrl2);
				v_obj3.setBgimagealign("center center");
			}
		}
	}
}

//레벨 컬럼의 expr
function lv_cell_expr(cellObj, rowIdx) {
	
	var opt;
	var v_status_cd = $DS_TODO_LIST.getValue(rowIdx, "evt_level");
	opt = {};
	opt['bgimage'] = g_decode(v_status_cd	//레벨에 따라서 배경 이미지 변경
			, 1, "../cm_admin/images/radio_icon_red_16x16.png"
			, 2, "../cm_admin/images/radio_icon_blue_16x16.png"
			, 3, "../cm_admin/images/radio_icon_orange_16x16.png"
			, 4, "../cm_admin/images/radio_icon_yellow_16x16.png"
			, 5, "../cm_admin/images/radio_icon_green_16x16.png");
	
	opt['bgimagerepeat']='no-repeat';	// 배경 이미지 리핏 x 
	opt['bgimagealign']='center center';	//배경 이미지 가운데로 정렬
	
	
	if (opt) {
		return opt;
	}

	$DS_TODO_LIST.getValue(rowIdx, "evt_level");
}

//공통 데이터 그리드 expr
function datagrid_cell_expr(cellObj,rowIdx) {

	var opt;
	opt = {};
	
	
	
	//장애 해제 시간이 없는 경우 테이블 색을 회색으로 변경
	if($DS_TODO_LIST.getValue(rowIdx, "evt_clear_time")==""){	
		opt['bgcolor']='#c0c0c0';		
	}

	if (opt) {
		return opt;
	}
}


// 장애 개수 카운트
function errorCount(cellObj){
	
	// 카운트 할 변수 선언
	var critical_cnt = 0;
	var major_cnt = 0;
	var minor_cnt = 0;
	var warning_cnt = 0;
	var inform_cnt = 0;
		
	for(var i=0; i < cellObj.size(); i++)
	{
		if('1' == cellObj.getValue(i ,'evt_level'))	//매우 심각
			critical_cnt++;
		else if('2' == cellObj.getValue(i ,'evt_level'))	//심각
			major_cnt++;
		else if('3' == cellObj.getValue(i ,'evt_level'))	// 보통
			minor_cnt++;
		else if('4' == cellObj.getValue(i ,'evt_level'))	// 경고
			warning_cnt++;
		else if('5' == cellObj.getValue(i ,'evt_level'))	// 알림
			inform_cnt++;
	}	
	
	//--- 각각의 레벨별 집계 라벨을 count한 값으로 변경
	Xwing.getLabel('lbl_critical_cnt').setAttribute('value',critical_cnt);
	Xwing.getLabel('lbl_major_cnt').setAttribute('value',major_cnt);
	Xwing.getLabel('lbl_minor_cnt').setAttribute('value',minor_cnt);
	Xwing.getLabel('lbl_warning_cnt').setAttribute('value',warning_cnt);
	Xwing.getLabel('lbl_inform_cnt').setAttribute('value',inform_cnt);
	
}
