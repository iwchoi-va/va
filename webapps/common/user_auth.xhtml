<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:xwing="xwing.net">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=8;IE=9" />
<meta http-equiv="Content-Type" content="text/html;charset=UTF-8"></meta>
<style type="css/text">
	 #pan_word_cloud svg{ margin:0 auto; }
	</style>
<script src="../xwing/js/xwing.js" type="text/javascript" charset="UTF-8"></script>
<script src="../js/common.js" type="text/javascript" charset="UTF-8"></script>
<script src="../js/scriptutil.js" type="text/javascript" charset="UTF-8"></script>
<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/
/* **********************************************************
 *  Page 로드 시 처음 호출되는 함수  
 *************************************************************/
function page_load(event) {
	
	XwingObject();
	
	f_getCodes();
}

function f_getCodes() {
	
	var param	= {			
			cmd : "getCodes",
			codeType : "SYS011",
			useyn : "Y"
	};

	var opt 	= { 
			
			reqId: "GETCODES",
			url: "service::cs.com.codeutil.do",
			param: param,
			indicator : false
	};
	
	Xwing.request(opt, callback);	
}

/* ***********************************************************
 * 	콜백  함수 
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case "GETCODES" :

			$DS_SYS011.setData(res.SYS011.column, res.SYS011.record);
			
			var auth_cd = Xwing.param.auth_cd;
			if (auth_cd != ""){
				var authTemp = auth_cd.split(',');
				for(var i=0; i< authTemp.length; i++){
					var nRow = $DS_SYS011.indexOfRow('CODEID',authTemp[i]);
					if(nRow > -1){
						$grd_list.setChecking(nRow);
					}				
				}
			}
		break;		
	}
}

function btn_select_click(event) {
	var dsName = Xwing.param.dsName;
	var v_authority = "";
	var v_authority_nm = "";
	var n_cnt = $grd_list.getCheckedCnt();
	var a_chk = $grd_list.getCheckedIdx();
	
	for(var i=0; i< n_cnt; i++){		
		v_authority += ","+ $DS_SYS011.getValue(a_chk[i], "CODEID");
		v_authority_nm += ","+ $DS_SYS011.getValue(a_chk[i], "CODENAME");
	}
	//parent.Xwing.getDataset(dsName).addRow([g_substr(v_authority, 1), g_substr(v_authority_nm, 1)]);
	parent.Xwing.getDataset(dsName).setValue(0,"AUTH_CD",g_substr(v_authority, 1));
	//alert(g_substr(v_authority_nm, 1));
	parent.Xwing.getDialog("user_auth").close();
}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="DS_SYS011">
		<xwing:dataset-column id="CODEID"></xwing:dataset-column>
		<xwing:dataset-column id="CODENAME"></xwing:dataset-column>
	</xwing:dataset>
</xwing:data>
</head>
<body>
	<xwing:page id="page" title="rcm100" width="230" height="270" scroll="false" left="24" load="page_load" top="24" unload="page_unload">
		<xwing:label id="label_title" value="권한그룹(SYS011)" left="20" top="20" width="180" height="20" icon="../images/icon_page_title.png" fontweight="bold"></xwing:label>
		<xwing:datagrid id="grd_list" left="20" top="50" width="191" height="200" anchor="all" binddataset="DS_SYS011" rownum="false" checkbox="true">
			<xwing:datagrid-colgroup>
				<xwing:datagrid-column width="167"></xwing:datagrid-column>
			</xwing:datagrid-colgroup>
			<xwing:datagrid-head>
				<xwing:datagrid-row>
					<xwing:datagrid-cell text="권한그룹"></xwing:datagrid-cell>
				</xwing:datagrid-row>
			</xwing:datagrid-head>
			<xwing:datagrid-body>
				<xwing:datagrid-row>
					<xwing:datagrid-cell bindcolumn="CODENAME" halign="center"></xwing:datagrid-cell>
				</xwing:datagrid-row>
			</xwing:datagrid-body>
		</xwing:datagrid>
		<xwing:button id="btn_select" value="선택" left="163" top="25" height="20" width="48" styles="btn_action" click="btn_select_click"></xwing:button>
	</xwing:page>
</body>
</html>
