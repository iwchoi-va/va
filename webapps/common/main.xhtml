	this.getLabelWidth = function(string) {
		var str = new String(string);
		str = str.replace(/ /g, "a");
		var eng = str.replace(/[^\w]*/g, "");
		var kor = str.replace(/\w*/g, "");
		var eng_size = 8.5;
		var kor_size = 11.5;
		var result = (eng.length * eng_size) + (kor.length * kor_size) + 30;
		// return result;
		return 152;
	};
	this.btnLeftClick = function() {
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			if (TAB_OBJECT[i].getId() == CURRENT_CURSOR.getId()) {
				if (i > 0) {
					that.setCursor((TAB_OBJECT[i - 1]));
					break;
				}
			}
		}
	};
	this.btnRightClick = function() {
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			if (TAB_OBJECT[i].getId() == CURRENT_CURSOR.getId()) {
				if (TAB_OBJECT.length - 1 > i) {
					that.setCursor(TAB_OBJECT[~~i + 1]);
					break;
				}
			}
		}
	};
	this.addTab = function(label, url) {
		_load_val = false;
		var idx = $DS_MENU.indexOfRow("CAPTION", label);
		$lbl_summary.setVisible(false);
		for (var i = 0; i < TAB_OBJECT.length; i++) {

			var v_tab_label = label;

			if (label.length > 9) {
				v_tab_label = v_tab_label.substr(0, 9) + "..";
			}

			if (TAB_OBJECT[i].getValue() == v_tab_label) {

				// if (TAB_OBJECT[i].getValue() == label) {
				if (eval("$" + TAB_OBJECT[i].getId() + "_view.getUrl()") == url) {
					//_load_val = true;
					this.setCursor(TAB_OBJECT[i]);
					return false;
				}
			}
		}

		if (MAX_TAB <= TAB_OBJECT.length) {
			alert("더이상 탭을 열 수 없습니다.");
			return false;
		}
		var tabLeft = CURRENT_TAB == 0 ? 0 : TAB_OBJECT[TAB_OBJECT.length - 1]
				.getLeft()
				+ TAB_OBJECT[0].getWidth() + 2;
		var tabWidth = this.getLabelWidth(label);
		var tabId = '';
		if (_hidden_val) { // 숨김파일만(현재, 녹취리스트, 상담사별 스트레스)
			$DS_HIDDEN.addRow();
			$DS_HIDDEN.setValue($DS_HIDDEN.size() - 1, "tab_id", (url
					.split('/')[1]).split('.')[0]);
			$DS_HIDDEN.setValue($DS_HIDDEN.size() - 1, "label", label);
			tabId = "tab" + (CURRENT_TAB++) + "_"
					+ ((url.split('/')[1]).split('.')[0]);
			_hidden_val = false;
		} else { // 기존
			tabId = "tab" + (CURRENT_TAB++) + "_"
					+ ($DS_MENU.getValue(idx, "ID") || "default");
		}
		
		var that = this;

		var v_text_label = label;
		if (label.length > 9) {
			v_text_label = v_text_label.substr(0, 9) + "..";

			opt = {
				width : 156,
				height : 31,
				id : tabId,
				left : tabLeft,
				top : 0,
				halign : "center",
				value : v_text_label,
				tooltiptext : label,
				styles : "tab",
				cursor : "pointer",
				click : function(e) {
					that.tabOnclick(e.source);
				}
			};
		} else {
			opt = {
				width : 156,
				height : 31,
				id : tabId,
				left : tabLeft,
				top : 0,
				halign : "center",
				value : label,
				styles : "tab",
				cursor : "pointer",
				click : function(e) {
					that.tabOnclick(e.source);
				}
			};
		}

		obj = Xwing.createLabel(opt);
		_$TAB_MENU.appendChild(obj);
		eval("$" + tabId + " = Xwing.getLabel(tabId)");
		this.addView(eval("$" + tabId), url);
		this.addCloseBtn(eval("$" + tabId));
		if (CURRENT_CURSOR != null)
			this.setBluer(CURRENT_CURSOR);
		this.setCursor((CURRENT_CURSOR = eval("$" + tabId)));
		TAB_OBJECT.push(CURRENT_CURSOR);
		this.setPosition();

		// $lbl_navigation.setValue(label); //임시

		opt = {

			height : 10,
			id : tab.getId() + "_close",
			left : tab.getLeft() + tab.getWidth() - 24,
			top : 10,
			bgimage : "../images/tab_close.png",
			cursor : "pointer",
			click : function(e) {
				that.tabCloseOnclick(e.source);
			}
		};
		obj = Xwing.createLabel(opt);
		if (CURRENT_TAB == 1)
			obj.setVisible(false);
		_$TAB_MENU.appendChild(obj);
		eval("$" + obj.getId() + " = Xwing.getLabel(obj.getId())");
	};

		// var that = this;
		opt = {
			width : Object.getWidth(),
			height : Object.getHeight() - 28, // top만큼 빼야 메인본문 높이가 꽉참

			id : tab.getId() + "_view",
			left : 0,
			top : 28,
			bgcolor : "#ffffff", // #e7ebee 배경색 변경
			url : url,
			anchor : "all",
			shadow : "#A7BACE 0 -1 0 0"
		};
		obj = Xwing.createPanel(opt);
		Object.appendChild(obj);
		(eval("$" + obj.getId() + " = Xwing.getLabel(obj.getId())"))
				.setAnchor("all");
	};
	this.setCursor = function(tab) {
		this.setBluer(CURRENT_CURSOR);
		CURRENT_CURSOR = tab;
		tab.setStyles("tab_select");
		tab.setBgimage("../images/btn_tab_on.png");
		// tab.setBgimageedge("../images/tab_edge_on.png");
		eval("$" + tab.getId()
				+ "_close.setBgimage(\"../images/tab_close_on.png\")");
		eval("$" + tab.getId() + "_view.setVisible(true)");
		this.checkViewSize(tab);
		this.setPosition();
		// 데이터셋 커서와 동기화.
		for (var i = 0; i < $DS_MENU.size(); i++) {
			if ((tab.getId().split("_")[1]) == $DS_MENU.getValue(i, "ID")) {
				$DS_MENU.setCursor(i);

				// if($DS_MENU.getValue(i, "URL")=='MSU/MSU005.xhtml')
				// btn_reload_click(); //임시추가
			}
		}

		var idx = $DS_HIDDEN.indexOfRow('tab_id', tab.getId().split("_")[1]);
		if (idx != -1) {
			$lbl_navigation.setValue($DS_HIDDEN.getValue(idx, 'label'));
		}
		/*
		 * if(_hidden_val){ $lbl_navigation.setValue(_label); _hidden_val =
		 * false; _label = ''; } else
		 */
		else
			this.navigation(tab.getId().split("_")[1]);

		var row = Xwing.getDataset('DS_FIX').indexOfRow("id",
				tab.getId() + "_view");
		if (row != -1) {
			// if(fix_tab.indexOf(tab.getId()+"_view") != -1){
			fixChannel(Xwing.getDataset('DS_FIX').getValue(idx, "channel"));
			// $pan_disabled.setVisible(true); //tab 이동/생성시 채널 fix설정된 화면 여부 확인 후
			// fix
		} else {
			// $pan_disabled.setVisible(false); //tab 이동/생성시 채널 fix 안되게 초기화
		}

	};
	this.setBluer = function(tab) {
		tab.setStyles("tab");
		tab.setBgimage("../images/btn_tab_off.png");
		// tab.setBgimageedge("../images/tab_edge.png");
		eval("$" + tab.getId()
				+ "_close.setBgimage(\"../images/tab_close.png\")");
		eval("$" + tab.getId() + "_view.setVisible(false)");
	};
	this.clearTab = function() {
		var batch = [];
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			if (i != 0) {
				var tabWidget = TAB_OBJECT[i];
				tabWidget.remove();
				eval("$" + tabWidget.getId() + "_close.remove()");
				eval("$" + tabWidget.getId() + "_view.remove()");
				continue;
			}
			batch.push(TAB_OBJECT[i]);
		}
		TAB_OBJECT = batch;
		this.setCursor(TAB_OBJECT[0]);
		this.setPosition();
	};
	this.tabRemove = function(tab) {
		
		var _load_val = false; // child load 완료여부
		var _menuId = ""; // child ID
		var _parameter = null; // 검색할 키워드
		var _hidden_val = false; // 숨김화면 여부
		var _label = ""; // 숨김화면 타이틀
		
		
		var v_position = 0;
		var batch = [];
		var before = null;
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			if (CURRENT_CURSOR != tab)
				break;
			if (tab.getId() == TAB_OBJECT[i].getId()) {
				this.setCursor(TAB_OBJECT[i - 1]);
			}
		}
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			if (TAB_OBJECT[i].getId() == tab.getId()) {
				v_position = (i - 1);
				var tabWidget = TAB_OBJECT[i];
				tabWidget.remove();
				eval("$" + tabWidget.getId() + "_close.remove()");
				eval("$" + tabWidget.getId() + "_view.remove()");
				continue;
			}
			batch.push(TAB_OBJECT[i]);
		}
		TAB_OBJECT = batch;
		this.setPosition();
		this.removePosition(v_position);

	};
	this.removePosition = function(v_position) {
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			this.btnLeftClick();
		}

		for (var i = 0; i < v_position; i++) {
			this.btnRightClick();
		}

	};
	this.setPosition = function() {
		for (var i = 0; i < TAB_OBJECT.length; i++) {
			if (i == 0) {
				TAB_OBJECT[i].setAttribute('left', 0);
				eval("$"
						+ TAB_OBJECT[i].getId()
						+ "_close.setAttribute('left', TAB_OBJECT[i].getLeft() + TAB_OBJECT[i].getWidth() - 24)");
				continue;
			}
			TAB_OBJECT[i].setAttribute('left', TAB_OBJECT[i - 1].getLeft()
					+ TAB_OBJECT[i - 1].getWidth() + 1);
			eval("$"
					+ TAB_OBJECT[i].getId()
					+ "_close.setAttribute('left', TAB_OBJECT[i].getLeft() + TAB_OBJECT[i].getWidth() - 24)");
		}
	};
	this.tabOnclick = function(tab) {
		this.setCursor(tab);
	};
	this.tabCloseOnclick = function(tab) {
		this.tabRemove(eval("$" + (tab.getId().replace("_close", ""))));
	};
	this.openTab = function() {
		return TAB_OBJECT.length;
	};
	this.navigation = function(sMenuId) {
		if (sMenuId == "default") {
			$lbl_navigation.setValue("My홈");
			$lbl_summary.setVisible(false);
		} else {
			var navi = "";
			var idx = 0;
			$lbl_navigation.setWidth(470);
			$lbl_summary.setVisible(false);

			var clickMenuIdx = "";
			if(idx == 0){ clickMenuIdx=$DS_MENU.indexOfRow("ID", sMenuId); }
			while (true) {
				idx = $DS_MENU.indexOfRow("ID", sMenuId);
				var parent_id = $DS_MENU.getValue(idx, "PARENT_ID");
				var caption = g_nvl($DS_MENU.getValue(idx, "CAPTION"), "");
				if (g_isEmpty(parent_id) || g_isNull(parent_id)) {
					break;
				} else {
					sMenuId = parent_id;
				}
				navi = caption + ">" + navi;
			}
			$lbl_navigation.setValue(g_substr(navi, 0, navi.length - 1));
			//summary 제공
			var summary = g_nvl($DS_MENU.getValue(clickMenuIdx, "SUMMARY"), "");
			if(summary != ""){
				$lbl_navigation.setWidth($lbl_navigation.getValue().length*13);
				$lbl_summary.setValue(summary);
				$lbl_summary.setLeft($lbl_navigation.getWidth()+5);
				$lbl_summary.setVisible(true);
			}
		}
	};
	this.reload = function() {
		var tabId = CURRENT_CURSOR.getId();
		var panel_obj = eval("$" + tabId + "_view");
		Object.removeChild(panel_obj);
		Object.appendChild(panel_obj);
		if (CURRENT_CURSOR != null)
			this.setBluer(CURRENT_CURSOR);
		this.setCursor((CURRENT_CURSOR = eval("$" + tabId)));
		this.setPosition();
	};
	this.print = function() {
		window.print();
	};
	this.getCurrentTab = function() {
		return CURRENT_CURSOR.getId() + "_view";
	};
	this.getCurrentLabel = function() {
		return Xwing.getLabel(CURRENT_CURSOR.getId());
	};
	this.popupTab = function() {
		var w = window
				.open(
						'../'
								+ eval("$" + tab.getCurrentTab() + ".getUrl()")
										.substring('service::'.length),
						'window',
						'width=1050,height=780,left=0,top=0,status=0,toolbar=0,scrollbars=0,directories=0,location=0,resizable=1');
		w.focus();
	};
	this.setContainer();
	this.addTab(LABEL, URL);
};

/*******************************************************************************
 * 화면 이동 함수
 ******************************************************************************/
function movePage(url, param, hiddenVal, label) {
	/*
	 * children page에 아래 코드 추가 ex)
	 * parent.movePage("SRC/SRC010.xhtml",parameter,false,''); -> parameter:
	 * channel|sdate|edate|keyword
	 * parent.movePage("REC/REC010.xhtml",category,true,'녹취리스트');
	 */
	//		+ label);
	
	var idx = $DS_MENU.indexOfRow("URL",url);
	
	if(idx == -1){ 
		xwing.Dialog.alert("화면 권한이 없습니다."); 
		return;
	}
	_hidden_val = hiddenVal;
	_parameter = param;
	if (hiddenVal) {
		_label = label.trim();
		tab.addTab(label, "service::" + url);
	} else {
		var idx = $DS_MENU.indexOfRow("URL", url);
		tab.addTab($DS_MENU.getValue(idx, "CAPTION"), (g_isEmpty(url) ? ""
				: "service::" + url));
	}

	for (var i = 0; i < TAB_OBJECT.length; i++) {
		if (label.length > 9) {
			label = label.substr(0, 9) + "..";
		}
		if (TAB_OBJECT[i].getValue() == label) {
			_load_val=true;
		}
	}

	_menuId = tab.getCurrentTab();
	if (!_load_val) { // add->setCursor
		_load_val = true;

	} else { // setCursor
		eval("Xwing.children." + _menuId + ".reciever('" + _parameter + "')");
	}
}
