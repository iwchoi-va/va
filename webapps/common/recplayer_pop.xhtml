<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var getParameter = function (param) {
    var returnValue;
    var url = location.href;
    var parameters = (url.slice(url.indexOf('?') + 1, url.length)).split('&');
    for (var i = 0; i < parameters.length; i++) {
        var varName = parameters[i].split('=')[0];
        if (varName.toUpperCase() == param.toUpperCase()) {
            returnValue = parameters[i].split('=')[1];
            return decodeURIComponent(returnValue);
        }
    }
};

function login_load(event) {
	var v_contact_id = getParameter("contact_id");
	var v_start_time = getParameter("start_time");
	var v_play_user_id = getParameter("play_user_id");
	
	var v_http_url = "http://127.0.0.1:8090/MSENS/player_html5/player.html?contact_id=" + v_contact_id + "&start_time=" + v_start_time + "&play_user_id=" + v_play_user_id;
	
	var w = window.open(v_http_url, "V-SENS PLAYER", "width=500, height=677, left=0, top=0, location=no, resizable=no, menubar=no, status=no");
	
	if (w == null) {
		alert("팝업차단을 해제 후 로그인 해 주세요.");
		return;
	}
	
	self.opener = self;
	window.close();
}

function openTunning(paramSet) {
	tunning_popup(paramSet);
}/*]]>*/</script>
