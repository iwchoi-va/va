<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/var requestId	= "service::cs.com.help.do";	//request명
var sys_grade = "20,99";			//최고관리자권한코드
var mode;							//편집모드
var c_menuid;							// 메뉴 id
var savePath ;        				//파일이 저장될 경로
var c_url;							//경로

function help_load(event) {
	XwingObject();
	
	c_menuid = Xwing.param.menuId; 
	var menuName = Xwing.param.menuName;
	
	$edt_name.setValue(menuName);

	if (sys_grade.indexOf(global("G_USER_GRADE")) == -1) {
		btn_del.Visible			= false;
		btn_save.Visible	 	= false;
		btn_cancle.Visible		= false;
	}
	
	f_codebook_sel();	// 저장경로 가져오기
	
}

//*---------------------------------------------------
//* 트랜잭션 콜백
//* parameter : 
//* return value : null
//*---------------------------------------------------
function callback(reqId, res, err, xhr){
	//*------------------------ 이 부분은 공통으로 사용하세요 ----------------------------
	Xwing.log("================ [ Callback ] ================");
	Xwing.log("reqID : " + reqId);
	Xwing.log("res : " + res);
	Xwing.log("err : " + err);
	Xwing.log("xhr : " + xhr);
	
	//* Response 시 에러 발생한 경우
	if(res.Error != '0'){
//		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		var resultMsg = res.ResultMessage;
		var resultMsg = resultMsg.split('REASON :');
		alert('REASON : ' + resultMsg[1]);
		return;
	}
	
	switch(reqId)
	{
		case "getHelp" :
			$ds_help.setData(res.CS_MAIN_HELP_SEL.column, res.CS_MAIN_HELP_SEL.record);
			callbackgetHelp();
		break;
		case "setHelp" :
			if($ds_fileup_image.size() > 0)
			{
				saveImage();
			}
			Xwing.Dialog.alert( '저장되었습니다.');
			//ds_help.AddRow();
			mode = "";
			
			Xwing.getPanel('pnl_help').setUrl('../info/wysiwyg/view.jsp');
			$btn_save.setValue('수정');
		break;
		case "delHelp" :
			Xwing.Dialog.alert( '삭제되었습니다.');			
			Xwing.parent.Xwing.getDialog("help").close();
		break;
		case "f_codebook_sel":
			$ds_SYS031.setData(res.SYS010.column, res.SYS010.record);
			
			callbackgetCodes();
		break;
		
		default :
	}
}

function f_codebook_sel() {
	var param = {
			cmd : "getCodes",
			codeType : "SYS010",
			useyn : "Y"
		};
		var opt = {
			reqId : "f_codebook_sel",
			url : "service::cs.com.codeutil.do",
			param : param,
			indicator : false
		};
		Xwing.request(opt, callback);
}

function callbackgetCodes() {
	savePath = $ds_SYS031.lookUp("CODEID","HLP","CODENAME")+"/";
	c_url	 = $ds_SYS031.lookUp("CODEID","G_URL","CODENAME");
}

//*---------------------------------------------------
//* 도움말조회
//* parameter : 
//* return value : null
//*---------------------------------------------------
function getHelp()
{
    var sqlName         = "cs.main.help.sel";     
	
	var opt = {
			reqId: 'getHelp',
			url: requestId,
			param:{ _sqlName : sqlName,
				menuid : c_menuid
		          },
			indicator: null,
			showError: true
		};
	Xwing.request(opt, callback);	
	
}

/**
 * 저장/수정 버튼 클릭
 * @param event
 */
function btn_save_click(event) {
	if(mode == "modify")
	{
		var sqlName;     
		var menuid = c_menuid;
		var user_id = global("G_USER_ID");
		var doc = readCode();
		
		if($ds_help.size() > 0) {
			sqlName = 'cs.main.help.upd';
		} else {
			sqlName	= "cs.main.help.ins";
		}
		
		var opt = {
				reqId: 'setHelp',
				url: requestId,
				param:{ _sqlName : sqlName,
					doc : doc,
					menuid : menuid,
					user_id : global('G_USER_ID')
			          },
				indicator: null,
				showError: true
			};
		Xwing.request(opt, callback);	
		
		
		
	}
	else
	{
		var iframe = document.getElementById('if::pnl_help');

		var fDoc = null;;

		if(iframe) {
			var frm = iframe.contentWindow || iframe.contentDocument;
			
			if (frm.document) {
			    fDoc = frm.document;
			}
		}
		
		fDoc.getElementById('btnedit').click();
		$btn_save.setValue('저장');
		mode = "modify";
		
	}
}

// 도움말 조회 내용 표시
function callbackgetHelp() {
	var docInit = $ds_help.getValue(0, 'document');
	var iframe = document.getElementById('if::pnl_help');

	var fDoc = null;;

	if(iframe) {
		var frm = iframe.contentWindow || iframe.contentDocument;
		
		if (frm.document) {
		    fDoc = frm.document;
		}
		fDoc.all.document_init.value = docInit;
		fDoc.getElementById('btncont').click();
	}
}


//*---------------------------------------------------
//* 에디터 데이터 읽기
//* parameter : 
//* return value : null
//*---------------------------------------------------
function readCode()
{ 
    var iframe = document.getElementById('if::pnl_help');
    
	var fDoc = null;;
    var docVal = '';
    
	if(iframe) {
		var frm = iframe.contentWindow || iframe.contentDocument;
		
		if (frm.document) {
		    fDoc = frm.document;
		}
		
		docVal = fDoc.getElementById("textarea1").value;
	}
 

	return docVal;
}


/**
 * 삭제버튼 클릭시
 * @param event
 */
function btn_del_click(event) {
	this.del = function(event) {
		if(event) {
			var opt = {
					reqId: 'delHelp',
					url: requestId,
					param:{ _sqlName : 'cs.main.help.del',
						menuid : c_menuid
				          },
					indicator: null,
					showError: true
				};
			Xwing.request(opt, callback);	
		} else {
			return;
		}
	};
	
	new xwing.Dialog.confirm('도움말을 삭제하시겠습니까?', '도움말 삭제', 'del');
}

/**
 * 취소 버튼 클릭시 창 닫기
 * @param event
 */
function btn_cancle_click(event) {
	Xwing.parent.Xwing.getDialog("help").close();
}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="ds_help">
		<xwing:dataset-column id="menu_id"></xwing:dataset-column>
		<xwing:dataset-column id="document"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="ds_helpins">
		<xwing:dataset-column id="menuid"></xwing:dataset-column>
		<xwing:dataset-column id="user_id"></xwing:dataset-column>
		<xwing:dataset-column id="doc"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="ds_SYS031">
		<xwing:dataset-column id="CODEID"></xwing:dataset-column>
		<xwing:dataset-column id="CODENAME"></xwing:dataset-column>
	</xwing:dataset>
	<xwing:dataset id="ds_fileup_image"></xwing:dataset>
</xwing:data>
</head>
<body>
	<xwing:page id="help" title="New Page" width="600" height="550" load="help_load" top="-1" scroll="false">
		<xwing:group id="grp_dialplan_detail" left="10" top="10" height="40" width="580" anchor="none" scroll="false" styles="div_perform">
			<xwing:label id="lbl_vec_step_vdn" left="0" top="8" value="화면명" height="20" width="50" styles="label"></xwing:label>
			<xwing:edit id="edt_name" left="55" top="8" height="20" width="515" styles="edit_readonly"></xwing:edit>
		</xwing:group>
		<xwing:button id="btn_del" value="삭제" left="10" top="520" height="20" width="48" styles="btn_action" anchor="bottom left" click="btn_del_click"></xwing:button>
		<xwing:button id="btn_save" value="수정" left="489" top="520" height="20" width="48" styles="btn_action" anchor="right bottom" click="btn_save_click"></xwing:button>
		<xwing:button id="btn_cancle" value="취소" left="542" top="520" height="20" width="48" anchor="right bottom" click="btn_cancle_click"></xwing:button>
		<xwing:group id="group0" left="10" top="60" styles="div_perform_em" width="580" height="450" anchor="all">
			<xwing:panel id="pnl_help" left="10" top="10" width="558" height="427" borderwidth="0" url="../info/wysiwyg/view.jsp" anchor="all">
			</xwing:panel>
		</xwing:group>
	</xwing:page>
</body>
</html>
