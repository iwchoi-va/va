		var width, height,option;

		$( window ).bind("resize", function(){
			width = parent.$pnl_pie_chart.getAttribute("width");
			height =  parent.$pnl_pie_chart.getAttribute("height");
			$("#container").width( width ); 
			$("#container").height(height);  // 40: legend-y
			 chart.resize(width - 20, height-100, true);
		});

		$(function () {
			var category = new Array();
			
			var ds_grade = parent.$DS_GRADE;
			var pie_size = (parent.$pnl_pie_chart.getAttribute("width") - 150); 
				
			function getData(){
				var data = new Array();
				var sum = 0;
			        
			    for ( var j=0; j<ds_grade.size(); j++ ) {
			       sum += Number(ds_grade.getValue(j,'COUNT'));  //파이차트용
			    }
			        
				for(var i =0; i<ds_grade.size(); i++ ){
					if(ds_grade.getValue(i, "COUNT") == 0){
						data.push({
							value: '',	
							name: ds_grade.getValue(i,"GRADE")+"("+ ds_grade.getValue(i, "COUNT") +"건)",
							label:{show:false}
						})
					}else{	
						data.push({
								value: Number(ds_grade.getValue(i, "COUNT") / sum * 100),	
								name: ds_grade.getValue(i,"GRADE")+"("+ ds_grade.getValue(i, "COUNT") +"건)"
							})
					}	
				}
				return data;
				
				
			}

			        	}

		            seriesArray.push(series);

				    return seriesArray;

					}
		        	
		        	return data;
				}
			
				 option = {
