		<script type='text/javascript' src='./lib/echarts.min.js'></script>	

		<div id="container" style="padding-top:15px;"></div>
		
		<script>//<![CDATA[ 

	var width, height,option;
	var chart = echarts.init(document.getElementById('container'));
	$( window ).bind("resize", function(){
		width = parent.$pnl_multi_chart.getAttribute("width");
		height = parent.$pnl_multi_chart.getAttribute("height");
		
		$("#container").width( width ); 
	    $("#container").height(height-20); // 55: padding-top
	    chart.resize(width+60, height-20, true);
	});
	
	window.onload = function(){
		document.body.oncontextmenu = function(){return false;};
	}
	
	$(function () {
		var date = new Array(); 
		var ced_cnt = new Array(); 
		var script_score = new Array(); 
		var avg_ban_cnt = new Array();
		var avg_men_cnt = new Array();
		var secret_score = new Array();
		var focus_score = new Array();
		var grade_score = new Array();
		var bef_score = new Array();
		
		//dataset 데이터 셋팅
		
		var dsObj = parent.$DS_MULTI_RES;
		
		for(var i=0; i<dsObj.size(); i++){ 
			date[i] = dsObj.getValue(i,"WORK_MONTH_NM"); 
			ced_cnt.push({
				value: Number(dsObj.getValue(i,"CED_CNT")),	
				label:{show:Number(dsObj.getValue(i,"CED_CNT"))!=0?true:false}
			});
		
		
		script_score.push({
				value: Number(dsObj.getValue(i,"VRS_SCORE")),	
				label:{show:Number(dsObj.getValue(i,"VRS_SCORE"))!=0?true:false}
			});
			
	
		avg_ban_cnt.push({
				value: Number(dsObj.getValue(i,"AVG_BAN_CNT")),	
				label:{show:Number(dsObj.getValue(i,"AVG_BAN_CNT"))!=0?true:false}

		});
	
		avg_men_cnt.push({
				value: Number(dsObj.getValue(i,"AVG_MEN_CNT")),	
				label:{show:Number(dsObj.getValue(i,"AVG_MEN_CNT"))!=0?true:false}
			});
		
		secret_score.push({
			value: Number(dsObj.getValue(i,"SEC_SCORE")),	
			label:{show:Number(dsObj.getValue(i,"SEC_SCORE"))!=0?true:false}
		});
			
		
		
		focus_score.push({
			value: Number(dsObj.getValue(i,"FOC_SCORE")),	
			label:{show:Number(dsObj.getValue(i,"FOC_SCORE"))!=0?true:false}
		});
		
		
		grade_score.push({
				value: Number(dsObj.getValue(i,"GRADE_SCORE")),	
				label:{show:Number(dsObj.getValue(i,"GRADE_SCORE"))!=0?true:false}
			});
	
		
		bef_score.push({
				value: Number(dsObj.getValue(i,"BEF_SCORE")),	
				label:{show:Number(dsObj.getValue(i,"BEF_SCORE"))!=0?true:false}
			});
		}
		
		function getData(ds){
			
			switch(ds){
				case "ced_cnt" :
					return ced_cnt;
				break;
				case "script_score":
				 	return script_score;
				break;
				
				case "avg_ban_cnt":
					 return avg_ban_cnt;
				break;
				case "avg_men_cnt" :
					return avg_men_cnt;
				break;
				
				case "secret_score" :
					return secret_score;
				break;
				
				case "focus_score" :
					return focus_score;
				break;
				
				case "grade_score" :
					return grade_score;
				break;
				case "bef_score" :
					return bef_score;
				break;
				
				
			}
		}
		
		function getDateName(value) {
			//var value = params[i].name;
			if(parent.gubun == 'D'){
				var str = value.substring(0,4)+'-'+value.substring(4,6)+'-'+value.substring(6,8);
				return (str + '').replace(/([^>\r\n]?)(\r\n|\n\r|\r|\n)/g, '$1\n$2');
			}
			else if(parent.gubun == 'M') return value.substring(0,4)+"-"+value.substring(4,6);
			else if(parent.gubun == 'H') return value.substring(0,4)+"-"+value.substring(4,6)+"-"+value.substring(6,8)+" ("+value.substring(8,10)+'시)';
		}

		
		option = {
			    tooltip: {
			        trigger: 'axis',
			        position: function (point, params, dom, rect, size) { //tooltip 위치 지정
			            return [point[0], '10%'];
			        },
			        padding : [5,10,5,10],
			        textStyle:{
			        	fontSize : 12
			        },
			        formatter: function (params, ticket, callback) {
					//	params[0].name = getDateName(params[0].name);
			        	var res = params[0].name;
			            for (var i = 0, l = params.length; i < l; i++) {
			            	switch(params[i].seriesName){
	            				case "금칙어평균건수" :
				          //  	case "필수멘트" :
				            	case "설계건수" :
			            			res += '<br/>' + params[i].seriesName + ' : ' + params[i].value + "건";
		           				break;
			            		case "전월평가평균점수" :		
			            		case "Grade평균점수" :
			            			res += '<br/>' + params[i].seriesName + ' : ' + params[i].value + "점";
			            		break;
				            	case "준수율" :
			            		case "개인정보처리율" :
			            	//	case "집중관리처리율" :	
				            			res += '<br/>' + params[i].seriesName + ' : ' + params[i].value + "%";
				            		break;
			            	}
			            }
			            return res;
			        }

			        feature: {
			            restore: {show: true,title:'새로고침'}

			    	data:['설계건수','금칙어평균건수','준수율','개인정보처리율','전월평가평균점수','Grade평균점수']

			       //     boundaryGap: ['00%', '20%'],

			                formatter: function (value, index) {
			                	var str = value.split("~");
			                	
			                	if(str[1]==undefined) str=str[0]; else str=str[0]+"~"+'\n'+str[1];
                			    return str;
			                }
		            	},
			            axisPointer: {
			                type: 'shadow'
			            }
			        
			        }

						{
						    type: 'value',

						    min: 0,
						   // interval: 10,
						    axisLabel: {
						        formatter: '{value}'
						    }
						},
						{
				            type: 'value',
				            name: '점수',
				            min: 0,
				            max: 100,
				            interval: 30,
				            axisLabel: {
				                formatter: '{value}'
				            }
				        }
				    ],
				    series: [
								{
								    name:'설계건수',
								    type:'bar',
								    data:getData("ced_cnt"),
								    itemStyle: {
								    	color: ['#4CC8E9']
								    		//['#7CB5EC']
											//['#337B9D']
								    },
								    label: {
								    	show:true,
								    	position:'top'
								
								    }
								},
								{
								    name:'금칙어평균건수',
								    type:'bar',
								    data:getData("avg_ban_cnt"),
								    itemStyle: {
								    	color:  ['#0073AE']
								    		//['#6F7A84']
											//['#338FBE']
								    },
								    label: {
								    	show:true,
								    	position:'top'
								
								    }
								},
								/* {
						            name:'필수멘트',
						            type:'bar',
						            data:getData("avg_men_cnt"),
						            itemStyle: {
						            	color: ['#33B6E9']
						            		//['#7CB5EC']
						            },
						            label: {
						            	show:true,
						            	position:'top'
						    
						            }
						        }, */
								{
								    name:'준수율',
								    type:'line',
								    yAxisIndex: 1,
								    data:getData("script_score"),
								    itemStyle: {
								    	color: ['#EDB937']
								    		//['#7CB5EC']
						        			//['#E1907D']
								    },
								    label: {
								    	show:true,
								    	position:'top'
								
								    }
								},		             
							
							/* {
							    name:'집중관리처리율',
							    type:'line',
							    data:getData("focus_score"),
							    itemStyle: {
							    	color:  ['#ACE174']
							    		//['#6F7A84']
							    },
							    label: {
							    	show:true,
							    	position:'top'
							
							    }
							},     */
							{
							    name:'개인정보처리율',
							    type:'line',
							    yAxisIndex: 1,
							    data:getData("secret_score"),
							    itemStyle: {
							    	color:  ['#D25649'] 
							    		//['#6F7A84']
						    			//['#F2BA81']
							    },
							    label: {
							    	show:true,
							    	position:'top'
							
							    }
							},
					        
					        {
					            name:'전월평가평균점수',
					            type:'line',
					            yAxisIndex: 1,
					            data:getData("bef_score"),
					            itemStyle: {
					            	color: ['#D98FB2']
					            		//['#7CB5EC']
										//['#FEDF8F']
					            },
					            label: {
					            	show:true,
					            	position:'top'
					    
					            }
					        },
					        
					        {
					            name:'Grade평균점수',
					            type:'line',
					            yAxisIndex: 1,
					            data:getData("grade_score"),
					            itemStyle: {
					            	color: ['#A2BC4F']
					            		//['#7CB5EC']
					        			//['#D98FB2']
					            },
					            label: {
					            	show:true,
					            	position:'top'
					    
					            }
					        }
					    ]
					};
			if (option && typeof option === "object") {
				chart.setOption(option,true);
			}
