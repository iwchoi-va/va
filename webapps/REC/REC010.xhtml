/* **********************************************************
 *  연동화면 호출 함수
 *************************************************************/
function reciever(){
	btn_reset_click();

	setTimeout(function(){

		//키워드
		keyword = parent._parameter.keyword;
		if(!g_isNull(keyword)) $edt_keyword.setValue(keyword);

		//일시
		gubun = parent._parameter.gubun;
		
		sdate = parent._parameter.s_date;
		edate = parent._parameter.e_date;
		stime = parent._parameter.s_time;
		etime = parent._parameter.e_time;
		if(g_isNull(gubun)) gubun = 1;
		$cbo_gubun.setValue(gubun); 
		cbo_gubun_change();
	
		if(gubun == 0){
			if(!g_isNull(sdate)) $dpk_date.setValue(sdate);
			if(!g_isNull(stime)) $edt_stime.setValue(stime);
			if(!g_isNull(etime)) $edt_etime.setValue(etime);
		}else{
			if(!g_isNull(sdate)) $dpk_from_date.setValue(sdate);
			if(!g_isNull(edate)) $dpk_to_date.setValue(edate);
		}
		

		//설계번호
		ced_no = parent._parameter.ced_no;
		if(!g_isNull(ced_no)) $edt_ced_no.setValue(ced_no);

		//소속
		$cmb_org1.setValue('');
		_common_dept_change(0); //연동화면에서는 조직 정보 없어..
		//초기화
		PAGE=0;
		$DS_LIST.clearData();

		//재조회
		rcmHistory();

	}, 300); //init 조직설정이랑 겹쳐서 셋팅이 안됨.
}


/* **********************************************************

function f_getCode() {
	var param = {
			cmd : "getCodes",
			codeType : "RPT200,SYS101,SYS021",
			useyn : "Y"
		};
		var opt = {

		};

}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case 'getCodes' :
			$DS_RPT200.setData(res.RPT200.column, res.RPT200.record);
			$DS_SYS101.setData(res.SYS101.column, res.SYS101.record);
			$DS_SYS021.setData(res.SYS021.column, res.SYS021.record);
			
			var hostname = window.location.hostname.split(".");
			
			if(hostname[0] == "vadev"){
				url = $DS_SYS021.getValue(0,"ETC1");
			}else if(hostname[0] == "vauat"){
				url = $DS_SYS021.getValue(1,"ETC1");
			}else if(hostname[0] == "va"){
				url = $DS_SYS021.getValue(2,"ETC1");
			}else{
				url = $DS_SYS021.getValue(2,"ETC1");
			}
			
			//alert(url);
			//오늘 일자 set
			$cbo_gubun.setItemindex("1");
			cbo_gubun_change();
			var date = checkDateFormat();
			//var date = '20180101';
			$dpk_date.setValue(date);
			$dpk_from_date.setAttribute('value', g_addDate('d',-7,g_toDate(),''));
			$dpk_to_date.setAttribute('value', date);
			//$dpk_to_date.setAttribute('value', "20180301");
			//근무시간에 맞는 시간 set
			$ds_time.copyFrom($DS_RPT200);

			if(gubun == "0"){
				$edt_stime.setValue($ds_time.getValue($ds_time.indexOfRow('CODEID',$DS_SYS101.getValue(0,'ETC3')), 'ETC1') + '00');
				$edt_etime.setValue($ds_time.getValue($ds_time.indexOfRow('CODEID',$DS_SYS101.getValue(0,'ETC4')), 'ETC2') + '59');
			}else{
				$edt_stime.setValue('000000');
				$edt_etime.setValue('235959');
			}

			g_createOrg("pan_dept", 3, "Y", "Y", "Y", "", "전체", false, true);
			PAGE=0;
			$DS_LIST.clearData();
			//g_createcnsl("pan_cnsl", 3);

			setTimeout(function(){
				if(parent._load_val) reciever(parent._parameter);
			},300); //init 조직설정이랑 겹쳐서 셋팅이 안됨.

		break;

		case "sch_rm":
			$DS_RES.setData(res.DS_RES.column, res.DS_RES.record);
			
			if($DS_RES.getValue('CON_ENT_DGN_NO')=='') $DS_RES.removeRow(0);

			TOT_CNT = res.TOTAL;
			// paging처리 안된 총 건수
			var totalCount = res.TOTAL;
			Xwing.getEdit('edt_listCnt').setValue(totalCount);	//엑셀 row 개수 확인

			$DS_LIST.appendDataset($DS_RES);
			// "+더보기" 표기여부
			if(totalCount>$DS_LIST.size()) $label_more.setVisible(true);
			else $label_more.setVisible(false);

			var row = (PAGE-1)*DISPLAY_CNT;

			$DS_LIST.setCursor(row);


		break;
		
		case "excel_down" :
			$DS_EXCEL.setData(res.DS_RES.column, res.DS_RES.record);
			
				$grd_list_excel.setBinddataset('DS_EXCEL');
				$grd_list_excel.exportData('녹취리스트','../jsp/export2.jsp', true);
				$grd_list_excel.setBinddataset('');
				//Xwing.getDataGrid('grd_list').exportData('녹취리스트',global('G_SERVERURL') + '/jsp/export2.jsp', true);
			
		break;

		case "savePlayLog":
			//nothing...
		break;
	}
}

	}
//	if(stime.length < 6 || etime.length < 6) {
//		new xwing.Dialog.alert("시간을 다시 설정해 주세요. ex)090000 6자리", '시간 설정 오류');
//		return false;
//	}

	var shour = stime.substring(0,2);
	var smin = stime.substring(2,4);
	var ssec = stime.substring(4,6);

	var ehour = etime.substring(0,2);
	var emin = etime.substring(2,4);
	var esec = etime.substring(4,6);

	switch ($cbo_gubun.getValue()){
		case '0':
			sdate = new Date($dpk_date.getYear(), $dpk_date.getMonth(), $dpk_date.getDate(), shour, smin, ssec);
			edate = new Date($dpk_date.getYear(), $dpk_date.getMonth(), $dpk_date.getDate(), ehour, emin, esec);

			if (sdate > edate) {
				new xwing.Dialog.alert("시작시간이 종료시간보다 큽니다.", '시간 설정 오류');
				$edt_stime.focus();
				result = false;
			}
			break;
		case '1':
			sdate = new Date($dpk_from_date.getYear(), $dpk_from_date.getMonth(), $dpk_from_date.getDate(), shour, smin, ssec);
			edate = new Date($dpk_to_date.getYear(), $dpk_to_date.getMonth(), $dpk_to_date.getDate(), ehour, emin, esec);

			if (sdate > edate) {
				new xwing.Dialog.alert("시작일자가 종료일자보다 큽니다.", '시간 설정 오류');
				$dpk_from_date.focus();
				result = false;
			}

//			if (parseInt((edate-sdate)/1000/60/60/24) > 92){
//				alert("최대 검색기간을 초과하였습니다. \n3개월 사이로 설정하십시오.");
//				result = false;
//			}
			break;
	}
	return result;
}

function expr_date(cellObj,rowIdx) {
	var opt = {};
	var date = $DS_LIST.getValue(rowIdx,'UCID_DATE');
	var str = date.substring(0,4)+"-"+date.substring(4,6)+"-"+date.substring(6,8);
	str += " "+date.substring(8,10)+":"+date.substring(10,12)+":"+date.substring(12,14);
	opt['value'] = str;
	return opt;
}


function expr_user(cellObj,rowIdx) {
	var opt = {};
	if($DS_LIST.getValue(rowIdx,'USER_ID') != '')
		opt['value'] = $DS_LIST.getValue(rowIdx,'USER_NAME')+" ("+$DS_LIST.getValue(rowIdx,'USER_ID')+")";
	return opt;
}

function expr_time(cellObj,rowIdx) {
	var opt = {};
	opt['value'] = $DS_LIST.getValue(rowIdx,'UCID_DATE').substring(8,14);
	return opt;
}


function expr_duration(cellObj,rowIdx) {
	var opt = {};
	var totalSeconds = $DS_LIST.getValue(rowIdx,'DURATION');

	totalSeconds = Math.floor(totalSeconds / 100);
	var h = (Math.floor(totalSeconds / 3600)).toString();
	totalSeconds %= 3600;
	var m = (Math.floor(totalSeconds / 60)).toString();
	var s = (Math.floor(totalSeconds % 60)).toString();

	opt['value'] = (h.length==1?"0"+h:h) + ":" + (m.length==1?"0"+m:m) + ":" + (s.length==1?"0"+s:s);
	return opt;
}
