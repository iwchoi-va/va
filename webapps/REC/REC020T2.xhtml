/* **********************************************************
 *  코드북 로드 함수
 *************************************************************/
function f_getCode() {
	var param = {
			cmd : "getCodes",
			codeType : "SYS170",
			useyn : "Y"
		};
		var opt = {
			reqId : "getCodes",
			url : "service::cs.com.codeutil.do",
			param : param
		};
	Xwing.request(opt, callback);
}

/* ***********************************************************
 * 	콜백  함수
 *************************************************************/
function callback(reqId, res, err, xhr){
	if( res.Error != '0' ){
		alert('ResultCode : ' + res.ResultCode + '\n\n' + 'ResultMessage : ' + res.ResultMessage);
		return;
	}

	switch (reqId) {
		case 'getCodes' :
			$DS_SYS170.setData(res.SYS170.column, res.SYS170.record);
		break;

		case "btn_search_click":
			$DS_LIST.setData(res.DS_LIST.column, res.DS_LIST.record);
			
			c_totalPage	= Math.ceil(res.DS_CNT_LIST.record[0]/c_pageSize);
			Xwing.getEdit("edt_listCnt").setValue(res.DS_CNT_LIST.record[0]);
			setPaging();
			
			if(DS_REC_LIST.length > 0 ) DS_REC_LIST = [];
			for(var i =0; i< res.DS_LIST.record.length; i++){
				var temp = {};
				for(var j=0; j< res.DS_LIST.column.length; j++){
					var key = res.DS_LIST.column[j];
					temp[key] = res.DS_LIST.record[i][j];
				}
				
				DS_REC_LIST.push(temp);
			}
			
			var iframe = document.getElementById('if::pnl_rec_grid');

			var fDoc = null;

			if(iframe) {
				var frm = iframe.contentWindow || iframe.contentDocument;
				
				if (frm.document) {
				    fDoc = frm.document;
				}
			}
			
			frm.reloadGrid();
			
			
		break;
		
		case "est_save":
			xwing.Dialog.alert("심사 되었습니다.");
			est_area_clear();
			est_area_toggle(false);
			btn_search_click();
		break;
		
		case "getUcid":
			$DS_META.setData(res.DS_META.column, res.DS_META.record);
			$DS_UCID.setData(res.DS_UCID.column, res.DS_UCID.record);
			$DS_DURA.setData(res.DS_DURA.column, res.DS_DURA.record);
			if($DS_UCID.size() == 0){ // sponsor에도 없는 설계
				xwing.Dialog.alert("녹취가 존재하지 않습니다.");
				return;
			}
		break;
		
		case "excel_down" :
			$DS_EXCEL.setData(res.DS_RES.column, res.DS_RES.record);
			
				$grd_list_excel.setBinddataset('DS_EXCEL');
				$grd_list_excel.exportData('녹취리스트','../jsp/export2.jsp', true);
				$grd_list_excel.setBinddataset('');
				//Xwing.getDataGrid('grd_list').exportData('녹취리스트',global('G_SERVERURL') + '/jsp/export2.jsp', true);
			
		break;

		case "savePlayLog":
			//nothing...
		break;
	}
}


/* ***********************************************************
 * 	녹취리스트 조회  함수
 *************************************************************/
function btn_search_click(event) {
	if(event != undefined){
		c_page = 1;
		c_start = 0;
	}
	
	getSPCallList();
}

function getSPCallList(){
	
	if ($dpk_from_date.getValue() > $dpk_to_date.getValue()) {
		new xwing.Dialog.alert("종료일자가 시작일자보다 작습니다.", '시간 설정 오류');	
		Xwing.getEdit("dpk_from_date").focus();
		
		return;
	}
	
	if(diffDate($dpk_from_date.getValue(),$dpk_to_date.getValue()) > 32){
		new xwing.Dialog.alert("한달 이상의 기간 설정이 불가능합니다.", '시간 설정 오류');
		return;
	}
	
	var spCode = ""; 
	
	if($cmb_org2.getValue() != ''){
		spCode += "'" + $DS_SYS170.getValue($DS_SYS170.indexOfRow("ETC1", $cmb_org2.getValue()),"ETC2") + "'";
	}else{
		for(var i =0 ;i< $DS_SYS170.size(); i++){
			spCode += "'"+$DS_SYS170.getValue(i,"ETC2") + "',";
		}

		spCode = spCode.slice(0,-1);
	}

	$DS_LIST.clearData();

	var sdate = $dpk_from_date.getValue()+"000000";
	var edate = $dpk_to_date.getValue()+"235959";
	
	var param	= {
			_sqlName: "rec.rec020t2.notmatchedList.totCount.sel,rec.rec020t2.notmatchedList.sel",
			SDATE:sdate,
			EDATE:edate,
			AGENT_NM : $edt_user_name.getValue(),
			CED_NO:$edt_ced_no.getValue(),
			MRLS_GB:$cmb_mrls_gb.getValue(),
			CUST_NM:$edt_cust_nm.getValue(),
			SPCODE : spCode
			, _START : c_start
			, _PAGESIZE : c_pageSize

	};
	
	var opt 	= {
			reqId: "btn_search_click",
			url: v_url,
			param: param,
			indicator : null
	};
	Xwing.request(opt, callback);

}

 * 	리스트 클릭 이벤트  함수 -> 플레이어 실행

function rec_tbl_click(p_ucid, p_start_time, p_file_path){

	load_player(p_ucid, p_start_time, p_file_path, "");
}


/* ***********************************************************
 * 키워드 엔터 이벤트 함수
 *************************************************************/
function edt_sch_keyup(event) {
	if(event.event.keyCode == '13') {
			btn_search_click();
	}
}

function btn_reset_click(){
	//일자
	$dpk_from_date.setValue((g_addDate("m", -1, g_toDate()).substring(0,6)+"01")); 	//지난달 01~30
	$dpk_to_date.setValue(g_addDate("m", -1, g_toDate()).substring(0,6)+g_getLastDay(g_addDate("m", -1, g_toDate()).substring(0,6)));
	
	$edt_cust_nm.setValue("");
	$edt_ced_no.setValue("");
	$cmb_gubun.setValue("");
	
}

/*****************************************************
*페이징 처리
******************************************************/
function setPaging(){
	Xwing.getButton("btn_page_last").setEnabled(true);
	Xwing.getButton("btn_page_next").setEnabled(true);
	Xwing.getButton("btn_page_pre").setEnabled(true);
	Xwing.getButton("btn_page_first").setEnabled(true);

	if(c_totalPage > 0){
		$edt_curPage.setValue(c_page);
		$edt_totalPage.setValue(c_totalPage);
	}else{
		$edt_curPage.setValue("");
		$edt_totalPage.setValue("");
	}
	
	//페이징버튼세팅
	if( c_page == 1 || c_totalPage == 0 )
	{
		Xwing.getButton("btn_page_first").setEnabled(false);
		Xwing.getButton("btn_page_pre").setEnabled(false);
	}else{
		Xwing.getButton("btn_page_first").setEnabled(true);
		Xwing.getButton("btn_page_pre").setEnabled(true);
	}

	if( c_page == c_totalPage || c_totalPage == 0 )
	{
		Xwing.getButton("btn_page_last").setEnabled(false);
		Xwing.getButton("btn_page_next").setEnabled(false);
	}else{
		Xwing.getButton("btn_page_last").setEnabled(true);
		Xwing.getButton("btn_page_next").setEnabled(true);
	}

	if(c_totalPage > 1){
		$edt_curPage.setEnabled(true);
	}
}

function btn_page_first_click(event) {
	c_page = 1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_pre_click(event) {
	c_page = c_page-1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_next_click(event) {
	c_page = c_page+1;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function btn_page_last_click(event) {
	c_page = c_totalPage;
	$edt_curPage.setValue(c_page);
	c_start =(c_page-1)*c_pageSize;
	btn_search_click();
}

function cmb_page_change(event) {
	c_page = Xwing.getDataset("DS_PAGE_CNT").getValue((event.value-1), "PAGE");
	c_start = (c_page-1)*c_pageSize;

	btn_search_click();

}

function edt_curPage_keydown(event) {
	if(event.event.keyCode == '13') {
		if(parseInt($edt_curPage.getValue()) > c_totalPage){
			xwing.Dialog.alert("전체 페이지 수를 초과합니다.");
			$edt_curPage.setValue(c_page);
			return;
		}
		if(parseInt($edt_curPage.getValue()) < 1){
			xwing.Dialog.alert("0보다 큰 숫자를 입력해주세요.");
			$edt_curPage.setValue(c_page);
			return;
		}
		c_page = parseInt($edt_curPage.getValue());
		c_start = (c_page-1)*c_pageSize;
		btn_search_click();
	}
}


function load_player(rec_key, start_time,file_path,ced_no){
	
	var param={
			rec_key: rec_key,
			start_time : start_time,
			log_gb:'L',
			file_path : file_path,
			ced_no : ced_no
			
	};
	play(param, 'pan_player', 'N');
	
	//청약팝업에서만 플레이어영역 x축에 scroll만듬
	$('iframe').load(function(){
			$('iframe').contents().find("head").append($("<style type='text/css'> html { overflow-x:scroll !important;}</style>"));
	});
	
}


function page_resize(event) {
	var w = event.source._opt.width;
	var pw = 492;	//$pnl_play_area.getWidth(); 로딩시 값을 못가져올 때가 있음
	var Listsize = w-pw;
	
	if(w < 800){ //최대화 전
		$splitbar0.setLeft(Listsize-5);
		$pnl_play_area.setLeft(Listsize);
		$pnl_play_area.setWidth(pw);
		$pnl_list_area.setWidth(Listsize-5);
	}else{
		setTimeout(function(){
			$splitbar0.setLeft(Listsize-5);
			$pnl_play_area.setLeft(Listsize);
			$pnl_play_area.setWidth(pw);
			$pnl_list_area.setWidth(Listsize-5);
		},100);
	}
}/*]]>*/</script>
