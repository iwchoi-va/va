<script type="text/javascript" charset="UTF-8">/*<![CDATA[*/
function page_load(event) {
	XwingObject();
}


function btn_save_click(event) {
	
	var move = '';
	if($rdo_anl.getValue() == "call_anl"){
		move = "move";
	}else{
		move = "cus_move";
	}
		
	parent.rcmHistory(move);
	Xwing.parent.Xwing.getDialog("anl_grp").close();
}/*]]>*/</script>
<xwing:data>
	<xwing:dataset id="rdo_anl_grp">
		<xwing:dataset-column id="ID"></xwing:dataset-column>
		<xwing:dataset-column id="VALUE"></xwing:dataset-column>
		<xwing:dataset-row>
			<xwing:dataset-cell>call_anl</xwing:dataset-cell>
			<xwing:dataset-cell>콜분석</xwing:dataset-cell>
		</xwing:dataset-row>
		<xwing:dataset-row>
			<xwing:dataset-cell>cus_anl</xwing:dataset-cell>
			<xwing:dataset-cell>고객분석</xwing:dataset-cell>
		</xwing:dataset-row>
	</xwing:dataset>
</xwing:data>
</head>
<body>
	<xwing:page id="page" title="사원정보수정" width="185" height="105" load="page_load" left="24" top="24">

		</xwing:group>
		<xwing:button id="btn_save" value="선 택" left="115" top="75" anchor="none" styles="btn_action" width="60" tabindex="4" height="25" iconalign="left" borderwidth="0" shadow="0 0 0 " borderstyle="none" click="btn_save_click"></xwing:button>
	</xwing:page>
